<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141d38">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>TOEIC J-19</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one answer-sheet column; (A)(B)(C)(D) bubbles are the motif; navy "exam booklet" hero; tabs at the thumb on phone, on top on desktop */
:root{
  --paper:#f3f5fa;
  --sheet:#ffffff;
  --ink:#141d38;
  --ink-soft:#5a6480;
  --line:#dbe0ec;
  --blue:#2346c8;
  --blue-wash:#e7ecfc;
  --hero:#141d38;
  --hero-fg:#f3f5fa;
  --hero-soft:#a9b4d6;
  --marker:#ffd84d;
  --marker-ink:#3b2f00;
  --good:#15804d;
  --good-wash:#e2f4ea;
  --bad:#c23a2b;
  --bad-wash:#fbe8e5;
  --shadow:0 1px 2px rgba(20,29,56,.05),0 8px 28px rgba(20,29,56,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1122;--sheet:#151c33;--ink:#e9edf8;--ink-soft:#9ba6c3;--line:#29324f;
    --blue:#8fa7ff;--blue-wash:#1d2850;--hero:#1b2550;--hero-fg:#f3f5fa;--hero-soft:#aab6dd;
    --marker:#ffd84d;--marker-ink:#2a2100;
    --good:#4fca8c;--good-wash:#11331f;--bad:#ff8475;--bad-wash:#3b1916;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1122;--sheet:#151c33;--ink:#e9edf8;--ink-soft:#9ba6c3;--line:#29324f;
  --blue:#8fa7ff;--blue-wash:#1d2850;--hero:#1b2550;--hero-fg:#f3f5fa;--hero-soft:#aab6dd;
  --marker:#ffd84d;--marker-ink:#2a2100;
  --good:#4fca8c;--good-wash:#11331f;--bad:#ff8475;--bad-wash:#3b1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h2{font-size:1.65rem;font-weight:800;letter-spacing:-.015em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.note{font-size:.86rem;color:var(--ink-soft)}
.hl{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 .1em}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--f-mono);font-size:.74rem;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--marker)}.dot.err{background:var(--bad)}

nav.tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:6px 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs a{position:relative;flex:1;text-align:center;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:.9rem;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a .ico{font-family:var(--f-mono);font-size:.8rem;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
nav.tabs a[aria-current="page"]{color:var(--blue);background:var(--blue-wash)}
nav.tabs a[aria-current="page"] .ico{background:var(--blue);color:var(--sheet);border-color:var(--blue)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--sheet);font-family:var(--f-mono);font-size:.66rem;display:grid;place-items:center}
@media (max-width:640px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-bottom:0;border-top:1px solid var(--line);background:var(--sheet);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{font-size:.72rem}
}

.view{display:flex;flex-direction:column;gap:22px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--sheet);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--sheet)}
.btn.bad{background:var(--bad);color:var(--sheet)}
.btn.warn{background:var(--marker);color:var(--marker-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 12px;font-size:.88rem}
.btn .n{font-family:var(--f-mono);font-size:.8rem;background:rgba(0,0,0,.14);border-radius:6px;padding:1px 6px}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.08);box-shadow:0 0 0 26px rgba(255,255,255,.03),0 0 0 52px rgba(255,255,255,.02);pointer-events:none}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(4.2rem,19vw,6.8rem);line-height:.85;letter-spacing:-.045em}
.hero .big small{font-size:.32em;letter-spacing:0;vertical-align:top;margin-right:3px;color:var(--marker)}
.hero .eyebrow{color:var(--hero-soft)}
.hero p{max-width:36ch}
.hero .focus{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.25}
@media (max-width:420px){.hero{grid-template-columns:1fr;gap:12px}}

.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:inherit;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--sheet)}
.goal:hover{border-color:var(--blue)}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.done .fg{stroke:var(--good)}
.ring text{font-family:var(--f-mono);font-size:15px;font-weight:700;fill:var(--ink)}
.goal b{font-size:.9rem}
.goal span{font-size:.75rem;color:var(--ink-soft)}

.errbox{border:1.5px solid var(--bad);background:var(--bad-wash);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.errbox.clear{border-color:var(--good);background:var(--good-wash)}

.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--blue);min-height:3px}
.col .bar.empty{background:var(--line)}
.col .bar.today{background:var(--marker)}
.col .v{font-family:var(--f-mono);font-size:.72rem;font-weight:700}
.col .d{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-soft)}
.trend{display:flex;gap:16px;flex-wrap:wrap}
.trend div{display:flex;flex-direction:column}
.trend b{font-family:var(--f-mono);font-size:1.4rem}

.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.86rem;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.day .d{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-soft)}
.day.past{opacity:.55}
.day.now{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-wash)}
.day.exam{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.day.exam .d{color:var(--marker-ink)}

/* flashcards */
.flash{min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;cursor:pointer;user-select:none;position:relative}
.flash .word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.9rem);letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.05}
.flash .tr{font-size:1.35rem;font-weight:700;color:var(--blue)}
.flash .ex{font-style:italic;color:var(--ink-soft);max-width:44ch}
.flash.shown{border-color:var(--blue)}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-soft)}
.tag.red{border-color:var(--bad);color:var(--bad)}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.boxes .bx{flex:1;min-width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:.74rem;background:var(--sheet)}
.boxes .bx b{display:block;font-family:var(--f-mono);font-size:1.1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* quiz */
.q{font-size:1.22rem;line-height:1.55}
.q .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.q .fill{font-weight:700;color:var(--good);border-bottom:2px solid var(--good);padding:0 .15em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--sheet);cursor:pointer;font-size:1.03rem}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-wash)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.ko{border-color:var(--bad);background:var(--bad-wash)}
.opt.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.dim{opacity:.6}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--good)}.progress i.ko{background:var(--bad)}.progress i.cur{background:var(--blue)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
.retry{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:2px 7px}

.verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;font-weight:700;font-size:1.05rem}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.ko{background:var(--bad-wash);color:var(--bad)}
.verdict .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sheet);flex:none;font-family:var(--f-mono)}
.verdict.ok .ic{background:var(--good)}.verdict.ko .ic{background:var(--bad)}
.explain{display:flex;flex-direction:column;gap:12px}
.ex-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:baseline}
.ex-row > span:first-child{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
.ex-row > div{min-width:0}
.rule{border-left:4px solid var(--marker);padding:8px 12px;background:var(--paper);border-radius:0 10px 10px 0;font-weight:700}
.whys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.whys li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.whys .bub{width:24px;height:24px;font-size:.72rem}
.whys li.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.whys li.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.whys li.ok b{color:var(--good)}
@media (max-width:480px){.ex-row{grid-template-columns:1fr;gap:4px}}
.recap{display:flex;flex-direction:column;gap:12px}
.recap > div{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.result{font-family:var(--f-display);font-weight:800;font-size:3.4rem;color:var(--blue);line-height:1}

details.fiche{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
details.fiche summary{cursor:pointer;padding:14px 0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-soft)}
details.fiche[open] summary::after{content:"–"}
.fiche-body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fiche-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .opt,.goal,.btn{transition:background .15s,border-color .15s,transform .1s}
  .btn:active{transform:scale(.98)}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
  .ring .fg{transition:stroke-dashoffset .5s}
}

:root{--marker-wash:#fff5c7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--marker-wash:#3a3210}}
:root[data-theme="dark"]{--marker-wash:#3a3210}
.tipbox{background:var(--marker-wash);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tipbox .eyebrow{color:var(--ink)}
.opt.sel{border-color:var(--blue);background:var(--blue-wash)}
.opt.sel .bub{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.photo{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:flex-start;background:var(--paper)}
.photo .cam{flex:none;width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em}
.photo p{font-style:italic}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.doc .dh{font-family:var(--f-mono);font-size:.78rem;white-space:pre-line;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);color:var(--ink-soft)}
.doc .db{padding:14px;white-space:pre-line;font-size:.98rem;overflow-wrap:anywhere}
.slot{font-family:var(--f-mono);font-weight:700;background:var(--blue-wash);color:var(--blue);border-radius:6px;padding:0 6px;white-space:nowrap}
.slot.done{background:var(--good-wash);color:var(--good)}
.subq{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.subq:first-child{border-top:0;padding-top:0}
.subq .qt{font-weight:700;font-size:1.05rem}
.mini{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.mini.ok{color:var(--good)}.mini.ko{color:var(--bad)}
.script{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.script b{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft);margin-right:6px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.part{display:flex;flex-direction:column;gap:10px}
.part h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.part h3 .mono{font-size:.75rem;color:var(--ink-soft);font-weight:500}
.part .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft)}
.part .meta b{font-family:var(--f-mono);color:var(--ink)}
.prog{display:flex;flex-direction:column;gap:0}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:0}
.blk .min{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft);width:52px}
.blk .lbl{display:flex;flex-direction:column;gap:5px;min-width:0}
.blk .lbl b{font-size:.98rem}
.blk .track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.blk .track i{display:block;height:100%;background:var(--blue)}
.blk.done .track i{background:var(--good)}
.blk .cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft)}
.blk a.btn{padding:8px 12px;font-size:.85rem}
@media (max-width:480px){.blk{grid-template-columns:1fr auto}.blk .min{display:none}}
.score{display:flex;flex-direction:column;gap:12px}
.score .nums{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.score .tot{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--blue)}
.score .tot.ok{color:var(--good)}
.sbar{position:relative;height:12px;border-radius:6px;background:var(--line)}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--blue)}
.sbar .goal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--bad);border-radius:2px}
.sbar .gl{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.7rem;color:var(--bad);font-weight:700;white-space:nowrap}

G("The new software will help employees work more ___.",["efficient","efficiency","efficiently","efficiencies"],2,"Nature des mots","Le nouveau logiciel aidera les employés à travailler plus efficacement.","« work more ___ » : on décrit COMMENT ils travaillent, donc on décrit un verbe.","Pour décrire un verbe, on utilise un adverbe (souvent en -ly).",["Adjectif : il décrit un nom, pas un verbe.","Nom (« l'efficacité ») : impossible après « work more ».","Adverbe : il décrit le verbe « work ».","Nom au pluriel : aucun sens ici."]),
G("Ms. Tanaka gave an ___ presentation at the conference.",["impress","impressive","impressively","impression"],1,"Nature des mots","Mme Tanaka a fait une présentation impressionnante à la conférence.","« an ___ presentation » : le trou est entre un article (an) et un nom.","Article + ___ + nom → adjectif.",["Verbe : un verbe ne peut pas décrire un nom.","Adjectif (-ive) : il décrit « presentation ».","Adverbe : il ne décrit jamais un nom.","Nom : « an impression presentation » ne veut rien dire."]),

G("The manager was ___ satisfied with the results.",["extreme","extremely","extremes","extremity"],1,"Nature des mots","Le responsable était extrêmement satisfait des résultats.","« ___ satisfied » : juste avant un adjectif.","___ + adjectif → adverbe.",["Adjectif : deux adjectifs collés, impossible.","Adverbe : il renforce « satisfied ».","Nom au pluriel.","Nom (« extrémité »)."]),
G("The company is known for its ___ customer service.",["rely","reliable","reliably","reliability"],1,"Nature des mots","L'entreprise est connue pour son service client fiable.","« its ___ customer service » : entre « its » et un nom.","Possessif + ___ + nom → adjectif.",["Verbe.","Adjectif (-able) : il décrit « service ».","Adverbe : il ne décrit pas un nom.","Nom (« fiabilité ») : on dirait « its reliability », sans « customer service »."]),

G("The store will remain open ___ 9 P.M.",["by","until","in","at"],1,"Prépositions","Le magasin restera ouvert jusqu'à 21 h.","« remain open » : rester ouvert, c'est une action qui dure.","until = jusqu'à : l'action continue jusqu'à ce moment-là.",["by : échéance ponctuelle, pas une durée.","L'ouverture continue jusqu'à 21 h.","in : pour un mois ou une année, pas une heure.","at donne un instant précis, pas une limite de fin."]),

G("___ the heavy traffic, Ms. Ruiz arrived on time.",["Although","Despite","However","Even though"],1,"Connecteurs","Malgré la circulation dense, Mme Ruiz est arrivée à l'heure.","« the heavy traffic » : un nom, sans verbe.","despite + nom · although / even though + phrase.",["Although + sujet + verbe.","Despite + nom.","However relie deux phrases : « …. However, … ».","Even though + sujet + verbe."]),
G("___ sales were lower than expected, the company made a profit.",["Despite","In spite of","Although","Because of"],2,"Connecteurs","Bien que les ventes aient été plus faibles que prévu, l'entreprise a fait un bénéfice.","« sales were lower » : sujet + verbe, et une idée d'opposition.","although + phrase (opposition).",["Despite + nom.","In spite of + nom.","Opposition + phrase complète.","Because of : idée de cause, et + nom."]),
G("You will not receive a refund ___ you have the receipt.",["if","unless","whether","so"],1,"Connecteurs","Vous ne serez pas remboursé à moins d'avoir le ticket de caisse.","« will NOT receive » : pas de remboursement, SAUF avec le ticket.","unless = sauf si (= if … not).",["if : « pas de remboursement si vous avez le ticket », absurde.","Sauf si vous avez le ticket.","whether = si (choix entre deux options).","so = donc."]),
G("The product is popular; ___, its price is high.",["therefore","however","because","so that"],1,"Connecteurs","Le produit est populaire ; cependant, son prix est élevé.","« ; ___, » entre deux phrases, avec une opposition (populaire / cher).","however = cependant, entre deux phrases.",["therefore = donc : il n'y a pas de conséquence.","Opposition entre deux phrases.","because ne s'utilise jamais entre « ; » et « , ».","so that = afin que."]),
G("The hotel offers free Wi-Fi ___ a fitness center.",["as well as","as soon as","as long as","so as"],0,"Connecteurs","L'hôtel propose le Wi-Fi gratuit ainsi qu'une salle de sport.","Deux services ajoutés l'un à l'autre.","as well as = ainsi que.",["Ajout : « ainsi que ».","as soon as = dès que (temps).","as long as = tant que (condition).","so as to = afin de."]),
G("Neither the manager ___ his assistant attended the meeting.",["or","nor","and","but"],1,"Connecteurs","Ni le responsable ni son assistant n'ont assisté à la réunion.","Le mot « Neither » au début.","neither … nor · either … or · both … and.",["or va avec either.","neither … nor.","and va avec both.","but va avec not only."]),
G("Applicants should submit ___ a résumé and a cover letter.",["either","both","neither","whether"],1,"Connecteurs","Les candidats doivent envoyer un CV et une lettre de motivation.","« ___ X and Y ».","both … and = à la fois X et Y.",["either va avec or.","both … and.","neither va avec nor.","whether va avec or."]),
G("The package ___ yesterday afternoon.",["delivers","was delivered","has delivered","is delivering"],1,"Temps & voix","Le colis a été livré hier après-midi.","Le colis ne livre pas, il EST livré. Et « yesterday » = passé terminé.","Le sujet subit l'action → passif (be + participe passé).",["Présent actif : le colis ne livre rien.","Passif au prétérit.","Present perfect actif, et interdit avec « yesterday ».","Présent continu actif."]),
G("By the end of next year, the company ___ three new stores.",["opens","opened","will have opened","has opened"],2,"Temps & voix","D'ici la fin de l'année prochaine, l'entreprise aura ouvert trois nouveaux magasins.","« By the end of next year » : un moment dans le futur.","by + moment futur → will have + participe passé.",["Présent.","Passé : contredit « next year ».","Futur antérieur.","Present perfect : pas avec un repère futur."]),
G("Mr. Park ___ for the company since 2018.",["works","worked","has worked","is working"],2,"Temps & voix","M. Park travaille pour l'entreprise depuis 2018.","« since 2018 ».","since / for → present perfect (have/has + participe passé).",["Présent simple : on le traduit ainsi en français, mais c'est faux avec since.","Prétérit : action terminée, or il y travaille encore.","Present perfect.","Présent continu : faux avec since."]),
G("The new policy ___ effective next Monday.",["became","has become","will become","becoming"],2,"Temps & voix","La nouvelle politique entrera en vigueur lundi prochain.","« next Monday ».","next … → futur (will + base verbale).",["Passé.","Present perfect = déjà fait.","Futur.","Forme -ing seule : il manque l'auxiliaire."]),
G("When the client called, Ms. Lee ___ a meeting.",["attends","was attending","has attended","attend"],1,"Temps & voix","Quand le client a appelé, Mme Lee était en réunion.","« When the client called » : l'appel interrompt une action en cours, dans le passé.","Action en cours interrompue → was / were + V-ing.",["Présent : la phrase est au passé.","Prétérit continu.","Present perfect : pas avec un moment passé précis.","Base verbale : ni temps ni accord."]),

"Accords":["each, every, the number of, everyone → verbe au singulier.","Les mots entre le sujet et le verbe (of the participants, together with…) ne changent pas l'accord : trouve le vrai sujet."],

Q("(2)",["rising","risen","raising","raised"],0,"Le coût qui augmente (tout seul).",["Coût en hausse : rise, sens actif.","Participe de « rise » : pas devant un nom ici.","raise demande un complément.","« raised » : quelqu'un l'aurait augmenté, sens faux."],"rise = augmenter tout seul. raise = augmenter quelque chose."),
Q("(3) Quelle phrase va dans le trou ?",["In return, Premium members will now receive unlimited international calls.","We apologize for the late delivery of your order.","Our offices will be closed on June 1.","The Basic plan was launched in 2015."],0,"Après une hausse de prix, l'entreprise annonce une contrepartie.",["« In return » = en contrepartie : logique après une hausse.","Aucune commande mentionnée.","Mélange avec la date, hors sujet.","Information inutile."],"Les mots de liaison en début de phrase (In return, As a result, However) sont des indices très forts."),

const ref=()=>db.doc("data/users/"+uid+"/toeic");
function save(){S.updated=Date.now();saveLocal();if(db){setSync("saving");clearTimeout(pushT);pushT=setTimeout(push,1200)}}
async function push(){
  if(!db)return; if(saving){again=true;return}
  saving=true;
  try{await ref().set(JSON.parse(JSON.stringify(S)));setSync("ok")}catch(e){setSync("err")}
  saving=false; if(again){again=false;push()}
}
function merge(a,b){
  const out=JSON.parse(JSON.stringify(a));
  const newer=(x,y)=>!x?y:!y?x:((y.t||0)>(x.t||0)?y:x);
  Object.keys(b.cards||{}).forEach(k=>out.cards[k]=newer(out.cards[k],b.cards[k]));
  Object.keys(b.q||{}).forEach(k=>out.q[k]=newer(out.q[k],b.q[k]));
  Object.entries(b.days||{}).forEach(([d,x])=>{const y=out.days[d]||{};const z=Object.assign({},y);
    Object.keys(x).forEach(f=>z[f]=Math.max(x[f]||0,y[f]||0));out.days[d]=z});
  if((b.updated||0)>(a.updated||0)){out.dir=b.dir||out.dir;out.theme=b.theme||out.theme}
  out.updated=Math.max(a.updated||0,b.updated||0);out.v=3;
  return out;
}
async function pull(){
  if(!db)return;
  try{
    const snap=await ref().get();
    const remote=snap.exists?migrate(JSON.parse(JSON.stringify(snap.data()))):null;
    const before=JSON.stringify(S);
    if(remote) S=merge(S,remote);
    saveLocal();
    if(!remote||JSON.stringify(S)!==JSON.stringify(remote)) await push(); else setSync("ok");
    if(JSON.stringify(S)!==before) softRefresh();
  }catch(e){setSync("err")}
}
async function initSync(){
  if(!window.claude||!window.claude.use){setSync("local");return}
  setSync("wait");
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=u?await u.id():null;
    if(!d||!id){setSync("local");return}
    db=d;uid=id;await pull();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(pushT);push()}else pull()});
  }catch(e){setSync("local")}
}

/* ================= DATES & STATS ================= */
const DAY=86400000;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const keyOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>keyOf(new Date());
const daysLeft=()=>Math.max(0,Math.round((sod(EXAM)-sod(new Date()))/DAY));
const dayIndex=()=>Math.round((sod(new Date())-sod(START))/DAY);
const tomorrow=()=>sod(new Date()).getTime()+DAY;
function today(){return S.days[todayKey()]||{}}
function logDay(k,ok,tot){const d=S.days[todayKey()]=S.days[todayKey()]||{};d[k]=(d[k]||0)+tot;d[k+"Ok"]=(d[k+"Ok"]||0)+ok}
const dayTotal=x=>["v"].concat(ALLP).reduce((s,k)=>s+(x[k]||0),0);
const dayOk=x=>["v"].concat(ALLP).reduce((s,k)=>s+(x[k+"Ok"]||0),0);
function streak(){
  const has=d=>{const x=S.days[keyOf(d)];return x&&dayTotal(x)>0};
  let d=sod(new Date()),n=0; if(!has(d)) d=new Date(d.getTime()-DAY);
  while(has(d)){n++;d=new Date(d.getTime()-DAY)} return n;
}
function lastDays(n,parts){let ok=0,t=0;for(let j=0;j<n;j++){const x=S.days[keyOf(new Date(sod(new Date()).getTime()-j*DAY))]||{};parts.forEach(p=>{t+=x[p]||0;ok+=x[p+"Ok"]||0})}return {ok,t}}
function estimate(parts){const {ok,t}=lastDays(7,parts);if(t<20)return {need:20-t};return {v:Math.max(5,Math.min(495,Math.round(ok/t*495/5)*5)),pct:Math.round(ok/t*100)}}

const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

const itemOf=key=>PARTS[pk(key)].bank[ix(key)];
function tipOf(part,i,item){

  parts.forEach(p=>PARTS[p].bank.forEach((_,i)=>{const r=S.q[p+":"+i];if(r&&r.need>0&&(!dueOnly||r.due<=now))out.push(p+":"+i)}));return out}

function dueWords(){const now=Date.now();return VOCAB.map((_,i)=>i).filter(i=>{const c=S.cards[i];return c&&c.box<5&&c.due<=now})}
function partStats(p){let ok=0,t=0,seen=0;PARTS[p].bank.forEach((_,i)=>{const r=S.q[p+":"+i];if(r){seen++;ok+=r.ok;t+=r.ok+r.ko}});return {acc:t?Math.round(ok/t*100):null,seen,total:PARTS[p].bank.length}}

let vW=null,vM=null;
const canSpeak=()=>{try{return "speechSynthesis" in window}catch(e){return false}};
function pickVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const us=vs.filter(v=>/US/i.test(v.lang));const pool=us.length?us:vs;
  vW=pool.find(v=>/Samantha|Aria|Jenny|Zira|Female|Victoria|Karen|Ava|Allison|Susan/i.test(v.name))||pool[0]||null;
  vM=pool.find(v=>/Daniel|Guy|David|Alex|Male|Fred|Tom|Aaron|Mark/i.test(v.name)&&v!==vW)||vs.find(v=>v!==vW)||vW;}catch(e){}}
try{pickVoices();speechSynthesis.onvoiceschanged=pickVoices}catch(e){}
function speak(text,spk,onend){if(!canSpeak()){onend&&onend();return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.93;const v=spk==="W"?vW:vM;if(v)u.voice=v;
    if(vW===vM||!v)u.pitch=spk==="W"?1.25:.85;if(onend)u.onend=onend;speechSynthesis.speak(u)}catch(e){onend&&onend()}}
/* Vrais enregistrements (voix naturelles, accents US, UK, AU, CA) ; la voix du navigateur ne sert qu'en secours */
const audioEls={};let playTok=0,playIv=null;
function getAudio(f){if(!audioEls[f]){const a=new Audio(f);a.preload="auto";audioEls[f]=a}return audioEls[f]}
function stopAudio(){playTok++;clearInterval(playIv);Object.values(audioEls).forEach(a=>{try{a.pause()}catch(e){}});try{speechSynthesis.cancel()}catch(e){}}
function speakSeq(parts){stopAudio();let i=0;const next=()=>{if(i<parts.length){const p=parts[i++];speak(p[1],p[0],()=>setTimeout(next,420))}};next()}
function playSegs(key,idxs,fallback,onState){
  stopAudio();const m=typeof AUDIO!=="undefined"&&AUDIO[key];
  if(!m){fallback&&fallback();return}
  const a=getAudio(m.f),tok=playTok;let k=0;
  const done=()=>{if(tok===playTok&&onState)onState(false)};
  const fail=()=>{if(tok!==playTok)return;clearInterval(playIv);fallback&&fallback()};
  a.onerror=fail;onState&&onState(true);
  const next=()=>{
    if(tok!==playTok)return; if(k>=idxs.length){done();return}
    const s=m.s[idxs[k++]];
    try{a.currentTime=Math.max(0,s[0]-.02)}catch(e){}
    const p=a.play();
    const watch=()=>{clearInterval(playIv);playIv=setInterval(()=>{if(tok!==playTok){clearInterval(playIv);return}
      if(a.currentTime>=s[1]+.05||a.ended){clearInterval(playIv);a.pause();setTimeout(next,380)}},40)};
    if(p&&p.then)p.then(watch).catch(fail);else watch();
  };
  next();
}

const INTERVALS=[0,1,2,4,7,14];
let vq=null;
function buildVocab(theme){
  const now=Date.now();let pool=VOCAB.map((_,i)=>i);
  if(theme==="Mots ratés") return {theme,list:shuffle(hardWords()).slice(0,20),i:0,shown:false,ok:0,ko:0,missed:[]};
  if(theme!=="Tous") pool=pool.filter(i=>VOCAB[i][3]===theme);
  const due=shuffle(pool.filter(i=>{const c=S.cards[i];return c&&c.box<5&&c.due<=now}));
  const fresh=pool.filter(i=>!S.cards[i]);
  let list=due.slice(0,25);
  if(list.length<20) list=list.concat(fresh.slice(0,20-list.length));
  return {theme,list,i:0,shown:false,ok:0,ko:0,missed:[]};
}
/* QCM : 3 traductions pièges (faux amis, sens proches) + la bonne */
function vocabChoices(i){
  const v=VOCAB[i],en=S.dir==="en";
  const good=en?v[1]:v[0];let wrong=[];
  if(en&&TRAPS[v[0]]) wrong=shuffle(TRAPS[v[0]]).slice(0,3);
  const same=shuffle(VOCAB.filter((x,k)=>k!==i&&x[3]===v[3]).map(x=>en?x[1]:x[0]));
  const any=shuffle(VOCAB.filter((x,k)=>k!==i).map(x=>en?x[1]:x[0]));
  for(const c of same.concat(any)){if(wrong.length>=3)break;if(c!==good&&!wrong.includes(c))wrong.push(c)}
  const opts=shuffle([good].concat(wrong.slice(0,3)));
  return {opts,good,traps:en&&TRAPS[v[0]]?TRAPS[v[0]]:[]};
}

/* ================= MOTEUR DE QUIZ ================= */
let quiz=null;
function pool(p,opts){
  let idx=PARTS[p].bank.map((_,i)=>i);
  if(p==="p5"&&opts.cat&&opts.cat!=="Toutes") idx=idx.filter(i=>GRAMMAR[i].c===opts.cat);
  if(opts.hard) idx=idx.filter(i=>PARTS[p].bank[i].h);
  return idx;
}
function buildUnits(p,opts){
  const per=PARTS[p].per,idx=pool(p,opts),now=Date.now();
  const due=shuffle(idx.filter(i=>{const r=S.q[p+":"+i];return r&&r.need>0&&r.due<=now})).slice(0,Math.ceil(per/2));
  const rest=idx.filter(i=>!due.includes(i));
  const unseen=shuffle(rest.filter(i=>!S.q[p+":"+i]));
  const acc=i=>{const r=S.q[p+":"+i];return r.ok/((r.ok+r.ko)||1)};
  const seen=shuffle(rest.filter(i=>S.q[p+":"+i])).sort((a,b)=>acc(a)-acc(b));
  return shuffle(due.concat(unseen,seen).slice(0,per)).map(i=>p+":"+i);
}
function startQuiz(view,units,opts){
  quiz={view,units,base:units.length,i:0,ans:[],perms:[],retryPos:new Set(),retried:new Set(),opts:opts||{},sel:{},reveal:false,showScript:false,played:false,timer:null};
}
function stopTimer(){if(quiz&&quiz.timer){clearInterval(quiz.timer);quiz.timer=null}}
/* Mélange les réponses ; si la question a déjà été vue, la bonne réponse change toujours de lettre */
function shuffleAway(n,a,last){let p;for(let t=0;t<30;t++){p=shuffle([...Array(n).keys()]);if(last===undefined||p.indexOf(a)!==last)break}return p}
function permFor(i){
  if(!quiz.perms[i]){const key=quiz.units[i],it=itemOf(key),r=S.q[key],last=r&&r.pos;
    quiz.perms[i]=PARTS[pk(key)].set?it.qs.map((s,k)=>shuffleAway(s.o.length,s.a,Array.isArray(last)?last[k]:undefined)):shuffleAway(it.o.length,it.a,typeof last==="number"?last:undefined)}
  return quiz.perms[i];
}
function record(key,nOk,nTot,pos){
  const r=S.q[key]||{ok:0,ko:0,need:0,due:0};if(pos!==undefined)r.pos=pos;
  r.ok+=nOk;r.ko+=nTot-nOk;
  if(nOk===nTot){if(r.need>0){r.need--;r.due=r.need>0?tomorrow():0}}
  else{r.need=2;r.due=tomorrow()}
  r.t=Date.now();S.q[key]=r;logDay(pk(key),nOk,nTot);
}
function afterAnswer(allOk){
  const key=quiz.units[quiz.i];
  if(!allOk&&quiz.i<quiz.base&&!quiz.retried.has(key)){quiz.retried.add(key);quiz.units.push(key);quiz.retryPos.add(quiz.units.length-1)}
  save();renderHeader();renderQuiz();
}
const retryNote=(ok)=>ok?"":`<p class="note">${quiz.retryPos.has(quiz.i)?"Elle reste dans ton carnet d'erreurs et te sera reposée demain.":"Elle revient à la fin de cette série, puis demain, jusqu'à ce que tu la réussisses."}</p>`;
function optionList(item,perm,chosen,answered,attr){
  return perm.map((j,d)=>{let cls="";if(answered){if(j===item.a)cls="ok";else if(j===chosen)cls="ko";else cls="dim"}else if(j===chosen)cls="sel";
    return `<button class="opt ${cls}" ${attr} data-j="${j}" ${answered?"disabled":""}><span class="bub">${L[d]}</span><span>${attr.includes("hide")&&!answered?`<span class="muted">Réponse ${L[d]}</span>`:esc(item.o[j])}</span></button>`}).join("");
}
function whyList(item,perm,chosen){
  return `<ul class="whys">${perm.map((j,d)=>`<li class="${j===item.a?"ok":j===chosen?"ko":""}"><span class="bub">${L[d]}</span><span><b>${esc(item.o[j])}</b> : ${esc(item.w[j])}</span></li>`).join("")}</ul>`;
}
const tipBox=t=>t?`<div class="tipbox"><span class="eyebrow">Astuce TOEIC</span><span>${esc(t)}</span></div>`:"";

function renderQuiz(){
  stopTimer();
  if(!quiz.units.length){$("#main").innerHTML=`<section class="view"><div class="card stack"><b>Rien à faire ici pour le moment.</b><p class="note">Aucune question ne correspond à ce choix aujourd'hui.</p><div><button class="btn ghost" id="back">Retour</button></div></div></section>`;$("#back").onclick=()=>{quiz=null;route()};return}
  if(quiz.i>=quiz.units.length) return renderResult();
  const key=quiz.units[quiz.i],p=pk(key);
  const prog=`<div class="progress" aria-hidden="true">${quiz.units.map((u,j)=>{const a=quiz.ans[j];let c="";
    if(a!==undefined){const it=itemOf(u);c=PARTS[pk(u)].set?(a.every((x,s)=>x===it.qs[s].a)?"ok":"ko"):(a===it.a?"ok":"ko")}else if(j===quiz.i)c="cur";return `<i class="${c}"></i>`}).join("")}</div>`;
  const rec=S.q[key];const answered=quiz.ans[quiz.i]!==undefined;
  const head=`<div class="row between"><p class="eyebrow">${PARTS[p].n} · ${PARTS[p].t} · ${quiz.i+1}/${quiz.units.length}</p>
    <div class="row">${itemOf(key).h?`<span class="level">870+</span>`:""}${quiz.retryPos.has(quiz.i)?`<span class="retry">2ᵉ chance</span>`:!answered&&rec&&rec.need>0?`<span class="tag red">déjà ratée</span>`:""}${quiz.opts.chrono&&p==="p5"&&!answered?`<span class="timer" id="timer">20 s</span>`:""}</div></div>`;
  const body=PARTS[p].set?renderSet(key,p,answered):renderSingle(key,p,answered);
  $("#main").innerHTML=`<section class="view">${prog}<div class="card stack">${head}${body}</div></section>`;
  bindQuiz(key,p,answered);
}
function renderSingle(key,p,answered){
  const it=itemOf(key),perm=permFor(quiz.i),ch=quiz.ans[quiz.i];
  let top="";const hide=(p==="p1"||p==="p2")&&!quiz.reveal;
  if(p==="p5"){const s=it.s.split("___");top=`<p class="q">${esc(s[0])}<span class="gap"></span>${esc(s[1]||"")}</p>`}
  if(p==="p1") top=`<div class="photo"><span class="cam">PHOTO</span><div class="stack" style="gap:4px"><span class="eyebrow">Ce que montre la photo</span><p>${esc(it.d)}</p></div></div>
    <div class="row"><button class="btn" id="play">▶ Écouter les 4 phrases</button>${hide&&!answered?`<button class="btn ghost small" id="reveal">Afficher le texte</button>`:""}</div>`;
  if(p==="p2") top=`<div class="row"><button class="btn" id="play">▶ Écouter</button>${hide&&!answered?`<button class="btn ghost small" id="reveal">Afficher le texte</button>`:""}</div>
    ${!hide||answered?`<p class="q">${esc(it.q)}</p>`:`<p class="muted">Écoute la question et les trois réponses, puis choisis.</p>`}`;
  let out=top+`<div class="opts">${optionList(it,perm,ch,answered,hide?"data-hide":"")}</div>`;
  if(answered){
    const ok=ch===it.a,dpos=d=>L[perm.indexOf(d)];
    const tip=tipOf(p,ix(key),it);
    const filled=p==="p5"?(()=>{const s=it.s.split("___");return `${esc(s[0])}<span class="fill">${esc(it.o[it.a])}</span>${esc(s[1]||"")}`})():p==="p2"?esc(it.q):esc(it.d);
    out+=`<div class="verdict ${ok?"ok":"ko"} pop"><span class="ic">${ok?"✓":"✗"}</span>${ok?"Bonne réponse !":ch===-1?"Temps écoulé":"Pas tout à fait"}</div>
    <div class="explain pop">
      ${!ok&&ch>=0?`<div class="ex-row"><span>Ta réponse</span><div><span class="mono" style="color:var(--bad);font-weight:700">(${dpos(ch)})</span> ${esc(it.o[ch])} : ${esc(it.w[ch])}</div></div>`:""}
      <div class="ex-row"><span>La bonne</span><div><span class="mono" style="color:var(--good);font-weight:700">(${dpos(it.a)})</span> <b>${esc(it.o[it.a])}</b></div></div>
      ${p!=="p1"?`<div class="ex-row"><span>${p==="p5"?"Phrase":"Question"}</span><div class="q" style="font-size:1.02rem">${filled}</div></div>`:""}
      ${it.fr?`<div class="ex-row"><span>Traduction</span><div><i>${esc(it.fr)}</i></div></div>`:""}
      ${it.k?`<div class="ex-row"><span>L'indice</span><div>${esc(it.k)}</div></div>`:""}
      ${it.r?`<div class="ex-row"><span>La règle</span><div class="rule">${esc(it.r)}</div></div>`:""}
      <div class="ex-row"><span>Chaque option</span>${whyList(it,perm,ch)}</div>
      ${tipBox(tip)}
      ${retryNote(ok)}
    </div>
    <div class="row between"><button class="btn ghost small" id="quit">Arrêter</button><button class="btn" id="next">${quiz.i===quiz.units.length-1?"Voir le bilan":"Question suivante"}</button></div>`;
  } else out+=`<div><button class="btn ghost small" id="quit">Arrêter la série</button></div>`;
  return out;
}
function renderSet(key,p,answered){
  const it=itemOf(key),perms=permFor(quiz.i),ans=quiz.ans[quiz.i];
  const sel=answered?ans:(quiz.sel[quiz.i]=quiz.sel[quiz.i]||[]);
  let top=`<h3>${esc(it.title)}${it.kind?` <span class="tag">${esc(it.kind)}</span>`:""}</h3>`;
  const script=`<div class="script">${it.lines?it.lines.map(l=>`<p><b>${l[0]==="W"?"Woman":"Man"}</b>${esc(l[1])}</p>`).join(""):""}</div>`;
  if(p==="p3"||p==="p4"){
    top+=`<div class="row"><button class="btn" id="play">▶ Écouter ${p==="p3"?"la conversation":"l'exposé"}</button>${!answered&&!quiz.showScript?`<button class="btn ghost small" id="script">Afficher la transcription</button>`:""}</div>
    ${answered||quiz.showScript?`<div class="doc"><div class="dh">Transcription</div><div class="db">${script}</div></div>`:`<p class="note">Au vrai test, les questions et les réponses sont écrites dans le livret, mais pas la conversation. Lis les questions avant d'écouter.</p>`}`;
  }
  if(p==="p6"){
    const txt=esc(it.text).replace(/\{(\d)\}/g,(m,n)=>{const s=+n-1;return answered?`<span class="slot done">(${n}) ${esc(it.qs[s].o[it.qs[s].a])}</span>`:`<span class="slot">(${n}) ______</span>`});
    top+=`<div class="doc"><div class="db">${txt}</div></div>`;
  }
  if(p==="p7") top+=it.docs.map(d=>`<div class="doc"><div class="dh">${esc(d.h)}</div><div class="db">${esc(d.b)}</div></div>`).join("");
  const qs=it.qs.map((q,s)=>{const perm=perms[s],ch=sel[s];
    let h=`<div class="subq"><span class="qt">${esc(q.q)}</span><div class="opts">${optionList(q,perm,ch,answered,`data-s="${s}"`)}</div>`;
    if(answered){const ok=ch===q.a,dpos=d=>L[perm.indexOf(d)];
      h+=`<span class="mini ${ok?"ok":"ko"}">${ok?"✓ Bonne réponse":"✗ Ta réponse : ("+dpos(ch)+") · la bonne : ("+dpos(q.a)+") "+esc(q.o[q.a])}</span>
      <div class="explain"><div class="ex-row"><span>${p==="p6"?"L'indice":"La preuve"}</span><div>${esc(q.k)}</div></div>
      <div class="ex-row"><span>Chaque option</span>${whyList(q,perm,ch)}</div>${tipBox(q.t)}</div>`}
    return h+`</div>`}).join("");
  let out=top+`<div class="stack" style="gap:16px">${qs}</div>`;
  if(answered){const allOk=ans.every((x,s)=>x===it.qs[s].a);
    out+=retryNote(allOk)+`<div class="row between"><button class="btn ghost small" id="quit">Arrêter</button><button class="btn" id="next">${quiz.i===quiz.units.length-1?"Voir le bilan":"Suivant"}</button></div>`}
  else{const n=sel.filter(x=>x!==undefined).length;
    out+=`<div class="row between"><button class="btn ghost small" id="quit">Arrêter la série</button><button class="btn" id="validate" ${n<it.qs.length?"disabled":""}>Valider mes réponses (${n}/${it.qs.length})</button></div>`}
  return out;
}
function bindQuiz(key,p,answered){
  const it=itemOf(key);
  $("#quit").onclick=()=>{stopTimer();stopAudio();quiz=null;route()};
  if($("#next")){$("#next").onclick=()=>{stopAudio();quiz.i++;quiz.played=false;quiz.reveal=false;quiz.showScript=false;renderQuiz();window.scrollTo({top:0})}}
  if($("#reveal"))$("#reveal").onclick=()=>{quiz.reveal=true;renderQuiz()};
  if($("#script"))$("#script").onclick=()=>{quiz.showScript=true;renderQuiz()};
  if(PARTS[p].set){
    document.querySelectorAll(".opt[data-s]").forEach(b=>b.onclick=()=>{quiz.sel[quiz.i][+b.dataset.s]=+b.dataset.j;const y=window.scrollY;renderQuiz();window.scrollTo({top:y})});
    if($("#validate"))$("#validate").onclick=()=>{const sel=quiz.sel[quiz.i];quiz.ans[quiz.i]=sel.slice();
      const nOk=sel.filter((x,s)=>x===it.qs[s].a).length;record(key,nOk,it.qs.length,quiz.perms[quiz.i].map((pm,s)=>pm.indexOf(it.qs[s].a)));stopAudio();afterAnswer(nOk===it.qs.length)};
  } else {
    document.querySelectorAll(".opt[data-j]").forEach(b=>b.onclick=()=>answerSingle(+b.dataset.j));
  }
  const perm=quiz.perms[quiz.i];
  let seq=null,idxs=null;
  if(p==="p2"){seq=[["M",it.q]].concat(perm.map((j,d)=>["W",L[d]+". "+it.o[j]]));idxs=[0];perm.forEach((j,d)=>idxs.push(4+d,1+j))}
  if(p==="p1"){seq=perm.map((j,d)=>["M",L[d]+". "+it.o[j]]);idxs=[];perm.forEach((j,d)=>idxs.push(4+d,j))}
  if(p==="p3"||p==="p4"){seq=it.lines;idxs=it.lines.map((_,k)=>k)}
  const btn=$("#play");
  if(seq&&btn){const lbl=btn.textContent;
    const play=()=>playSegs(key,idxs,()=>speakSeq(seq),on=>{if(document.body.contains(btn))btn.textContent=on?"■ Lecture en cours…":lbl});
    btn.onclick=()=>{if(btn.textContent.startsWith("■")){stopAudio();btn.textContent=lbl}else play()};
    if(!answered&&!quiz.played&&(p==="p1"||p==="p2")){quiz.played=true;setTimeout(play,300)}}
  if(p==="p5"&&quiz.opts.chrono&&!answered){let t=20;
    quiz.timer=setInterval(()=>{t--;const el=$("#timer");if(el){el.textContent=t+" s";el.classList.toggle("low",t<=5)}if(t<=0){stopTimer();answerSingle(-1)}},1000)}
}
function answerSingle(j){
  stopTimer();stopAudio();
  const key=quiz.units[quiz.i],it=itemOf(key),ok=j===it.a;
  quiz.ans[quiz.i]=j;record(key,ok?1:0,1,quiz.perms[quiz.i].indexOf(it.a));afterAnswer(ok);
}
function renderResult(){
  const firstN=quiz.base;let ok=0,tot=0;const wrong=[];
  for(let j=0;j<firstN;j++){const u=quiz.units[j],it=itemOf(u),a=quiz.ans[j];if(a===undefined)continue;
    if(PARTS[pk(u)].set){it.qs.forEach((q,s)=>{tot++;if(a[s]===q.a)ok++;else wrong.push({u,q})})}
    else{tot++;if(a===it.a)ok++;else wrong.push({u,it})}}
  const pct=tot?Math.round(ok/tot*100):0;
  const msg=pct>=90?"Niveau 870+ sur cette série. Continue comme ça.":pct>=75?"Bon niveau, mais pour 870 il faut viser 90 %. Relis bien ce qui suit.":pct>=50?"Les règles ci-dessous sont celles à travailler en priorité.":"Pas grave : chaque erreur te sera reposée demain jusqu'à ce que tu la réussisses.";
  const dueTomorrow=errorsOf(ALLP,false).length;
  $("#main").innerHTML=`<section class="view"><div class="card stack pop">
    <p class="eyebrow">Bilan de la série</p>
    <div class="row" style="align-items:baseline;gap:16px"><div class="result mono">${ok}/${tot}</div><span class="mono muted">${pct} % du premier coup</span></div>
    <p>${msg}</p>
    ${wrong.length?`<p class="note">Tes ${wrong.length} erreur${wrong.length>1?"s":""} sont dans ton carnet. Elles te seront reposées demain (${dueTomorrow} au total en attente).</p>`:""}
    <div class="row"><button class="btn" id="again">Nouvelle série</button><button class="btn ghost" id="back">Retour</button></div></div>
    ${wrong.length?`<div class="card stack"><p class="eyebrow">À retenir de cette série</p><div class="recap">${wrong.map(w=>{
      if(w.it){const it=w.it,p=pk(w.u);
        if(p==="p5"){const s=it.s.split("___");return `<div><span class="q" style="font-size:1rem">${esc(s[0])}<span class="fill">${esc(it.o[it.a])}</span>${esc(s[1]||"")}</span><div class="rule" style="font-weight:400">${esc(it.r)}</div></div>`}
        return `<div><b>${esc(p==="p2"?it.q:it.d)}</b><span>→ <span class="fill">${esc(it.o[it.a])}</span></span><span class="note">${esc(it.k||tipOf(p,ix(w.u),it))}</span></div>`}
      return `<div><b>${esc(itemOf(w.u).title)} · ${esc(w.q.q)}</b><span>→ <span class="fill">${esc(w.q.o[w.q.a])}</span></span><span class="note">${esc(w.q.k)}</span></div>`}).join("")}</div></div>`:""}
  </section>`;
  const v=quiz.view,opts=quiz.opts;
  $("#again").onclick=()=>{if(opts.part){startQuiz(v,buildUnits(opts.part,opts),opts)}else{startQuiz(v,reviewUnits(opts.parts||ALLP),opts)}renderQuiz();window.scrollTo({top:0})};
  $("#back").onclick=()=>{quiz=null;route()};
}
function reviewUnits(parts){const now=Date.now();
  return errorsOf(parts,true).sort((a,b)=>ALLP.indexOf(pk(a))-ALLP.indexOf(pk(b))).slice(0,25)}

  const view=sec==="L"?"ecoute":"lecture";
  if(quiz&&quiz.view===view) return renderQuiz();
  const parts=sec==="L"?LPARTS:RPARTS;
  const due=errorsOf(parts,true).length,later=errorsOf(parts,false).length-due;
  const cats=["Toutes",...Array.from(new Set(GRAMMAR.map(g=>g.c)))];
  const est=estimate(parts);
  $("#main").innerHTML=`<section class="view">
    <div class="row between"><div><p class="eyebrow">${sec==="L"?"Listening · 45 min · 100 questions":"Reading · 75 min · 100 questions"}</p><h2>${sec==="L"?"Écoute":"Lecture"}</h2></div>
    <div class="stack" style="gap:2px;align-items:flex-end"><span class="eyebrow">Score estimé</span><b class="mono" style="font-size:1.4rem">${est.v?est.v+" / 495":"–"}</b></div></div>
    <div class="errbox ${due?"":"clear"}">
      ${due?`<div class="row between"><b>${due} erreur${due>1?"s":""} à refaire aujourd'hui</b><button class="btn bad small" id="goErr">Corriger maintenant</button></div>`:`<b>Rien à corriger aujourd'hui</b>`}
      <p class="note">${later?later+" erreur"+(later>1?"s":"")+" de cette section reviendr"+(later>1?"ont":"a")+" demain. ":""}Une erreur sort du carnet quand tu la réussis deux fois, à deux jours différents.</p>
    </div>
    <div class="parts">${parts.map(p=>{const st=partStats(p),P=PARTS[p];const e=errorsOf([p],true).length;
      return `<div class="card part"><h3>${P.n} <span>${P.t}</span><span class="mono">${P.min} le jour J</span></h3>
        <div class="meta"><span>Réussite <b>${st.acc!==null?st.acc+" %":"–"}</b></span><span>Vues <b>${st.seen}/${st.total}</b></span>${e?`<span style="color:var(--bad)">À refaire <b style="color:var(--bad)">${e}</b></span>`:""}</div>
        ${p==="p5"?`<div class="row"><label for="cat" class="muted">Catégorie</label><select id="cat">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>`:""}
        ${P.bank.some(x=>x.h)?`<label class="toggle"><input type="checkbox" id="hard-${p}">Niveau 870+ uniquement (${P.bank.filter(x=>x.h).length})</label>`:""}
        <div class="row"><button class="btn" data-go="${p}">${P.set?"Commencer ("+P.per+" "+(p==="p7"?"documents":p==="p6"?"textes":p==="p3"?"conversations":"exposés")+")":"Commencer (série de "+P.per+")"}</button>${p==="p5"?`<button class="btn ghost" data-chrono="p5">Chrono 20 s</button>`:""}</div></div>`}).join("")}</div>
    <div class="tipbox"><span class="eyebrow">Astuce TOEIC</span><span>${sec==="L"?"En Listening, la concentration baisse après 30 minutes. Entraîne-toi à enchaîner Part 3 et Part 4 sans pause : c'est là que se joue la différence entre 800 et 900.":"En Reading, le temps est l'ennemi principal. Vise 10 minutes pour la Part 5, 8 pour la Part 6 et garde 55 minutes pour la Part 7."}</span></div>
  </section>`;
  const opts=p=>({part:p,cat:p==="p5"&&$("#cat")?$("#cat").value:"Toutes",hard:$("#hard-"+p)?$("#hard-"+p).checked:false});
  document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>{const o=opts(b.dataset.go);startQuiz(view,buildUnits(o.part,o),o);renderQuiz();window.scrollTo({top:0})});
  document.querySelectorAll("[data-chrono]").forEach(b=>b.onclick=()=>{const o=Object.assign(opts("p5"),{chrono:true});startQuiz(view,buildUnits("p5",o),o);renderQuiz();window.scrollTo({top:0})});
  if($("#goErr"))$("#goErr").onclick=()=>{startQuiz(view,reviewUnits(parts),{parts});renderQuiz();window.scrollTo({top:0})};
}

/* ================= ACCUEIL ================= */
function ring(val,max){const r=26,c=2*Math.PI*r,p=Math.min(1,val/max);
  return `<svg class="ring ${p>=1?"done":""}" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="${r}"/><circle class="fg" cx="32" cy="32" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/><text x="32" y="37" text-anchor="middle">${p>=1?"✓":val}</text></svg>`}
function homeView(){
  const left=daysLeft(),di=dayIndex(),t=today();
  const plan=PLAN[Math.min(Math.max(di,0),PLAN.length-1)];
  const examStr=EXAM.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const due=errorsOf(ALLP,true).length,later=errorsOf(ALLP,false).length-due;
  const eL=estimate(LPARTS),eR=estimate(RPARTS);
  const total=eL.v&&eR.v?eL.v+eR.v:null;
  const blocks=GOALS.map(g=>{let done,cur,max,txt;
    if(g.id==="rev"){max=Math.max(1,due+(t.rev||0));cur=due?0:1;done=!due;txt=due?due+" à refaire":"carnet à jour"}
    else{cur=g.keys.reduce((s,k)=>s+(t[k]||0),0);max=g.n;done=cur>=max;txt=Math.min(cur,max)+"/"+max}
    const pct=Math.min(100,Math.round(cur/max*100));
    return `<div class="blk ${done?"done":""}"><span class="min">${g.min} min</span><div class="lbl"><b>${esc(g.label)}</b><div class="track"><i style="width:${g.id==="rev"?(done?100:0):pct}%"></i></div><span class="cnt">${done?"✓ fait · ":""}${txt}</span></div><a class="btn ${done?"ghost":""}" href="${g.href}">${done?"Encore":"Go"}</a></div>`}).join("");
  const doneMin=GOALS.reduce((s,g)=>{if(g.id==="rev")return s+(due?0:g.min);const cur=g.keys.reduce((a,k)=>a+(t[k]||0),0);return s+Math.min(1,cur/g.n)*g.min},0);
  const days=[];for(let j=6;j>=0;j--){const d=new Date(sod(new Date()).getTime()-j*DAY);const x=S.days[keyOf(d)]||{};const n=dayTotal(x);days.push({d,n,p:n?Math.round(dayOk(x)/n*100):null,today:j===0})}
  const maxN=Math.max(60,...days.map(d=>d.n));
  const planGrid=PLAN.map((p,k)=>{const d=new Date(START.getTime()+k*DAY);const cls=k<di?"past":k===di?"now":"";
    return `<div class="day ${cls}"><span class="d">${d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})} · J-${PLAN.length-k}</span><b>${esc(p[0])}</b></div>`}).join("")+
    `<div class="day exam"><span class="d">${EXAM.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})} · J</span><b>Examen TOEIC</b></div>`;
  $("#main").innerHTML=`<section class="view">
    <div class="hero">
      <div class="big mono"><small>J-</small>${left}</div>
      <div class="stack" style="gap:8px;min-width:0"><p class="eyebrow">Examen le ${esc(examStr)} · aujourd'hui : ${esc(plan[0])}</p>
        <p class="focus">${esc(plan[1])}</p></div>
    </div>
    <div class="card stack">
      <div class="row between"><p class="eyebrow">Ton programme de 2 h aujourd'hui</p><span class="mono note">${Math.round(doneMin)} / 120 min</span></div>
      <div class="prog">${blocks}</div>
    </div>
    <div class="card score">
      <div class="row between"><p class="eyebrow">Score estimé · 7 derniers jours</p><span class="note">objectif 870</span></div>
      <div class="nums"><span class="tot mono ${total>=870?"ok":""}">${total||"–"}</span>
        <span class="mono">Listening <b>${eL.v||"–"}</b></span><span class="mono">Reading <b>${eR.v||"–"}</b></span></div>
      <div class="sbar" style="margin-top:22px"><i style="width:${total?total/990*100:0}%"></i><span class="goal" style="left:${870/990*100}%"></span><span class="gl" style="left:${870/990*100}%">870</span></div>
      <p class="note">${total?(total>=870?"Tu es au-dessus de ton objectif sur l'appli. Confirme-le avec un test blanc officiel.":"Il te manque "+(870-total)+" points. Pour 870, il faut environ 88 % de bonnes réponses dans chaque section."):"Encore "+[eL.need&&("Listening : "+eL.need+" réponses"),eR.need&&("Reading : "+eR.need+" réponses")].filter(Boolean).join(" · ")+" avant d'afficher une estimation."} Estimation indicative, calculée sur ton taux de réussite ; seul un test blanc officiel donne un vrai score.</p>
    </div>
    <div class="errbox ${due?"":"clear"}">
      ${due?`<div class="row between"><b>Carnet d'erreurs : ${due} question${due>1?"s":""} d'hier à refaire</b><a class="btn bad small" href="#revision">Réviser</a></div><p class="note">Commence toujours ta séance par là.</p>`
      :`<b>Carnet d'erreurs à jour pour aujourd'hui</b>`}
      ${later?`<p class="note">${later} erreur${later>1?"s":""} d'aujourd'hui reviendr${later>1?"ont":"a"} demain.</p>`:""}
    </div>
    <div class="card stack">
      <div class="row between"><p class="eyebrow">Tes 7 derniers jours</p><span class="note">réponses · % de réussite</span></div>
      <div class="chart" role="img" aria-label="Activité des 7 derniers jours">${days.map(d=>`<div class="col"><span class="v">${d.n||""}</span><div class="bar ${d.n?"":"empty"} ${d.today&&d.n?"today":""}" style="height:${d.n?Math.max(6,d.n/maxN*100):3}%"></div><span class="d">${d.d.toLocaleDateString("fr-FR",{weekday:"narrow"})}${d.d.getDate()}</span><span class="d" style="color:var(--ink)">${d.p!==null?d.p+"%":"–"}</span></div>`).join("")}</div>
    </div>
    <div class="stack" style="gap:10px"><p class="eyebrow">Ton plan jusqu'au 19 novembre</p><div class="plan">${planGrid}</div></div>
  </section>`;
}

/* ================= FICHES ================= */
function fichesView(){
  const F=[
  ["L'objectif 870 en 3 chiffres",`<ul><li><b>88 %</b> de bonnes réponses dans chaque section.</li>
   <li><b>12 erreurs max</b> sur 100 en écoute, 12 en lecture.</li>
   <li><b>0 case vide</b> : une mauvaise réponse ne retire rien.</li></ul>`],
  ["Part 1 · Photos",`<ul><li>Personne sur la photo → « <b>is being</b> stacked » est faux, « <b>has been</b> stacked » est juste.</li>
   <li>Un objet visible n'est pas forcément utilisé : vérifie le <b>verbe</b>.</li></ul>`],
  ["Part 2 · Questions-réponses",`<ul><li>Retiens le <b>1er mot</b> : Where → un lieu, When → un moment.</li>
   <li><b>Where / When / Who…</b> → jamais « Yes / No ».</li>
   <li>Même mot ou son proche (copy / coffee) → <b>piège</b>.</li>
   <li>« I'm not sure », « Let me check » → souvent <b>juste</b>.</li></ul>`],
  ["Parts 3 et 4 · Conversations et exposés",`<ul><li><b>Lis les 3 questions avant</b> l'audio.</li>
   <li>Q1 = début (sujet), Q3 = fin (ce qui va se passer).</li>
   <li>La bonne réponse <b>reformule</b> : « at no extra charge » = « for free ».</li></ul>`],
  ["Part 5 · Trouver la nature du mot",`<div class="tbl"><table><tr><th>Avant / après le trou</th><th>Il faut</th><th>Exemple</th></tr>
   <tr><td>a / the / your + ___ + nom</td><td>adjectif</td><td>a <b>reliable</b> supplier</td></tr>
   <tr><td>the + ___ + of</td><td>nom</td><td>the <b>approval</b> of</td></tr>
   <tr><td>___ + adjectif ou verbe</td><td>adverbe -ly</td><td><b>highly</b> recommended</td></tr>
   <tr><td>will / must / to + ___</td><td>verbe de base</td><td>will <b>expand</b></td></tr>
   <tr><td>feel / seem / become + ___</td><td>adjectif</td><td>feel <b>comfortable</b></td></tr></table></div>`],
  ["Part 5 · Temps du verbe",`<ul><li><b>since / for</b> → has worked</li>
   <li><b>yesterday / ago</b> → worked</li>
   <li><b>by next year</b> → will have worked</li>
   <li>le sujet <b>subit</b> → passif : is delivered</li>
   <li><b>suggest, recommend, avoid</b> + -ing</li></ul>`],
  ["Part 5 · Connecteurs",`<div class="tbl"><table><tr><th>Sens</th><th>+ nom</th><th>+ phrase</th></tr>
   <tr><td>Cause</td><td>because of, due to</td><td>because, since</td></tr>
   <tr><td>Opposition</td><td>despite</td><td>although</td></tr>
   <tr><td>Condition</td><td>in case of</td><td>if, unless</td></tr></table></div>
   <p>Entre deux phrases : <b>however</b>, <b>therefore</b>.</p>`],
  ["Part 5 · Les 6 pièges du 870+",`<ul><li><b>recommend that</b> he <b>be</b> (pas « is »).</li>
   <li><b>Rarely / Not only</b> en tête → <b>have we</b> seen.</li>
   <li><b>Had we known</b> = If we had known.</li>
   <li><b>rise</b> (tout seul) ≠ <b>raise</b> (quelque chose).</li>
   <li><b>entitled to</b> · <b>eligible for</b> · <b>adhere to</b> · <b>comply with</b>.</li>
   <li>Virgule avant le trou → <b>which</b>, jamais « that ».</li></ul>`],
  ["Parts 6 et 7 · Lecture",`<ul><li>Phrase à insérer : lis la phrase <b>avant et après</b>.</li>
   <li>Part 7 : lis <b>la question d'abord</b>, puis cherche le mot-clé.</li>
   <li>Question <b>NOT</b> : les 3 réponses présentes sont fausses.</li>
   <li>Deux documents : la réponse combine <b>une info de chaque</b>.</li></ul>`],
  ["Gestion du temps",`<div class="tbl"><table><tr><th>Partie</th><th>Temps</th></tr>
   <tr><td>Part 5</td><td>10 min (20 s par question)</td></tr><tr><td>Part 6</td><td>8 min</td></tr><tr><td>Part 7</td><td>55 min</td></tr></table></div>
   <p>Bloqué plus de 30 s ? Réponds et passe.</p>`],
  ["Le jour J",`<ul><li>Pièce d'identité + convocation, <b>30 min</b> d'avance.</li>
   <li>La veille : révision légère et dodo tôt.</li></ul>`]
  ];
  $("#main").innerHTML=`<section class="view"><div><p class="eyebrow">Fiches de révision</p><h2>L'essentiel à relire</h2></div>
  ${F.map((f,k)=>`<details class="fiche" ${k===0?"open":""}><summary>${esc(f[0])}</summary><div class="fiche-body">${f[1]}</div></details>`).join("")}
  <div class="card stack"><p class="eyebrow">Ta sauvegarde</p>
    <p class="note">${syncState==="ok"||syncState==="saving"?"Ta progression est enregistrée sur ton compte. Tu la retrouves le lendemain, sur ton téléphone comme sur ton ordinateur.":"Ta progression est enregistrée dans ce navigateur. Utilise toujours le même appareil et le même lien."}</p>
    <div class="row"><button class="btn ghost small" id="reset">Effacer ma progression</button><span id="resetMsg" class="note"></span></div></div></section>`;
  let armed=false;
  $("#reset").onclick=()=>{if(!armed){armed=true;$("#reset").textContent="Confirmer l'effacement";$("#resetMsg").textContent="Cartes, scores et carnet d'erreurs seront supprimés partout.";return}
    S=blank();save();vq=null;quiz=null;renderHeader();$("#resetMsg").textContent="Progression effacée.";$("#reset").textContent="Effacer ma progression";armed=false};
}

/* ================= NAVIGATION ================= */
const VIEWS={accueil:homeView,vocab:vocabView,ecoute:()=>sectionView("L"),lecture:()=>sectionView("R"),revision:revisionView,fiches:fichesView};
let current="accueil";
function route(){
  let v=(location.hash||"#accueil").slice(1);
  if(v==="grammaire")v="lecture"; if(v==="ecoute"||v==="lecture"||VIEWS[v]){} else v="accueil";
  current=v;
  if(quiz&&quiz.view!==v){stopTimer();quiz=null}
  stopAudio();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===v||(v==="revision"&&a.dataset.v==="accueil")?"page":"false"));
  renderHeader();VIEWS[v]();
}
function softRefresh(){renderHeader();if(!quiz&&(current!=="vocab"||!vq||vq.i===0)){vq=null;VIEWS[current]()}}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});
route();setSync("local");initSync();
})();
</script>
