<style>
/* Layout: a single answer-sheet column; bubbles (A)(B)(C)(D) are the core motif, tabs at the thumb on phone, on top on desktop */
:root{
  --paper:#f5f7fb;
  --sheet:#ffffff;
  --ink:#16213d;
  --ink-soft:#56607a;
  --line:#d9deea;
  --blue:#2346c8;
  --blue-wash:#e6ebfb;
  --marker:#ffd84d;
  --marker-ink:#3b2f00;
  --good:#16834f;
  --good-wash:#e1f4ea;
  --bad:#c23a2b;
  --bad-wash:#fbe7e4;
  --shadow:0 1px 2px rgba(22,33,61,.06),0 6px 24px rgba(22,33,61,.06);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0e1324;--sheet:#161d33;--ink:#e8ecf7;--ink-soft:#9aa4c0;--line:#2a3352;
    --blue:#8ea6ff;--blue-wash:#1f2a52;--marker:#ffd84d;--marker-ink:#2a2100;
    --good:#4cc98a;--good-wash:#123526;--bad:#ff8273;--bad-wash:#3d1a17;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0e1324;--sheet:#161d33;--ink:#e8ecf7;--ink-soft:#9aa4c0;--line:#2a3352;
  --blue:#8ea6ff;--blue-wash:#1f2a52;--marker:#ffd84d;--marker-ink:#2a2100;
  --good:#4cc98a;--good-wash:#123526;--bad:#ff8273;--bad-wash:#3d1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.25);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 96px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.1}
h2{font-size:1.6rem;font-weight:800;letter-spacing:-.01em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.hl{background:linear-gradient(transparent 55%,var(--marker) 55%);color:inherit;padding:0 .1em}

/* header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.25rem;letter-spacing:-.02em}
.brand span{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft)}
.streak{font-family:var(--f-mono);font-size:.8rem;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap}

/* nav */
nav.tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:6px 10px;border-bottom:1px solid var(--line);margin-bottom:20px}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:.9rem;padding:8px 4px;border-radius:10px;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs a .ico{font-family:var(--f-mono);font-size:.8rem;width:26px;height:26px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
nav.tabs a[aria-current="page"]{color:var(--blue);background:var(--blue-wash)}
nav.tabs a[aria-current="page"] .ico{background:var(--blue);color:var(--sheet);border-color:var(--blue)}
@media (max-width:640px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-bottom:0;border-top:1px solid var(--line);background:var(--sheet);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{font-size:.72rem}
}

.view{display:flex;flex-direction:column;gap:20px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--sheet);font-size:1rem}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--sheet)}
.btn.bad{background:var(--bad);color:var(--sheet)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 12px;font-size:.88rem}

/* home */
.count{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center}
.count .big{font-family:var(--f-display);font-weight:800;font-size:clamp(4rem,18vw,6.5rem);line-height:.85;letter-spacing:-.04em;color:var(--blue)}
.count .big small{font-size:.35em;letter-spacing:0;vertical-align:top;margin-right:2px;color:var(--ink-soft)}
.count p{max-width:34ch}
.today{display:flex;flex-direction:column;gap:12px}
.today .focus{font-family:var(--f-display);font-size:1.35rem;font-weight:700}
.tasks{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.tasks li{display:flex;gap:10px;align-items:flex-start}
.tasks .b{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-soft);margin-top:1px}
.tasks .b.done{background:var(--ink);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .n{font-family:var(--f-mono);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:.85rem;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.day .d{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-soft)}
.day.past{opacity:.5}
.day.now{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-wash)}
.day.exam{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.day.exam .d{color:var(--marker-ink)}
.scale{display:flex;flex-direction:column;gap:6px}
.scale .track{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--blue))}
.scale .ticks{display:flex;justify-content:space-between;font-family:var(--f-mono);font-size:.72rem;color:var(--ink-soft)}

/* flashcards */
.flash{min-height:260px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;cursor:pointer;user-select:none}
.flash .word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);letter-spacing:-.02em;overflow-wrap:anywhere}
.flash .tr{font-size:1.3rem;font-weight:700;color:var(--blue)}
.flash .ex{font-style:italic;color:var(--ink-soft);max-width:44ch}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-soft)}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.boxes .bx{flex:1;min-width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:.75rem;background:var(--sheet)}
.boxes .bx b{display:block;font-family:var(--f-mono);font-size:1.1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}

/* quiz */
.q{font-size:1.2rem;line-height:1.5}
.q .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--sheet);cursor:pointer;font-size:1.02rem}
.opt .bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-wash)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.ko{border-color:var(--bad);background:var(--bad-wash)}
.opt.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.expl{border-left:4px solid var(--marker);padding:10px 14px;background:var(--paper);border-radius:0 10px 10px 0}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.progress i.ok{background:var(--good)}.progress i.ko{background:var(--bad)}.progress i.cur{background:var(--blue)}
.timer{font-family:var(--f-mono);font-weight:700}
.timer.low{color:var(--bad)}
.result{font-family:var(--f-display);font-weight:800;font-size:3.2rem;color:var(--blue);line-height:1}

/* fiches */
details.fiche{background:var(--sheet);border:1px solid var(--line);border-radius:14px;padding:4px 18px}
details.fiche summary{cursor:pointer;padding:14px 0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-soft)}
details.fiche[open] summary::after{content:"–"}
.fiche-body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fiche-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
.note{font-size:.85rem;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .flash,.opt{transition:background .15s,border-color .15s}
}
</style>
</head>

const KEY="toeic-j19-v1";
let S={cards:{},gram:{},listen:{},days:{},dir:"en"};
try{const raw=localStorage.getItem(KEY); if(raw) S=Object.assign(S,JSON.parse(raw));}catch(e){}

/* ============ DATES ============ */
const DAY=86400000;
function startOfDay(d){const x=new Date(d);x.setHours(0,0,0,0);return x}
function todayKey(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function daysLeft(){return Math.max(0,Math.round((startOfDay(EXAM)-startOfDay(new Date()))/DAY))}
function dayIndex(){return Math.round((startOfDay(new Date())-startOfDay(START))/DAY)}
function logActivity(kind,n){const k=todayKey();S.days[k]=S.days[k]||{v:0,g:0,l:0};S.days[k][kind]=(S.days[k][kind]||0)+(n||1);save();renderHeader()}
function streak(){let n=0;let d=startOfDay(new Date());
  const has=k=>{const x=S.days[k];return x&&(x.v+x.g+x.l)>0};
  const key=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  if(!has(key(d))) d=new Date(d-DAY);
  while(has(key(d))){n++;d=new Date(d-DAY)}
  return n}

/* ============ HELPERS ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCD";
function renderHeader(){
  const d=daysLeft();$("#hdrDays").textContent=d;
  const s=streak();$("#streak").textContent=s+(s>1?" jours":" jour")+" d'affilée";
}

/* ============ VOCAB (Leitner) ============ */
const INTERVALS=[0,1,2,4,7,14];
function cardState(i){return S.cards[i]}
function dueCards(theme){
  const now=Date.now();const due=[],fresh=[];
  VOCAB.forEach((v,i)=>{ if(theme&&theme!=="Tous"&&v[3]!==theme) return;
    const c=S.cards[i]; if(!c) fresh.push(i); else if(c.due<=now && c.box<5) due.push(i); });
  return {due:shuffle(due),fresh};
}
let vq=null;
function vocabView(){
  const themes=["Tous",...Array.from(new Set(VOCAB.map(v=>v[3])))];
  const theme=S.theme||"Tous";
  const counts=[0,0,0,0,0,0];let seen=0;
  VOCAB.forEach((v,i)=>{const c=S.cards[i];if(c){counts[c.box]++;seen++}});
  const {due,fresh}=dueCards(theme);
  if(!vq||vq.theme!==theme){vq={theme,list:due.concat(fresh.slice(0,Math.max(0,20-due.length))).slice(0,30),i:0,shown:false,ok:0,ko:0}}
  const cur=vq.list[vq.i];
  let html=`<div class="row" style="justify-content:space-between"><div><p class="eyebrow">Vocabulaire · répétition espacée</p><h2>${VOCAB.length} mots du TOEIC</h2></div>
  <div class="seg" role="group" aria-label="Sens"><button id="dirEn" aria-pressed="${S.dir==="en"}">EN → FR</button><button id="dirFr" aria-pressed="${S.dir==="fr"}">FR → EN</button></div></div>
  <div class="row"><label for="theme" class="muted">Thème</label><select id="theme">${themes.map(t=>`<option ${t===theme?"selected":""}>${esc(t)}</option>`).join("")}</select>
  <span class="muted">${due.length} à revoir · ${fresh.length} nouveaux</span></div>`;
  if(cur===undefined){
    html+=`<div class="card flash" style="cursor:default"><p class="eyebrow">Session terminée</p><div class="word">${vq.ok} ✓ · ${vq.ko} ✗</div><p class="muted">Les cartes ratées reviendront demain, les cartes sues plus tard.</p><button class="btn" id="vRestart">Nouvelle session</button></div>`;
  } else {
    const v=VOCAB[cur];const front=S.dir==="en"?v[0]:v[1];const back=S.dir==="en"?v[1]:v[0];
    html+=`<div class="progress" aria-hidden="true">${vq.list.map((_,k)=>`<i class="${k<vq.i?"ok":k===vq.i?"cur":""}"></i>`).join("")}</div>
    <div class="card flash" id="flash" tabindex="0" role="button" aria-label="Retourner la carte">
      <span class="tag">${esc(v[3])} · boîte ${S.cards[cur]?S.cards[cur].box:"nouvelle"}</span>
      <div class="word">${esc(front)}</div>
      ${vq.shown?`<div class="tr">${esc(back)}</div><p class="ex">${esc(v[2])}</p>`:`<p class="muted">Touche la carte pour voir la réponse</p>`}
    </div>
    <div class="row" style="justify-content:center">
      ${vq.shown?`<button class="btn bad" id="vKo">À revoir</button><button class="btn good" id="vOk">Je savais</button>`:`<button class="btn ghost" id="vShow">Voir la réponse</button>`}
      <button class="btn ghost small" id="vSay" aria-label="Écouter la prononciation">▶ Écouter</button>
    </div>`;
  }
  html+=`<div class="card"><p class="eyebrow" style="margin-bottom:10px">Tes boîtes (${seen}/${VOCAB.length} vus)</p><div class="boxes">${counts.map((n,b)=>`<div class="bx"><b>${n}</b>${b===5?"acquis":"boîte "+b}</div>`).join("")}</div>
  <p class="note" style="margin-top:10px">Bonne réponse : la carte monte d'une boîte et revient plus tard (1, 2, 4, 7 jours). Erreur : retour en boîte 0, elle revient aujourd'hui.</p></div>`;
  $("#main").innerHTML=`<section class="view">${html}</section>`;
  $("#theme").onchange=e=>{S.theme=e.target.value;save();vq=null;vocabView()};
  $("#dirEn").onclick=()=>{S.dir="en";save();vocabView()};
  $("#dirFr").onclick=()=>{S.dir="fr";save();vocabView()};
  if(cur===undefined){$("#vRestart").onclick=()=>{vq=null;vocabView()};return}
  const flip=()=>{vq.shown=true;vocabView()};
  $("#flash").onclick=()=>{if(!vq.shown)flip()};
  $("#flash").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!vq.shown)flip()}};
  if($("#vShow"))$("#vShow").onclick=flip;
  $("#vSay").onclick=()=>speak(VOCAB[cur][0].replace(/^to /,""));
  const grade=ok=>{const c=S.cards[cur]||{box:0,due:0};
    if(ok){c.box=Math.min(5,c.box+1);vq.ok++}else{c.box=0;vq.ko++;vq.list.push(cur)}
    c.due=startOfDay(new Date()).getTime()+INTERVALS[c.box]*DAY;S.cards[cur]=c;
    vq.i++;vq.shown=false;logActivity("v");vocabView()};
  if($("#vOk")){$("#vOk").onclick=()=>grade(true);$("#vKo").onclick=()=>grade(false)}
}

/* ============ SPEECH ============ */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]US/i.test(v.lang)&&/Google|Samantha|Aria|Jenny/i.test(v.name))||vs.find(v=>/en[-_]US/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
const canSpeak=()=>{try{return "speechSynthesis" in window}catch(e){return false}};
function speak(text,onend){
  if(!canSpeak()){onend&&onend();return false}
  try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.92;if(voice)u.voice=voice;if(onend)u.onend=onend;speechSynthesis.speak(u);return true}catch(e){onend&&onend();return false}
}
function speakSeq(parts){try{speechSynthesis.cancel()}catch(e){} let i=0;const next=()=>{if(i<parts.length){const p=parts[i++];speak(p,()=>setTimeout(next,450))}};next()}

/* ============ QUIZ ENGINE (Part 5 & Part 2) ============ */
let quiz=null;
function pickSet(bank,store,n,cat){
  let idx=bank.map((_,i)=>i);
  if(cat&&cat!=="Toutes") idx=idx.filter(i=>bank[i][4]===cat);
  // priorité : jamais vues ou ratées
  const w=i=>{const s=store[i];if(!s)return 2;return s.ko>s.ok?3:(s.ok>0?0:1)};
  idx=shuffle(idx).sort((a,b)=>w(b)-w(a));
  return shuffle(idx.slice(0,n));
}
function startQuiz(kind,opts){
  const bank=kind==="g"?GRAMMAR:LISTEN;const store=kind==="g"?S.gram:S.listen;
  quiz={kind,set:pickSet(bank,store,10,opts&&opts.cat),i:0,ans:[],chrono:!!(opts&&opts.chrono),t:0,timer:null};
}
function stopTimer(){if(quiz&&quiz.timer){clearInterval(quiz.timer);quiz.timer=null}}
function accuracy(store){let ok=0,tot=0;Object.values(store).forEach(s=>{ok+=s.ok;tot+=s.ok+s.ko});return tot?Math.round(ok/tot*100):null}

function grammarView(){
  if(!quiz||quiz.kind!=="g"){
    const cats=["Toutes",...Array.from(new Set(GRAMMAR.map(g=>g[4])))];
    const byCat={};GRAMMAR.forEach((g,i)=>{const s=S.gram[i];if(!s)return;byCat[g[4]]=byCat[g[4]]||{ok:0,t:0};byCat[g[4]].ok+=s.ok;byCat[g[4]].t+=s.ok+s.ko});
    const acc=accuracy(S.gram);
    $("#main").innerHTML=`<section class="view">
      <div><p class="eyebrow">Reading · Part 5 · Phrases à compléter</p><h2>${GRAMMAR.length} questions de grammaire</h2></div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <p>Séries de 10 questions. Les questions ratées reviennent en priorité. Le jour J tu as <b>environ 20 secondes</b> par question en Part 5.</p>
        <div class="row"><label for="cat" class="muted">Catégorie</label><select id="cat">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>
        <div class="row"><button class="btn" id="go">Commencer une série</button><button class="btn ghost" id="goChrono">Série chrono · 20 s</button></div>
      </div>
      <div class="card"><p class="eyebrow" style="margin-bottom:12px">Réussite par catégorie ${acc!==null?"· "+acc+" % au total":""}</p>
        ${Object.keys(byCat).length?`<div style="display:flex;flex-direction:column;gap:10px">${Object.entries(byCat).sort((a,b)=>a[1].ok/a[1].t-b[1].ok/b[1].t).map(([c,v])=>{const p=Math.round(v.ok/v.t*100);return `<div><div class="row" style="justify-content:space-between"><span>${esc(c)}</span><span class="mono">${p} %</span></div><div class="bar"><i style="width:${p}%;background:${p<60?"var(--bad)":p<80?"var(--marker)":"var(--good)"}"></i></div></div>`}).join("")}</div>`:`<p class="muted">Fais une première série pour voir tes points forts et tes points faibles.</p>`}
      </div></section>`;
    $("#go").onclick=()=>{startQuiz("g",{cat:$("#cat").value});grammarView()};
    $("#goChrono").onclick=()=>{startQuiz("g",{cat:$("#cat").value,chrono:true});grammarView()};
    return;
  }
  renderQuestion();
}
function listenView(){
  if(!quiz||quiz.kind!=="l"){
    const acc=accuracy(S.listen);
    $("#main").innerHTML=`<section class="view">
      <div><p class="eyebrow">Listening · Part 2 · Questions-réponses</p><h2>Entraîne ton oreille</h2></div>
      <div class="card" style="display:flex;flex-direction:column;gap:14px">
        <p>Tu entends une question puis trois réponses (A), (B), (C). Choisis la réponse logique. Au vrai test, <b>rien n'est écrit</b> : essaie d'abord sans afficher le texte.</p>
        ${canSpeak()?"":`<p class="expl">Ton navigateur ne lit pas l'audio. Le texte sera affiché directement.</p>`}
        <p class="note">Voix de synthèse de ton appareil. Monte le son et désactive le mode silencieux sur iPhone.</p>
        <div class="row"><button class="btn" id="go">Commencer une série</button>${acc!==null?`<span class="muted">Réussite : <b class="mono">${acc} %</b></span>`:""}</div>
      </div>
      <div class="card"><p class="eyebrow" style="margin-bottom:8px">Le réflexe Part 2</p>
        <p>Retiens le <span class="hl">premier mot</span> de la question (Where, When, Who, Why, How…). Il élimine souvent deux réponses tout seul. Méfie-toi des réponses qui <span class="hl">répètent un mot</span> de la question ou un son proche.</p></div>
    </section>`;
    $("#go").onclick=()=>{startQuiz("l");quiz.reveal=!canSpeak();listenView()};
    return;
  }
  renderQuestion();
}
function renderQuestion(){
  const g=quiz.kind==="g";const bank=g?GRAMMAR:LISTEN;
  if(quiz.i>=quiz.set.length) return renderResult();
  const qi=quiz.set[quiz.i];const item=bank[qi];const answered=quiz.ans[quiz.i]!==undefined;
  const prog=`<div class="progress" aria-hidden="true">${quiz.set.map((_,k)=>`<i class="${k<quiz.i||(k===quiz.i&&answered)?(quiz.ans[k]===bank[quiz.set[k]][2]?"ok":"ko"):k===quiz.i?"cur":""}"></i>`).join("")}</div>`;
  let body;
  if(g){
    const parts=item[0].split("___");
    body=`<p class="eyebrow">Question ${quiz.i+1}/10 · ${esc(item[4])}</p>
      <p class="q">${esc(parts[0])}<span class="gap"></span>${esc(parts[1]||"")}</p>`;
  } else {
    const show=quiz.reveal||answered;
    body=`<p class="eyebrow">Question ${quiz.i+1}/10</p>
      <div class="row"><button class="btn" id="play">▶ Écouter</button><button class="btn ghost small" id="reveal">${show?"Texte affiché":"Afficher le texte"}</button></div>
      ${show?`<p class="q">${esc(item[0])}</p>`:`<p class="muted">Mark your answer on your answer sheet.</p>`}`;
  }
  const opts=item[1].map((o,k)=>{let cls="";if(answered){if(k===item[2])cls="ok";else if(k===quiz.ans[quiz.i])cls="ko"}
    const label=g||quiz.reveal||answered?esc(o):`<span class="muted">Réponse ${L[k]}</span>`;
    return `<button class="opt ${cls}" data-k="${k}" ${answered?"disabled":""}><span class="bub">${L[k]}</span><span>${label}</span></button>`}).join("");
  $("#main").innerHTML=`<section class="view">${prog}
    <div class="card" style="display:flex;flex-direction:column;gap:16px">
      <div class="row" style="justify-content:space-between"><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:10px">${body}</div>${quiz.chrono&&!answered?`<span class="timer mono" id="timer">20 s</span>`:""}</div>
      <div class="opts">${opts}</div>
      ${answered?`<div class="expl">${quiz.ans[quiz.i]===-1?"<b>Temps écoulé.</b> ":""}${item[3]}</div>
      <div class="row" style="justify-content:space-between"><button class="btn ghost small" id="quit">Arrêter</button><button class="btn" id="next">${quiz.i===quiz.set.length-1?"Voir le résultat":"Question suivante"}</button></div>`:`<div><button class="btn ghost small" id="quit">Arrêter</button></div>`}
    </div></section>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $("#quit").onclick=()=>{stopTimer();quiz=null;route()};
  if($("#next")) $("#next").onclick=()=>{quiz.i++;renderQuestion();window.scrollTo({top:0})};
  if(!g){
    const play=()=>speakSeq([item[0],...item[1].map((o,k)=>L[k]+". "+o)]);
    $("#play").onclick=play;
    $("#reveal").onclick=()=>{quiz.reveal=true;renderQuestion()};
    if(!answered&&!quiz.played){quiz.played=true;if(canSpeak())setTimeout(play,250)}
  }
  if(g&&quiz.chrono&&!answered){
    stopTimer();quiz.t=20;
    quiz.timer=setInterval(()=>{quiz.t--;const el=$("#timer");if(el){el.textContent=quiz.t+" s";el.classList.toggle("low",quiz.t<=5)}
      if(quiz.t<=0){stopTimer();answer(-1)}},1000);
  }
}
function answer(k){
  stopTimer();const g=quiz.kind==="g";const bank=g?GRAMMAR:LISTEN;const store=g?S.gram:S.listen;
  const qi=quiz.set[quiz.i];quiz.ans[quiz.i]=k;
  const s=store[qi]||{ok:0,ko:0};if(k===bank[qi][2])s.ok++;else s.ko++;store[qi]=s;
  logActivity(g?"g":"l");quiz.played=false;renderQuestion();
}
function renderResult(){
  const g=quiz.kind==="g";const bank=g?GRAMMAR:LISTEN;
  const ok=quiz.set.filter((qi,k)=>quiz.ans[k]===bank[qi][2]).length;
  const msg=ok>=9?"Excellent, tu es prêt(e) pour cette partie.":ok>=7?"Bon niveau. Relis les explications des erreurs.":ok>=5?"Correct. Repasse par les fiches de la catégorie.":"Les questions ratées reviendront en priorité. Continue !";
  $("#main").innerHTML=`<section class="view"><div class="card" style="display:flex;flex-direction:column;gap:14px;align-items:flex-start">
    <p class="eyebrow">${g?"Part 5":"Part 2"} · résultat</p><div class="result mono">${ok}/10</div><p>${msg}</p>
    <div class="row"><button class="btn" id="again">Nouvelle série</button><button class="btn ghost" id="back">Retour</button></div></div></section>`;
  const kind=quiz.kind;const chrono=quiz.chrono;
  $("#again").onclick=()=>{startQuiz(kind,{chrono});if(kind==="l")quiz.reveal=!canSpeak();route()};
  $("#back").onclick=()=>{quiz=null;route()};
}

  $("#reset").onclick=()=>{if(!armed){armed=true;$("#reset").textContent="Confirmer l'effacement";$("#resetMsg").textContent="Toutes tes cartes et tes scores seront supprimés.";return}
    S={cards:{},gram:{},listen:{},days:{},dir:"en"};save();vq=null;quiz=null;renderHeader();$("#resetMsg").textContent="Progression effacée.";$("#reset").textContent="Effacer ma progression";armed=false};
}

/* ============ ROUTER ============ */
const VIEWS={accueil:homeView,vocab:vocabView,grammaire:grammarView,ecoute:listenView,fiches:fichesView};
function route(){
  const v=(location.hash||"#accueil").slice(1);const name=VIEWS[v]?v:"accueil";
  if(quiz&&((name==="grammaire"&&quiz.kind!=="g")||(name==="ecoute"&&quiz.kind!=="l")||(name!=="grammaire"&&name!=="ecoute"))){stopTimer();quiz=null}
  try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===name?"page":"false"));
  VIEWS[name]();
}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});
renderHeader();route();
})();
</script>
