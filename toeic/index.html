<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141d38">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>TOEIC J-19</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one answer-sheet column; (A)(B)(C)(D) bubbles are the motif; navy "exam booklet" hero; tabs at the thumb on phone, on top on desktop */
:root{
  --paper:#f3f5fa;
  --sheet:#ffffff;
  --ink:#141d38;
  --ink-soft:#5a6480;
  --line:#dbe0ec;
  --blue:#2346c8;
  --blue-wash:#e7ecfc;
  --hero:#141d38;
  --hero-fg:#f3f5fa;
  --hero-soft:#a9b4d6;
  --marker:#ffd84d;
  --marker-ink:#3b2f00;
  --good:#15804d;
  --good-wash:#e2f4ea;
  --bad:#c23a2b;
  --bad-wash:#fbe8e5;
  --shadow:0 1px 2px rgba(20,29,56,.05),0 8px 28px rgba(20,29,56,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1122;--sheet:#151c33;--ink:#e9edf8;--ink-soft:#9ba6c3;--line:#29324f;
    --blue:#8fa7ff;--blue-wash:#1d2850;--hero:#1b2550;--hero-fg:#f3f5fa;--hero-soft:#aab6dd;
    --marker:#ffd84d;--marker-ink:#2a2100;
    --good:#4fca8c;--good-wash:#11331f;--bad:#ff8475;--bad-wash:#3b1916;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1122;--sheet:#151c33;--ink:#e9edf8;--ink-soft:#9ba6c3;--line:#29324f;
  --blue:#8fa7ff;--blue-wash:#1d2850;--hero:#1b2550;--hero-fg:#f3f5fa;--hero-soft:#aab6dd;
  --marker:#ffd84d;--marker-ink:#2a2100;
  --good:#4fca8c;--good-wash:#11331f;--bad:#ff8475;--bad-wash:#3b1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h2{font-size:1.65rem;font-weight:800;letter-spacing:-.015em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.note{font-size:.86rem;color:var(--ink-soft)}
.hl{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 .1em}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--f-mono);font-size:.74rem;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--marker)}.dot.err{background:var(--bad)}

nav.tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:6px 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs a{position:relative;flex:1;text-align:center;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:.9rem;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a .ico{font-family:var(--f-mono);font-size:.8rem;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
nav.tabs a[aria-current="page"]{color:var(--blue);background:var(--blue-wash)}
nav.tabs a[aria-current="page"] .ico{background:var(--blue);color:var(--sheet);border-color:var(--blue)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--sheet);font-family:var(--f-mono);font-size:.66rem;display:grid;place-items:center}
@media (max-width:640px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-bottom:0;border-top:1px solid var(--line);background:var(--sheet);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{font-size:.72rem}
}

.view{display:flex;flex-direction:column;gap:22px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--sheet);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--sheet)}
.btn.bad{background:var(--bad);color:var(--sheet)}
.btn.warn{background:var(--marker);color:var(--marker-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 12px;font-size:.88rem}
.btn .n{font-family:var(--f-mono);font-size:.8rem;background:rgba(0,0,0,.14);border-radius:6px;padding:1px 6px}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.08);box-shadow:0 0 0 26px rgba(255,255,255,.03),0 0 0 52px rgba(255,255,255,.02);pointer-events:none}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(4.2rem,19vw,6.8rem);line-height:.85;letter-spacing:-.045em}
.hero .big small{font-size:.32em;letter-spacing:0;vertical-align:top;margin-right:3px;color:var(--marker)}
.hero .eyebrow{color:var(--hero-soft)}
.hero p{max-width:36ch}
.hero .focus{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.25}
@media (max-width:420px){.hero{grid-template-columns:1fr;gap:12px}}

.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:inherit;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--sheet)}
.goal:hover{border-color:var(--blue)}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.done .fg{stroke:var(--good)}
.ring text{font-family:var(--f-mono);font-size:15px;font-weight:700;fill:var(--ink)}
.goal b{font-size:.9rem}
.goal span{font-size:.75rem;color:var(--ink-soft)}

.errbox{border:1.5px solid var(--bad);background:var(--bad-wash);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.errbox.clear{border-color:var(--good);background:var(--good-wash)}

.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--blue);min-height:3px}
.col .bar.empty{background:var(--line)}
.col .bar.today{background:var(--marker)}
.col .v{font-family:var(--f-mono);font-size:.72rem;font-weight:700}
.col .d{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-soft)}
.trend{display:flex;gap:16px;flex-wrap:wrap}
.trend div{display:flex;flex-direction:column}
.trend b{font-family:var(--f-mono);font-size:1.4rem}

.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.86rem;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.day .d{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-soft)}
.day.past{opacity:.55}
.day.now{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-wash)}
.day.exam{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.day.exam .d{color:var(--marker-ink)}

/* flashcards */
.flash{min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;cursor:pointer;user-select:none;position:relative}
.flash .word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.9rem);letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.05}
.flash .tr{font-size:1.35rem;font-weight:700;color:var(--blue)}
.flash .ex{font-style:italic;color:var(--ink-soft);max-width:44ch}
.flash.shown{border-color:var(--blue)}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-soft)}
.tag.red{border-color:var(--bad);color:var(--bad)}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.boxes .bx{flex:1;min-width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:.74rem;background:var(--sheet)}
.boxes .bx b{display:block;font-family:var(--f-mono);font-size:1.1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* quiz */
.q{font-size:1.22rem;line-height:1.55}
.q .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.q .fill{font-weight:700;color:var(--good);border-bottom:2px solid var(--good);padding:0 .15em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--sheet);cursor:pointer;font-size:1.03rem}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-wash)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.ko{border-color:var(--bad);background:var(--bad-wash)}
.opt.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.dim{opacity:.6}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--good)}.progress i.ko{background:var(--bad)}.progress i.cur{background:var(--blue)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
.retry{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:2px 7px}

.verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;font-weight:700;font-size:1.05rem}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.ko{background:var(--bad-wash);color:var(--bad)}
.verdict .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sheet);flex:none;font-family:var(--f-mono)}
.verdict.ok .ic{background:var(--good)}.verdict.ko .ic{background:var(--bad)}
.explain{display:flex;flex-direction:column;gap:12px}
.ex-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:baseline}
.ex-row > span:first-child{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
.ex-row > div{min-width:0}
.rule{border-left:4px solid var(--marker);padding:8px 12px;background:var(--paper);border-radius:0 10px 10px 0;font-weight:700}
.whys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.whys li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.whys .bub{width:24px;height:24px;font-size:.72rem}
.whys li.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.whys li.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.whys li.ok b{color:var(--good)}
@media (max-width:480px){.ex-row{grid-template-columns:1fr;gap:4px}}
.recap{display:flex;flex-direction:column;gap:12px}
.recap > div{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.result{font-family:var(--f-display);font-weight:800;font-size:3.4rem;color:var(--blue);line-height:1}

details.fiche{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
details.fiche summary{cursor:pointer;padding:14px 0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-soft)}
details.fiche[open] summary::after{content:"–"}
.fiche-body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fiche-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .opt,.goal,.btn{transition:background .15s,border-color .15s,transform .1s}
  .btn:active{transform:scale(.98)}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
  .ring .fg{transition:stroke-dashoffset .5s}
}

:root{--marker-wash:#fff5c7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--marker-wash:#3a3210}}
:root[data-theme="dark"]{--marker-wash:#3a3210}
.tipbox{background:var(--marker-wash);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.tipbox .eyebrow{color:var(--ink)}
.opt.sel{border-color:var(--blue);background:var(--blue-wash)}
.opt.sel .bub{background:var(--blue);border-color:var(--blue);color:var(--sheet)}
.photo{border:2px dashed var(--line);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:flex-start;background:var(--paper)}
.photo .cam{flex:none;width:44px;height:44px;border-radius:12px;background:var(--ink);color:var(--paper);display:grid;place-items:center;font-family:var(--f-mono);font-size:.7rem;letter-spacing:.05em}
.photo p{font-style:italic}
.doc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--sheet)}
.doc .dh{font-family:var(--f-mono);font-size:.78rem;white-space:pre-line;padding:10px 14px;background:var(--paper);border-bottom:1px solid var(--line);color:var(--ink-soft)}
.doc .db{padding:14px;white-space:pre-line;font-size:.98rem;overflow-wrap:anywhere}
.slot{font-family:var(--f-mono);font-weight:700;background:var(--blue-wash);color:var(--blue);border-radius:6px;padding:0 6px;white-space:nowrap}
.slot.done{background:var(--good-wash);color:var(--good)}
.subq{border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:10px}
.subq:first-child{border-top:0;padding-top:0}
.subq .qt{font-weight:700;font-size:1.05rem}
.mini{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.mini.ok{color:var(--good)}.mini.ko{color:var(--bad)}
.script{display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.script b{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft);margin-right:6px}
.parts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.part{display:flex;flex-direction:column;gap:10px}
.part h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.part h3 .mono{font-size:.75rem;color:var(--ink-soft);font-weight:500}
.part .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:.85rem;color:var(--ink-soft)}
.part .meta b{font-family:var(--f-mono);color:var(--ink)}
.prog{display:flex;flex-direction:column;gap:0}
.blk{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.blk:first-child{border-top:0;padding-top:0}
.blk .min{font-family:var(--f-mono);font-size:.75rem;color:var(--ink-soft);width:52px}
.blk .lbl{display:flex;flex-direction:column;gap:5px;min-width:0}
.blk .lbl b{font-size:.98rem}
.blk .track{height:7px;border-radius:4px;background:var(--line);overflow:hidden}
.blk .track i{display:block;height:100%;background:var(--blue)}
.blk.done .track i{background:var(--good)}
.blk .cnt{font-family:var(--f-mono);font-size:.8rem;color:var(--ink-soft)}
.blk a.btn{padding:8px 12px;font-size:.85rem}
@media (max-width:480px){.blk{grid-template-columns:1fr auto}.blk .min{display:none}}
.score{display:flex;flex-direction:column;gap:12px}
.score .nums{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline}
.score .tot{font-family:var(--f-display);font-weight:800;font-size:3rem;line-height:1;color:var(--blue)}
.score .tot.ok{color:var(--good)}
.sbar{position:relative;height:12px;border-radius:6px;background:var(--line)}
.sbar i{position:absolute;left:0;top:0;bottom:0;border-radius:6px;background:var(--blue)}
.sbar .goal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--bad);border-radius:2px}
.sbar .gl{position:absolute;top:-24px;transform:translateX(-50%);font-family:var(--f-mono);font-size:.7rem;color:var(--bad);font-weight:700;white-space:nowrap}
.level{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 7px}
.toggle{display:inline-flex;align-items:center;gap:8px;font-size:.9rem;cursor:pointer}
.toggle input{width:18px;height:18px;accent-color:var(--blue)}
/* Police « livret d'examen » : les questions et documents du TOEIC papier sont composés dans une police à empattements type Times */
:root{--f-test:"Tinos","Times New Roman",Times,serif}
.q,.opt > span:last-child,.doc .db,.subq .qt,.script p,.whys b{font-family:var(--f-test)}
.q{font-size:1.28rem}
.opt{font-size:1.08rem}
.doc .db{font-size:1.04rem;line-height:1.5}
/* Coach Part 5 */
mark.nb{background:var(--marker-wash);color:inherit;border-bottom:2px solid var(--marker);padding:0 .1em;border-radius:3px}
.hints{display:flex;flex-direction:column;gap:8px}
.hint{border:1px solid var(--line);border-left:4px solid var(--blue);border-radius:0 12px 12px 0;padding:10px 12px;background:var(--paper);display:flex;flex-direction:column;gap:4px}
.hint .eyebrow{color:var(--blue)}
.hintbar{border-radius:12px;padding:10px 12px;font-size:.92rem}
.hintbar.auto{background:var(--good-wash);color:var(--ink)}
.lvl{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;border-radius:999px;padding:3px 9px;white-space:nowrap;border:1px solid transparent}
.lvl-guide{background:var(--bad-wash);color:var(--bad);border-color:var(--bad)}
.lvl-aide{background:var(--marker-wash);color:var(--ink);border-color:var(--marker)}
.lvl-auto{background:var(--good-wash);color:var(--good);border-color:var(--good)}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--good)}
.method{border:1px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.method ol,.reflex{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:5px}
.lvlmsg{font-size:.92rem;border-radius:10px;padding:8px 10px}
.lvlmsg.up{background:var(--good-wash)}
.lvlmsg.down{background:var(--paper)}
details.skill summary{align-items:center;font-size:1rem}
details.skill .sk-name{flex:1;min-width:0}
.testfont{font-family:var(--f-test)}
.testfont b{color:var(--good)}
@media (max-width:640px){nav.tabs a{font-size:.66rem;padding:8px 2px}nav.tabs a .ico{width:26px;height:26px}}
.natcards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.natcard{border:1px solid var(--line);border-top:4px solid var(--blue);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-width:0}
.natcard > div{display:flex;flex-direction:column;gap:1px}
.natcard .nt{font-family:var(--f-display);font-size:1.25rem}
.natcard.n1{border-top-color:var(--good)}.natcard.n2{border-top-color:var(--marker)}.natcard.n3{border-top-color:var(--bad)}
.natgo .btn{width:100%}
</style>

G("The new software will help employees work more ___.",["efficient","efficiency","efficiently","efficiencies"],2,"Nature des mots","Le nouveau logiciel aidera les employés à travailler plus efficacement.","« work more ___ » : on décrit COMMENT ils travaillent, donc on décrit un verbe.","Pour décrire un verbe, on utilise un adverbe (souvent en -ly).",["Adjectif : il décrit un nom, pas un verbe.","Nom (« l'efficacité ») : impossible après « work more ».","Adverbe : il décrit le verbe « work ».","Nom au pluriel : aucun sens ici."]),

const CAT_TIPS={
"Nature des mots":["Regarde d'abord les 4 options : si ce sont des formes du même mot, ne lis que les mots autour du trou. Tu gagnes 10 secondes.","Le mot juste avant et le mot juste après le trou suffisent presque toujours à trouver la nature du mot.","Les adverbes en -ly se placent souvent entre l'auxiliaire et le participe : « has significantly increased »."],
"Prépositions":["Pour le temps, cherche le repère : une date (on), une durée (for), un point de départ (since), une échéance (by).","Apprends les prépositions avec leur mot : responsible for, interested in, in charge of, in accordance with.","Action ponctuelle (submit, finish) → by. Action qui dure (stay, remain, be open) → until."],
"Connecteurs":["Pose-toi deux questions : quel sens (cause, opposition, ajout) ? Et qu'est-ce qui suit (un nom ou une phrase) ? Ça élimine trois options sur quatre.","despite / because of / due to + NOM. although / because / even though + SUJET + VERBE.","however, therefore, moreover relient deux phrases, avec ponctuation : « ; however, »."],
"Temps & voix":["Cherche le marqueur de temps (since, yesterday, next, by the end of) : il impose le temps du verbe.","Si le sujet est une chose (the package, the report), pense au passif : be + participe passé.","Après un modal (will, must, should, can) : toujours la base verbale, sans -s ni -ing."],
"Pronoms":["Devant un nom → their / his / her. Après une préposition → them / him / her. Seul → theirs / his / hers.","who pour une personne, which pour une chose, whose + nom pour la possession.","« by + -self » = tout seul : by himself, by themselves."],
"Comparaison":["« than » dans la phrase = comparatif obligatoire. « the … of / in / so far » = superlatif.","much, far, significantly renforcent un comparatif. Jamais very."],
"Quantité":["Demande-toi si le nom se compte : fewer / many / a few + pluriel, less / much / little + indénombrable.","Indénombrables fréquents au TOEIC : information, equipment, advice, furniture, luggage, feedback."],
"Accords":["each, every, the number of, everyone → verbe au singulier.","Les mots entre le sujet et le verbe (of the participants, together with…) ne changent pas l'accord : trouve le vrai sujet."],
"Vocabulaire":["Quand les 4 options ont un sens proche, c'est une question de collocation : quel mot va naturellement avec le complément ?","Apprends les verbes avec leur complément : meet a deadline, conduct a survey, place an order, submit a report."]
};
const P2_TIPS=["Concentre-toi sur les 3 premiers mots de la question : c'est là qu'est l'information clé.","Si tu hésites, élimine d'abord les réponses qui répètent un mot de la question.","Une réponse qui ne répond pas directement (« Let me check », « I'm not sure ») est souvent la bonne.","Pendant la Part 2, il n'y a rien à lire : ferme les yeux une seconde et écoute le premier mot."];

GRAMMAR.push(
H("The board recommended that the proposal ___ revised before the next meeting.",["is","be","was","will be"],1,"Temps & voix","La direction a recommandé que la proposition soit révisée avant la prochaine réunion.","« recommended that » : un verbe de recommandation suivi de « that ».","recommend / suggest / insist / require that + sujet + BASE VERBALE (subjonctif), même au passé.",["« is » : indicatif, faux après « recommend that ».","Subjonctif : base verbale « be ».","« was » : on ne conjugue pas au passé après « recommended that ».","« will be » : pas de futur dans ce subjonctif."],"Dès que tu vois recommend, suggest, request, insist, require ou it is essential that, cherche la base verbale sans -s : « that he be », « that she submit »."),
H("Not only ___ the deadline, but the team also came in under budget.",["the team met","did the team meet","the team did meet","has the team met"],1,"Temps & voix","Non seulement l'équipe a respecté le délai, mais elle est aussi restée sous le budget.","« Not only » en tête de phrase.","Not only / Rarely / Never / Seldom en début de phrase → inversion : auxiliaire + sujet + verbe.",["Ordre normal : interdit après « Not only » en tête.","Inversion avec « did » au passé.","Ordre normal avec « did » : toujours pas d'inversion.","Present perfect : la suite « came » est au prétérit."],"Mot négatif en tête de phrase (Not only, Never, Rarely, Hardly, Only after) = inversion comme dans une question. C'est un classique des questions difficiles."),
H("___ completed the training, the new hires were assigned to their teams.",["Having","Have","Had","Being"],0,"Temps & voix","Après avoir terminé la formation, les nouvelles recrues ont été affectées à leurs équipes.","« ___ completed …, the new hires were… » : il n'y a pas de sujet avant la virgule.","Having + participe passé = « après avoir… » (action terminée avant l'autre).",["« Ayant terminé » : proposition participiale correcte.","Base verbale sans sujet : impossible.","« Had completed » demanderait un sujet ou une inversion conditionnelle.","« Being completed » : passif, sens faux."],"Une virgule et pas de sujet dans la première partie ? Pense à Having + participe (antériorité) ou V-ing (simultané)."),
H("Had we known about the delay, we ___ the client earlier.",["would notify","will notify","would have notified","had notified"],2,"Temps & voix","Si nous avions été au courant du retard, nous aurions prévenu le client plus tôt.","« Had we known » = If we had known (passé irréel).","Conditionnel passé : If + had + participe → would have + participe. « Had we known » = If we had known.",["Conditionnel présent : ne correspond pas au passé irréel.","Futur : impossible dans une hypothèse irréelle.","would have + participe passé.","Plus-que-parfait : il faut « would have » dans la partie résultat."],"Une phrase qui commence par Had, Should ou Were sans « if » est une condition inversée. Had → would have + participe."),
H("The renovation will be completed in ___ with the city's safety regulations.",["accordance","according","accord","accordingly"],0,"Prépositions","Les travaux seront réalisés conformément aux règles de sécurité de la ville.","« in ___ with » : expression figée.","in accordance with = conformément à.",["Expression « in accordance with ».","« according to » existe, mais sans « in » ni « with ».","« accord » : on dit « of its own accord » (de son plein gré).","Adverbe « en conséquence »."],"Expressions figées très fréquentes : in accordance with, in compliance with, on behalf of, in light of, with regard to, in response to."),
H("Ms. Ito accepted the award on ___ of the entire research team.",["behalf","part","account","place"],0,"Prépositions","Mme Ito a reçu le prix au nom de toute l'équipe de recherche.","« on ___ of the team » : elle accepte à la place de l'équipe.","on behalf of = au nom de, pour le compte de.",["on behalf of.","« on the part of » = de la part de : il faudrait « the ».","« on account of » = à cause de : sens faux.","« in place of » = au lieu de : préposition « in »."],"on behalf of tombe souvent dans les e-mails : « I'm writing on behalf of… »."),
H("The new policy will ___ all full-time employees, regardless of their department.",["effect","affect","effective","affection"],1,"Vocabulaire","La nouvelle politique concernera tous les salariés à temps plein, quel que soit leur service.","« will ___ all employees » : après « will », il faut un verbe qui veut dire « toucher, concerner ».","affect (verbe) = affecter, toucher · effect (nom) = effet.",["« effect » est presque toujours un nom (an effect).","Verbe « affect ».","Adjectif : il faut un verbe après « will ».","Nom « affection »."],"Moyen mnémotechnique : Affect = Action (verbe), Effect = End result (nom)."),
H("Prices have ___ steadily over the past three quarters.",["raised","risen","rose","arisen"],1,"Vocabulaire","Les prix ont augmenté régulièrement au cours des trois derniers trimestres.","« Prices have ___ » : pas de complément après le verbe.","rise / rose / risen = augmenter tout seul · raise / raised = augmenter QUELQUE CHOSE.",["« raise » a besoin d'un complément (raise prices).","Participe passé de « rise ».","Prétérit : après « have », il faut le participe passé.","« arise » = surgir (un problème)."],"Pas de complément direct → rise. Complément direct → raise. Même logique pour lie / lay."),
H("Those ___ wish to attend the seminar should register by Friday.",["who","whom","which","whoever"],0,"Pronoms","Les personnes qui souhaitent assister au séminaire doivent s'inscrire avant vendredi.","« Those ___ wish » : « those » = les personnes, et il manque le sujet de « wish ».","those who = ceux qui.",["those who + verbe.","whom : complément, jamais suivi directement d'un verbe.","which : pour des choses.","« whoever » ne s'emploie pas après « those »."],"« Those who » est une structure très fréquente dans les annonces : « Those who are interested… »."),

H("The applicants were ___ qualified that the manager decided to interview all of them.",["such","so","very","too"],1,"Comparaison","Les candidats étaient si qualifiés que la responsable a décidé de tous les recevoir.","« ___ qualified that » : un adjectif seul suivi de « that ».","so + adjectif + that · such + (a) + adjectif + nom + that.",["such demande un nom après l'adjectif.","so + adjectif + that.","very ne s'emploie pas avec « that ».","too = trop : sens négatif, et « too … to »."],"so + adjectif seul ; such + nom. Regarde s'il y a un nom après l'adjectif."),

H("Rarely ___ such a high level of customer satisfaction.",["we have seen","have we seen","we saw","did we saw"],1,"Temps & voix","Nous avons rarement vu un tel niveau de satisfaction client.","« Rarely » en tête de phrase.","Rarely / Seldom / Never en tête → inversion : auxiliaire + sujet.",["Ordre normal : interdit après « Rarely » en tête.","Inversion avec l'auxiliaire « have ».","Ordre normal.","Après « did », il faut la base « see »."],"Un adverbe négatif en tête de phrase = l'ordre de la question. Cherche l'auxiliaire avant le sujet."),
H("Full-time employees are ___ to two weeks of paid vacation per year.",["eligible","entitled","allowed","able"],1,"Vocabulaire","Les salariés à temps plein ont droit à deux semaines de congés payés par an.","« are ___ to two weeks » : « to » est suivi d'un nom.","be entitled to + nom = avoir droit à · be eligible for + nom.",["eligible va avec « for ».","entitled to + nom.","allowed to + verbe, pas + nom.","able to + verbe."],"entitled to (droit), eligible for (remplir les conditions). Paire classique des questions difficiles."),

{title:"Offre d'emploi : comptable senior",docs:[{h:"SENIOR ACCOUNTANT · Bellmore Hospital Group",b:"Bellmore Hospital Group, which operates four hospitals across the Eastern region, is seeking a senior accountant to join its finance team at our main office in Ridgefield.\n\nThe successful candidate will prepare monthly financial statements, supervise a team of three junior accountants, and work closely with department heads to prepare annual budgets. The position also involves coordinating the yearly external audit.\n\nApplicants must hold a degree in accounting or finance and have at least five years of relevant experience, including two years in a supervisory role. Experience in the healthcare sector is desirable but not essential. Candidates should be comfortable using advanced spreadsheet software.\n\nWe offer a competitive salary, a generous pension plan, and flexible working hours. Occasional travel to our other hospitals will be required.\n\nTo apply, please submit a cover letter and résumé through our careers page by October 15. Interviews will take place in the last week of October."}],qs:[

{h:1,title:"Article : portrait d'entrepreneuse",docs:[{h:"STATE BUSINESS WEEKLY",b:"When Nadia Hassan opened her first coffee shop in 2016, she had no business experience and only two employees. [1] Today, Daily Grind operates 14 cafés across the state and employs more than 200 people. [2] Ms. Hassan credits much of her success to her decision to buy coffee directly from small farms in Colombia and Ethiopia. « It costs more, but our customers can taste the difference, » she says. [3] The company also stands out for its staff policies: all employees, including part-time workers, receive health insurance and paid training. [4] Next year, Daily Grind plans to open its first locations outside the state, starting with two cafés in Portland."}],qs:[

{h:1,title:"E-mail : résultats et primes",docs:[{h:"From: Rachel Kim\nTo: All Sales Representatives\nSubject: Q3 results and new incentive plan",b:"Dear team,\n\nI'm pleased to share that our region exceeded its third-quarter sales target by 12 percent, the best result in the company. Special congratulations go to the Eastside office, which signed three new corporate clients in September alone.\n\nAs promised, management has approved a new incentive plan for the fourth quarter. Representatives who exceed their individual targets by at least 10 percent will receive a bonus equal to 5 percent of their quarterly sales. In addition, the representative with the highest number of new clients will win a trip for two to Lisbon.\n\nPlease note that, starting October 1, all client meetings must be recorded in the new CRM system within 24 hours. This will allow us to track progress more accurately and calculate bonuses fairly.\n\nIf you have questions about the plan, I will be holding an online information session next Tuesday at 11 A.M.\n\nBest,\nRachel"}],qs:[

{title:"Article : réouverture d'un musée",docs:[{h:"HARLOW TIMES",b:"After a two-year renovation, the Harlow Museum of Science will reopen to the public on May 3. The $25 million project has added a new wing dedicated to space exploration, a 200-seat planetarium, and an interactive area for children under eight.\n\n« We wanted visitors to be able to touch, build, and experiment, not just look, » said museum director Elena Petrova. More than half of the new exhibits are interactive.\n\nTo celebrate the reopening, admission will be free during the first weekend. After that, regular prices will apply: $18 for adults and $10 for children. Planetarium shows require a separate ticket and can be booked online.\n\nThe museum will also extend its hours on Thursdays, staying open until 9 P.M. for special evening programs aimed at adults."}],qs:[

{h:1,title:"Lettre aux actionnaires",docs:[{h:"To our shareholders",b:"The past year has been one of significant change for Norvik Electronics. Despite rising component costs and weaker demand in Europe, total revenue increased by 6 percent to $2.1 billion, driven mainly by strong sales of our smart home products in North America.\n\nNet profit, however, fell by 4 percent, largely because of the costs associated with closing our factory in Leeds and moving production to our more efficient plant in Monterrey. While this decision was difficult, we expect it to reduce manufacturing costs by around $30 million per year from next year onward.\n\nLooking ahead, we will continue to invest in research and development, which accounted for 9 percent of revenue this year. Our goal is to launch at least five new products over the next 18 months.\n\nThe board has proposed a dividend of $0.45 per share, unchanged from last year.\n\nSincerely,\nAnders Lund, Chief Executive Officer"}],qs:[
Q("What contributed most to the revenue increase?",["Sales in North America","Lower component costs","Strong European demand","The Leeds factory"],0,"« driven mainly by strong sales … in North America »",["driven mainly by = surtout grâce à.","Contraire : coûts en hausse.","Contraire : demande plus faible.","Fermée."],"« Despite » introduit des éléments NÉGATIFS : ils ne sont pas la cause du succès."),

const SKILLS=[
{id:"n-adj",name:"Il faut un adjectif",cat:"Nature des mots",spot:"Les 4 options sont des formes du même mot (-ive, -ly, -tion…). C'est une question de NATURE.",rule:"Avant un nom → ADJECTIF. Après be, feel, seem, become, remain, find + objet → ADJECTIF.",steps:["Lis les 4 options : même racine ? Alors c'est une question de nature.","Regarde le mot JUSTE APRÈS le trou : c'est un nom ?","Si oui → choisis l'adjectif (-ive, -ful, -able, -al, -ous, -ent, -ic)."],ex:["a <b>reliable</b> supplier","an <b>impressive</b> result","The plan seems <b>effective</b>."],trap:"Un -ly devant un nom est toujours faux : « a carefully review » ✗."},
{id:"n-adv",name:"Il faut un adverbe",cat:"Nature des mots",spot:"Les 4 options ont la même racine, et l'une se termine en -ly.",rule:"Pour décrire un VERBE, un ADJECTIF, un PARTICIPE ou un COMPARATIF → ADVERBE (souvent -ly).",steps:["Même racine dans les 4 options → question de nature.","Regarde autour : verbe (has ___ reduced), adjectif (___ satisfied), participe (___ located) ?","Si oui → l'option en -ly."],ex:["has <b>greatly</b> improved","<b>highly</b> recommended","<b>considerably</b> higher"],trap:"Après feel, seem, look, become : adjectif, pas adverbe (feel comfortable)."},
{id:"n-nom",name:"Il faut un nom",cat:"Nature des mots",spot:"Les 4 options ont la même racine (-tion, -ment, -ity, -ance…).",rule:"Après a / an / the / my / your / their / many, ou avant of → NOM.",steps:["Même racine → question de nature.","Regarde le mot JUSTE AVANT : article, possessif, adjectif ?","Et juste après : of, une préposition, un verbe ? → NOM (-tion, -ment, -ity, -ance, -ness)."],ex:["the <b>approval</b> of","your <b>cooperation</b>","many <b>suggestions</b>"],trap:"Après many / several / few, le nom est au pluriel (-s)."},
{id:"n-verb",name:"Il faut un verbe de base",cat:"Nature des mots",spot:"Même racine dans les 4 options, et le trou suit un modal ou « to ».",rule:"Après will, can, must, should, may, to, please, let → VERBE DE BASE (sans -s, sans -ing).",steps:["Même racine → question de nature.","Regarde le mot juste avant : will / can / must / to / please ?","Si oui → la forme verbe de base (-ize, -ify, -ate ou forme simple)."],ex:["will <b>expand</b>","plans to <b>diversify</b>","Please <b>ensure</b> that…"],trap:"Après un modal : jamais de -s (« will leads » ✗)."},
{id:"n-part",name:"-ing ou -ed ?",cat:"Nature des mots",spot:"Deux options proches : une en -ing, une en -ed (surprising / surprised).",rule:"-ING = qui PROVOQUE (a boring meeting). -ED = qui RESSENT ou qui SUBIT (bored staff, a completed form).",steps:["Repère la paire -ing / -ed.","Le nom décrit provoque-t-il l'effet (-ing) ou le subit-il (-ed) ?","Une chose qui a été faite par quelqu'un → -ed (the attached file)."],ex:["a <b>surprising</b> result","<b>satisfied</b> customers","the <b>completed</b> form"],trap:"Les personnes ressentent (-ed) ; les choses provoquent (-ing)."},
{id:"v-temps",name:"Le temps du verbe",cat:"Temps & voix",spot:"Les 4 options sont le même verbe à des temps différents.",rule:"Le MARQUEUR DE TEMPS décide : since/for/so far/yet → has done · yesterday/ago/last → did · next/tomorrow → will do · by the time + passé → had done.",steps:["Même verbe, temps différents → question de temps.","Cherche le marqueur de temps dans la phrase (souligne-le).","Applique : since → present perfect, last → prétérit, next → futur."],ex:["<b>since</b> 2018 → has worked","<b>last</b> year → opened","<b>next</b> month → will open"],trap:"Après if / when / as soon as, on met le présent même pour le futur."},
{id:"v-passif",name:"Actif ou passif",cat:"Temps & voix",spot:"Les options mélangent une forme active (cleans) et passive (is cleaned).",rule:"Si le sujet SUBIT l'action (une chose, souvent) → PASSIF : be + participe passé. « by + quelqu'un » = passif.",steps:["Regarde le sujet : fait-il l'action ou la subit-il ?","Un colis, un rapport, une salle ne font rien → passif.","Choisis be (au bon temps) + participe passé."],ex:["The room <b>is cleaned</b> daily.","The order <b>was shipped</b>.","must <b>be signed</b>"],trap:"Après un modal, le passif est « be + participe » (must be sent)."},
{id:"v-accord",name:"Accord sujet-verbe",cat:"Accords",spot:"Les options sont is / are, has / have, ou verbe avec ou sans -s.",rule:"Trouve le VRAI sujet. each, every, one of, the number of, the list of, information → SINGULIER.",steps:["Barre ce qui est entre le sujet et le verbe (of the employees, together with…).","Le vrai sujet est-il singulier ou pluriel ?","Singulier → is / has / verbe + s."],ex:["The list of names <b>is</b>…","Every employee <b>receives</b>…","One of our clients <b>has</b>…"],trap:"« The number of » = singulier ; « A number of » = pluriel."},
{id:"v-ing-to",name:"-ing ou to + verbe ?",cat:"Temps & voix",spot:"Les options sont to do / doing / do / done après un verbe.",rule:"+ ING : avoid, consider, suggest, recommend, mind, finish, enjoy, look forward to, be used to. + TO : agree, decide, plan, hope, need, want, be able to.",steps:["Repère le verbe juste avant le trou.","Est-il dans la liste -ing ou la liste to ?","Après une préposition (for, of, about, to dans look forward to) → -ing."],ex:["avoid <b>making</b>","decided <b>to close</b>","look forward to <b>meeting</b>"],trap:"« look forward to » et « be used to » : to est une préposition → -ing."},
{id:"v-cond",name:"Conditions et subjonctif",cat:"Temps & voix",spot:"La phrase contient if, unless, would, ou suggest / recommend / important that.",rule:"if + présent → will · if + passé → would · if + had done → would have done. recommend / suggest / important THAT + verbe de base.",steps:["Repère if / unless / would, ou « … that » après suggest / recommend / important.","Condition : regarde l'autre moitié (will, would, would have).","Après recommend / suggest / insist / important that → base verbale sans -s."],ex:["If it <b>rains</b>, we will…","If we <b>had</b> staff, we would…","suggested that he <b>submit</b>"],trap:"Jamais « will » après if dans la partie condition."},
{id:"pr-temps",name:"Prépositions de temps",cat:"Prépositions",spot:"Les 4 options sont at / on / in / by / until / since / for / within.",rule:"at + heure · on + jour/date · in + mois/année · by = au plus tard · until = jusqu'à (ça dure) · since + point de départ · for + durée · within = dans un délai de.",steps:["Regarde ce qui suit le trou : heure, jour, mois, durée ?","Regarde le verbe : action ponctuelle (submit → by) ou qui dure (stay open → until) ?","Applique la règle."],ex:["<b>at</b> 3 P.M.","<b>on</b> May 5","<b>by</b> Friday / <b>until</b> 9 P.M."],trap:"by ≠ until : submit BY Friday, stay open UNTIL 9."},
{id:"pr-lieu",name:"Prépositions de lieu et expressions",cat:"Prépositions",spot:"Les options sont des prépositions, et le trou suit un adjectif ou un verbe.",rule:"Apprends les blocs : responsible for, in charge of, interested in, report to, located at / in, between (2) / among (3+).",steps:["Regarde le mot juste avant le trou (interested, report, charge…).","Rappelle-toi le bloc par cœur.","Pour un lieu : at (point précis), in (espace fermé), on (surface)."],ex:["in charge <b>of</b>","report <b>to</b>","<b>at</b> the end of the hallway"],trap:"Calque du français : « responsible of » ✗ → responsible for."},
{id:"cx-nom-phrase",name:"Connecteur : + nom ou + phrase ?",cat:"Connecteurs",spot:"Les options mélangent despite / although, because / because of, during / while.",rule:"+ NOM : despite, in spite of, because of, due to, during. + PHRASE (sujet + verbe) : although, even though, because, while.",steps:["Regarde ce qui suit le trou jusqu'à la virgule.","Y a-t-il un verbe conjugué ? Oui → connecteur + phrase. Non → connecteur + nom.","Puis vérifie le sens (cause ou opposition)."],ex:["<b>Despite</b> the rain,…","<b>Although</b> it rained,…","<b>because of</b> a problem"],trap:"despite et although ont le même sens : seule la grammaire les sépare."},
{id:"cx-sens",name:"Connecteur : le bon sens",cat:"Connecteurs",spot:"Les options sont however, therefore, unless, whereas, so that…",rule:"Opposition : however, nevertheless, whereas. Conséquence : therefore, consequently. Condition : if, unless (= sauf si). But : so that.",steps:["Lis les deux idées reliées par le trou.","Quelle relation : opposition, conséquence, condition, but ?","Choisis le connecteur de cette famille."],ex:["expensive; <b>however</b>, popular","costs rose; <b>therefore</b>, prices rose","<b>unless</b> you pay"],trap:"unless = if … not : relis la phrase avec « sauf si »."},
{id:"pro-pers",name:"Pronoms personnels et possessifs",cat:"Pronoms",spot:"Les options sont I / me / my / mine / myself (ou they / them / their…).",rule:"Sujet → I, they · après un verbe ou une préposition → me, them · devant un nom → my, their · seul → mine, theirs · même personne / tout seul → myself, themselves.",steps:["Regarde la place du trou : sujet, après préposition, devant un nom, seul ?","Choisis la forme correspondante.","« by + -self » = tout seul."],ex:["Ms. Kim and <b>I</b> will…","to Mr. Hale and <b>me</b>","<b>their</b> ideas"],trap:"its (possessif) ≠ it's (it is)."},
{id:"pro-rel",name:"Pronoms relatifs",cat:"Pronoms",spot:"Les options sont who / which / whose / whom / that / what.",rule:"who = personne (sujet) · which / that = chose · whose + nom = dont · whom = personne (complément) · what = ce que. Après une virgule : jamais that.",steps:["Regarde le nom juste avant : personne ou chose ?","Regarde juste après : un verbe (who / which), un nom (whose), un sujet (whom / that) ?","Virgule avant le trou → which ou who."],ex:["the man <b>who</b> called","the client <b>whose</b> order","<b>what</b> customers want"],trap:"Pas de nom avant le trou + « ce que » → what."},
{id:"comp",name:"Comparatifs et superlatifs",cat:"Comparaison",spot:"Les options sont fast / faster / fastest / more…",rule:"than → comparatif (-er / more) · the … of / in / ever → superlatif (-est / most) · as … as → égalité. much / far renforcent un comparatif (jamais very).",steps:["Cherche than, the, as … as dans la phrase.","than → comparatif ; the → superlatif ; as → forme simple.","Mot court → -er / -est ; mot long → more / most."],ex:["<b>faster</b> than","<b>the most</b> experienced","<b>much</b> lower than"],trap:"« more faster » ✗ et « very better » ✗."},
{id:"quant",name:"Quantité",cat:"Quantité",spot:"Les options sont much / many / few / little / each / every / all.",rule:"Dénombrable (-s) : many, few, a few, fewer. Indénombrable (information, time, money) : much, little, less. each / every + singulier.",steps:["Regarde le nom après le trou : pluriel en -s ou indénombrable ?","Pluriel → many / few / fewer. Indénombrable → much / little / less.","each / every → nom singulier."],ex:["<b>many</b> clients","<b>much</b> time","<b>every</b> employee"],trap:"information, equipment, advice, luggage : jamais de -s."},
{id:"voc",name:"Vocabulaire et collocations",cat:"Vocabulaire",spot:"Les 4 options sont des mots différents de même nature (4 verbes, 4 noms…).",rule:"Ce n'est pas la grammaire, c'est l'association : meet a deadline, conduct a survey, make an appointment, give a presentation.",steps:["Les options ont le même rôle grammatical → question de sens.","Lis le complément après le trou (a deadline, a survey…).","Choisis le verbe qui « va avec » ce complément."],ex:["<b>meet</b> a deadline","<b>conduct</b> a survey","<b>make</b> an appointment"],trap:"Le calque du français est souvent faux : « do a presentation » ✗ → give."},
{id:"inv",name:"Structures avancées (870+)",cat:"Temps & voix",spot:"La phrase commence par Rarely, Not only, Only after, Had, Should, So…",rule:"Mot négatif ou restrictif en tête → inversion (auxiliaire + sujet). Had we known = If we had known. Should you need = If you need.",steps:["Repère le mot en tête de phrase.","S'il est négatif / restrictif → cherche l'ordre de la question (have we, did they).","Had / Should / Were sans if → condition."],ex:["Rarely <b>have we</b> seen…","Not only <b>did she</b>…","<b>Should</b> you need help,…"],trap:"Après « did » : verbe de base (did they send)."}
];

/* ================= NATURE DES MOTS : nom, verbe, adjectif, adverbe ================= */
/* t : A = mot surligné dans une phrase · B = quel type de mot dans le trou · C = mot seul (suffixes et pièges)
   a : 0 nom · 1 verbe · 2 adjectif · 3 adverbe. {mot} = mot surligné. fill = mot qui va dans le trou (B). */
const NAT=["un nom","un verbe","un adjectif","un adverbe"];
const NAT_NO=[
 "Pas un nom : un nom désigne une chose, une personne ou une idée, et se place après a / the / my ou avant of.",
 "Pas un verbe : un verbe exprime une action et se place après le sujet ou après will / can / to.",
 "Pas un adjectif : un adjectif décrit un nom et se place avant ce nom ou après be / seem / feel.",
 "Pas un adverbe : un adverbe décrit un verbe, un adjectif ou un participe, souvent en -ly."];
const NA=(t,s,a,why,how,trap,fill)=>{const w=NAT_NO.slice();w[a]=why;return {ty:t,s,a,o:NAT,w,k:how,r:NAT_RULE[a],t:trap||"",fill,trap:!!trap}};
const NAT_RULE=[
 "NOM : après a / an / the / my / many, avant of, ou sujet du verbe. Suffixes : -tion, -ment, -ity, -ance, -ness, -er, -or, -ee, -ant, -al.",
 "VERBE : après le sujet, après will / can / must / to / please. Il se conjugue (-s, -ed, -ing).",
 "ADJECTIF : avant un nom, ou après be / seem / feel / become / look / remain. Suffixes : -ive, -able, -ful, -ous, -al, -ic, -ent.",
 "ADVERBE : décrit un verbe (works hard), un adjectif (very good), un participe (well trained). Souvent -ly."];

  const o=Object.assign(blank(),x);
  if((x.v||0)<3){
    const q={};Object.entries(x.q||{}).forEach(([k,r])=>{
      if(/^g\d+$/.test(k)) q["p5:"+k.slice(1)]=r; else if(/^l\d+$/.test(k)) q["p2:"+k.slice(1)]=r; else q[k]=r;});
    o.q=q;
    const days={};Object.entries(x.days||{}).forEach(([d,y])=>{days[d]={v:y.v||0,vOk:y.vOk||0,p5:y.g||0,p5Ok:y.gOk||0,p2:y.l||0,p2Ok:y.lOk||0}});
    o.days=days;o.v=3;
  }
  return o;
}

let db=null,uid=null,saving=false,again=false,pushT=null,syncState="local";
function setSync(st){syncState=st;const el=document.getElementById("sync");if(!el)return;
  const m={ok:["ok","Sauvegardé"],saving:["warn","Sauvegarde…"],local:["","Sur cet appareil"],err:["err","Hors ligne"],wait:["warn","Connexion…"]}[st];
  el.innerHTML=`<i class="dot ${m[0]}"></i>${m[1]}`;

const ref=()=>db.doc("data/users/"+uid+"/toeic");
function save(){S.updated=Date.now();saveLocal();if(db){setSync("saving");clearTimeout(pushT);pushT=setTimeout(push,1200)}}
async function push(){
  if(!db)return; if(saving){again=true;return}
  saving=true;
  try{await ref().set(JSON.parse(JSON.stringify(S)));setSync("ok")}catch(e){setSync("err")}
  saving=false; if(again){again=false;push()}
}
function merge(a,b){
  const out=JSON.parse(JSON.stringify(a));
  const newer=(x,y)=>!x?y:!y?x:((y.t||0)>(x.t||0)?y:x);
  Object.keys(b.cards||{}).forEach(k=>out.cards[k]=newer(out.cards[k],b.cards[k]));
  Object.keys(b.q||{}).forEach(k=>out.q[k]=newer(out.q[k],b.q[k]));
  out.sk=out.sk||{};Object.keys(b.sk||{}).forEach(k=>out.sk[k]=newer(out.sk[k],b.sk[k]));
  Object.entries(b.days||{}).forEach(([d,x])=>{const y=out.days[d]||{};const z=Object.assign({},y);
    Object.keys(x).forEach(f=>z[f]=Math.max(x[f]||0,y[f]||0));out.days[d]=z});
  if((b.updated||0)>(a.updated||0)){out.dir=b.dir||out.dir;out.theme=b.theme||out.theme}
  out.updated=Math.max(a.updated||0,b.updated||0);out.v=3;
  return out;
}
async function pull(){
  if(!db)return;
  try{
    const snap=await ref().get();
    const remote=snap.exists?migrate(JSON.parse(JSON.stringify(snap.data()))):null;
    const before=JSON.stringify(S);
    if(remote) S=merge(S,remote);
    saveLocal();
    if(!remote||JSON.stringify(S)!==JSON.stringify(remote)) await push(); else setSync("ok");
    if(JSON.stringify(S)!==before) softRefresh();
  }catch(e){setSync("err")}
}
async function initSync(){
  if(!window.claude||!window.claude.use){setSync("local");return}
  setSync("wait");
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=u?await u.id():null;
    if(!d||!id){setSync("local");return}
    db=d;uid=id;await pull();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(pushT);push()}else pull()});
  }catch(e){setSync("local")}
}

/* ================= DATES & STATS ================= */
const DAY=86400000;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const keyOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>keyOf(new Date());
const daysLeft=()=>Math.max(0,Math.round((sod(EXAM)-sod(new Date()))/DAY));
const dayIndex=()=>Math.round((sod(new Date())-sod(START))/DAY);
const tomorrow=()=>sod(new Date()).getTime()+DAY;
function today(){return S.days[todayKey()]||{}}
function logDay(k,ok,tot){const d=S.days[todayKey()]=S.days[todayKey()]||{};d[k]=(d[k]||0)+tot;d[k+"Ok"]=(d[k+"Ok"]||0)+ok}
const dayTotal=x=>["v"].concat(ALLP).reduce((s,k)=>s+(x[k]||0),0);
const dayOk=x=>["v"].concat(ALLP).reduce((s,k)=>s+(x[k+"Ok"]||0),0);
function streak(){
  const has=d=>{const x=S.days[keyOf(d)];return x&&dayTotal(x)>0};
  let d=sod(new Date()),n=0; if(!has(d)) d=new Date(d.getTime()-DAY);
  while(has(d)){n++;d=new Date(d.getTime()-DAY)} return n;
}
function lastDays(n,parts){let ok=0,t=0;for(let j=0;j<n;j++){const x=S.days[keyOf(new Date(sod(new Date()).getTime()-j*DAY))]||{};parts.forEach(p=>{t+=x[p]||0;ok+=x[p+"Ok"]||0})}return {ok,t}}
function estimate(parts){const {ok,t}=lastDays(7,parts);if(t<20)return {need:20-t};return {v:Math.max(5,Math.min(495,Math.round(ok/t*495/5)*5)),pct:Math.round(ok/t*100)}}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCD";
const pk=key=>key.split(":")[0], ix=key=>+key.split(":")[1];
const itemOf=key=>PARTS[pk(key)].bank[ix(key)];
function tipOf(part,i,item){
  if(item.t) return item.t;
  if(part==="p5"){const a=CAT_TIPS[item.c]||CAT_TIPS["Nature des mots"];return a[i%a.length]}
  if(part==="pn") return NAT_TIPS[item.ty];
  if(part==="p2") return P2_TIPS[i%P2_TIPS.length];
  return "";
}
function errorsOf(parts,dueOnly){const now=Date.now();const out=[];
  parts.forEach(p=>PARTS[p].bank.forEach((_,i)=>{const r=S.q[p+":"+i];if(r&&r.need>0&&(!dueOnly||r.due<=now))out.push(p+":"+i)}));return out}
function hardWords(){return VOCAB.map((_,i)=>i).filter(i=>{const c=S.cards[i];return c&&c.lap>0&&c.box<2})}
function dueWords(){const now=Date.now();return VOCAB.map((_,i)=>i).filter(i=>{const c=S.cards[i];return c&&c.box<5&&c.due<=now})}
function partStats(p){let ok=0,t=0,seen=0;PARTS[p].bank.forEach((_,i)=>{const r=S.q[p+":"+i];if(r){seen++;ok+=r.ok;t+=r.ok+r.ko}});return {acc:t?Math.round(ok/t*100):null,seen,total:PARTS[p].bank.length}}

/* ================= AUDIO ================= */
let vW=null,vM=null;
const canSpeak=()=>{try{return "speechSynthesis" in window}catch(e){return false}};
function pickVoices(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang));
  const us=vs.filter(v=>/US/i.test(v.lang));const pool=us.length?us:vs;
  vW=pool.find(v=>/Samantha|Aria|Jenny|Zira|Female|Victoria|Karen|Ava|Allison|Susan/i.test(v.name))||pool[0]||null;
  vM=pool.find(v=>/Daniel|Guy|David|Alex|Male|Fred|Tom|Aaron|Mark/i.test(v.name)&&v!==vW)||vs.find(v=>v!==vW)||vW;}catch(e){}}
try{pickVoices();speechSynthesis.onvoiceschanged=pickVoices}catch(e){}
function speak(text,spk,onend){if(!canSpeak()){onend&&onend();return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.93;const v=spk==="W"?vW:vM;if(v)u.voice=v;
    if(vW===vM||!v)u.pitch=spk==="W"?1.25:.85;if(onend)u.onend=onend;speechSynthesis.speak(u)}catch(e){onend&&onend()}}
/* Vrais enregistrements (voix naturelles, accents US, UK, AU, CA) ; la voix du navigateur ne sert qu'en secours */
const audioEls={};let playTok=0,playIv=null;
function getAudio(f){if(!audioEls[f]){const a=new Audio(f);a.preload="auto";audioEls[f]=a}return audioEls[f]}
function stopAudio(){playTok++;clearInterval(playIv);Object.values(audioEls).forEach(a=>{try{a.pause()}catch(e){}});try{speechSynthesis.cancel()}catch(e){}}
function speakSeq(parts){stopAudio();let i=0;const next=()=>{if(i<parts.length){const p=parts[i++];speak(p[1],p[0],()=>setTimeout(next,420))}};next()}
function playSegs(key,idxs,fallback,onState){
  stopAudio();const m=typeof AUDIO!=="undefined"&&AUDIO[key];
  if(!m){fallback&&fallback();return}
  const a=getAudio(m.f),tok=playTok;let k=0;
  const done=()=>{if(tok===playTok&&onState)onState(false)};
  const fail=()=>{if(tok!==playTok)return;clearInterval(playIv);fallback&&fallback()};
  a.onerror=fail;onState&&onState(true);
  const next=()=>{
    if(tok!==playTok)return; if(k>=idxs.length){done();return}
    const s=m.s[idxs[k++]];
    try{a.currentTime=Math.max(0,s[0]-.02)}catch(e){}
    const p=a.play();
    const watch=()=>{clearInterval(playIv);playIv=setInterval(()=>{if(tok!==playTok){clearInterval(playIv);return}
      if(a.currentTime>=s[1]+.05||a.ended){clearInterval(playIv);a.pause();setTimeout(next,380)}},40)};
    if(p&&p.then)p.then(watch).catch(fail);else watch();
  };
  next();
}

/* ================= VOCAB ================= */
const INTERVALS=[0,1,2,4,7,14];
let vq=null;
function buildVocab(theme){
  const now=Date.now();let pool=VOCAB.map((_,i)=>i);
  if(theme==="Mots ratés") return {theme,list:shuffle(hardWords()).slice(0,20),i:0,shown:false,ok:0,ko:0,missed:[]};
  if(theme!=="Tous") pool=pool.filter(i=>VOCAB[i][3]===theme);
  const due=shuffle(pool.filter(i=>{const c=S.cards[i];return c&&c.box<5&&c.due<=now}));
  const fresh=pool.filter(i=>!S.cards[i]);
  let list=due.slice(0,25);
  if(list.length<20) list=list.concat(fresh.slice(0,20-list.length));
  return {theme,list,i:0,shown:false,ok:0,ko:0,missed:[]};
}
/* QCM : 3 traductions pièges (faux amis, sens proches) + la bonne */
function vocabChoices(i){
  const v=VOCAB[i],en=S.dir==="en";
  const good=en?v[1]:v[0];let wrong=[];
  if(en&&TRAPS[v[0]]) wrong=shuffle(TRAPS[v[0]]).slice(0,3);
  const same=shuffle(VOCAB.filter((x,k)=>k!==i&&x[3]===v[3]).map(x=>en?x[1]:x[0]));
  const any=shuffle(VOCAB.filter((x,k)=>k!==i).map(x=>en?x[1]:x[0]));
  for(const c of same.concat(any)){if(wrong.length>=3)break;if(c!==good&&!wrong.includes(c))wrong.push(c)}
  const opts=shuffle([good].concat(wrong.slice(0,3)));
  return {opts,good,traps:en&&TRAPS[v[0]]?TRAPS[v[0]]:[]};
}

/* ================= MOTEUR DE QUIZ ================= */
let quiz=null;
/* Longueur des textes : Part 6 court / long, Part 7 court / long / multiple (double, triple) */
const nWords=s=>s.split(/\s+/).filter(Boolean).length;
function lenCat(p,it){
  if(p==="p6") return nWords(it.text)>=75?"Long":"Court";
  if(p==="p7") return it.docs.length>1?"Multiple":nWords(it.docs[0].b)>=100?"Long":"Court";
  return "";
}
function lenTag(p,it){const c=lenCat(p,it);if(!c)return "";
  const lbl=c==="Multiple"?(it.docs.length===3?"Triple document":"Double document"):c==="Long"?"Texte long":"Texte court";
  return `<span class="tag">${lbl}</span>`}
const LENS={p6:[["all","Mélange court + long"],["Court","Textes courts"],["Long","Textes longs"]],
  p7:[["all","Mélange court + long + multiple"],["Court","Documents courts"],["Long","Documents longs"],["Multiple","Doubles et triples"]]};
function pool(p,opts){
  let idx=PARTS[p].bank.map((_,i)=>i);
  if(p==="p5"&&opts.cat&&opts.cat!=="Toutes") idx=idx.filter(i=>GRAMMAR[i].c===opts.cat);
  if(opts.hard) idx=idx.filter(i=>PARTS[p].bank[i].h);
  if(opts.len&&opts.len!=="all") idx=idx.filter(i=>lenCat(p,PARTS[p].bank[i])===opts.len);
  if(p==="pn"&&opts.ntype&&opts.ntype!=="all") idx=idx.filter(i=>NATURE[i].ty===opts.ntype);
  if(p==="pn"&&opts.traps) idx=idx.filter(i=>NATURE[i].trap);
  return idx;
}
function buildUnits(p,opts){
  const per=PARTS[p].per,idx=pool(p,opts),now=Date.now();
  const due=shuffle(idx.filter(i=>{const r=S.q[p+":"+i];return r&&r.need>0&&r.due<=now})).slice(0,Math.ceil(per/2));
  const rest=idx.filter(i=>!due.includes(i));
  const unseen=shuffle(rest.filter(i=>!S.q[p+":"+i]));
  /* Les questions déjà réussies ne reviennent qu'une fois toute la banque vue, en commençant par les plus anciennes */
  const last=i=>S.q[p+":"+i].t||0;

  const ordered=due.concat(unseen,seen);

    const cats=LENS[p].slice(1).map(x=>x[0]),picks=[];
    for(const i of due){if(picks.length<per)picks.push(i)}

      const want=cats.slice().sort((a,b)=>have(a)-have(b));
      let got;for(const c of want){got=ordered.find(i=>!picks.includes(i)&&lenCat(p,PARTS[p].bank[i])===c);if(got!==undefined)break}
      if(got===undefined)got=ordered.find(i=>!picks.includes(i));
      if(got===undefined)break;picks.push(got);
    }
    return shuffle(picks).map(i=>p+":"+i);
  }

/* ================= COACH PART 5 ================= */
/* Chaque question de Part 5 appartient à une règle (SKILLS). Le niveau d'aide dépend de ta série de réussites sur cette règle :
   0-1 réussite d'affilée → Guidé (3 indices affichés) · 2-3 → Aidé (indices sur demande) · 4+ → Automatisme (sans indice, 20 s). */
function guessSkill(it){
  const r=(it.r||"")+" ",c=it.c;
  if(c==="Nature des mots"){
    if(/qui provoque|qui ressent/.test(r)) return "n-part";
    const good=(it.o[it.a]||"").toLowerCase();
    if(/ly$/.test(good)&&!/^(only|supply|apply|reply|rely)$/.test(good)) return "n-adv";
    const m=r.match(/→\s*(adverbe|adjectif|nom|verbe|base)/i);
    const w=m?m[1].toLowerCase():/adjectif/i.test(r)?"adjectif":/\bnom\b/i.test(r)?"nom":/base|verbe/i.test(r)?"verbe":
      /(tion|ment|ity|ance|ence|ness|ors?|ers?|ees?|ure|ship|ism)$/.test(good)?"nom":"adjectif";
    return w==="adverbe"?"n-adv":w==="adjectif"?"n-adj":w==="nom"?"n-nom":"n-verb";
  }
  if(c==="Prépositions") return /heure|date|mois|jour|durée|départ|échéance|plus tard|jusqu|délai|as of|until|since|during|within|throughout|year|next|from … to/i.test(r+it.s)&&!/responsible|famous|written|specialize|charge|agree|insist|apply|move|regardless|compensation|increase|behalf|accordance|except|remotely/i.test(it.s)?"pr-temps":"pr-lieu";
  if(c==="Connecteurs") return /\+ nom|\+ phrase|\+ sujet/.test(r)?"cx-nom-phrase":"cx-sens";
  if(c==="Temps & voix"){
    if(/inversion|en tête|Had |Should|Hardly|No sooner/i.test(r)) return "inv";
    if(/subjonctif|that \+|\bif\b|would|unless|essential|important|stipulate|insist|request/i.test(r)) return "v-cond";
    if(/passif/i.test(r)) return "v-passif";
    if(/present perfect|prétérit|futur|plus-que-parfait|was \/ were|have been|has been|since|by the time/i.test(r)) return "v-temps";
    if(/-ing|\bto \+|to \+ base|required to|asked to|hesitate|look forward|yet to|expected to/i.test(r)) return "v-ing-to";
    return "v-temps";
  }
  if(c==="Pronoms") return /\bwho|which|whose|whom|what\b|that|ce qui/i.test(r)?"pro-rel":"pro-pers";
  if(c==="Comparaison") return "comp";
  if(c==="Quantité") return "quant";
  if(c==="Accords") return "v-accord";
  return "voc";
}
const SK_FIX=[["___ completed the training","inv"],["The items ___ in the catalog","n-part"],["Please ___ the printer off","n-verb"],["All packages must be ___","v-passif"],["So successful ___","inv"],["Only employees ___ in the security","n-part"],["Any employee ___ to work","n-part"],["The software update is ___","v-passif"],["Due to the high volume","n-part"],["The museum's new wing","n-part"],["Employees who wish to work remotely","pr-lieu"]];
function skillOf(it){if(!it._sk){const f=SK_FIX.find(x=>it.s&&it.s.startsWith(x[0]));it._sk=it.sk||(f?f[1]:guessSkill(it))}return it._sk}
function skStat(id){return (S.sk&&S.sk[id])||{ok:0,ko:0,st:0}}
function skLevel(id){const s=skStat(id).st;return s>=4?"auto":s>=2?"aide":"guide"}
const LVL={guide:["Guidé","3 indices affichés"],aide:["Aidé","indices sur demande"],auto:["Automatisme","sans indice · 20 s"]};
function lvlChip(l){return `<span class="lvl lvl-${l}">${LVL[l][0]}</span>`}
function dots(n){return `<span class="dots" aria-label="${Math.min(n,4)} sur 4">${[0,1,2,3].map(i=>`<i class="${i<n?"on":""}"></i>`).join("")}</span>`}
function updateSkill(id,ok){
  S.sk=S.sk||{};const s=Object.assign({ok:0,ko:0,st:0},S.sk[id]);const before=skLevel(id);
  if(ok){s.ok++;s.st++}else{s.ko++;s.st=0}
  s.t=Date.now();S.sk[id]=s;return {before,after:skLevel(id)};
}

function markGap(sent){
  const p=sent.split("___"),L0=esc(p[0]),R0=esc(p[1]||"");
  const lm=L0.match(/^([\s\S]*?)((?:\S+\s+){0,1}\S+\s*)$/),rm=R0.match(/^(\s*\S+(?:\s+\S+)?)([\s\S]*)$/);

}

function coachUnits(skillId){
  const n=15,now=Date.now(),key=i=>"p5:"+i,rec=i=>S.q[key(i)];
  let idx=GRAMMAR.map((_,i)=>i);if(skillId) idx=idx.filter(i=>skillOf(GRAMMAR[i])===skillId);
  const due=shuffle(idx.filter(i=>{const r=rec(i);return r&&r.need>0&&r.due<=now}));
  const unseen=shuffle(idx.filter(i=>!rec(i)));
  /* les questions déjà réussies plusieurs fois passent en dernier */
  const seen=idx.filter(i=>rec(i)&&!due.includes(i)).sort((a,b)=>((rec(a).ok-rec(a).ko)-(rec(b).ok-rec(b).ko))||((rec(a).t||0)-(rec(b).t||0)));
  const order=unseen.concat(seen);
  let picks=due.slice(0,skillId?6:5);
  if(skillId){for(const i of order){if(picks.length>=n)break;if(!picks.includes(i))picks.push(i)}return shuffle(picks).map(key)}
  /* programme intelligent : les 6 règles les plus faibles, à tour de rôle */
  const acc=id=>{const s=skStat(id);return s.ok/((s.ok+s.ko)||1)};
  const weak=SKILLS.map(s=>s.id).sort((a,b)=>(skStat(a).st-skStat(b).st)||(acc(a)-acc(b))).slice(0,6);
  let guard=0;
  while(picks.length<n&&guard<200){guard++;
    const id=weak[guard%weak.length];const i=order.find(x=>!picks.includes(x)&&skillOf(GRAMMAR[x])===id);
    if(i!==undefined)picks.push(i);else{const j=order.find(x=>!picks.includes(x));if(j===undefined)break;if(guard>weak.length*3)picks.push(j)}}
  return shuffle(picks).map(key);
}

const NAT_TIPS={A:"Ne traduis pas le mot : regarde le mot juste AVANT et juste APRÈS. C'est sa place qui donne sa nature.",

  C:"Seul, un mot se reconnaît à son suffixe. Mais méfie-toi : -ly, -al, -ive, -ant, -ent ont des exceptions."};
function natPrompt(it){return it.ty==="A"?"Quelle est la nature du mot surligné ?":it.ty==="B"?"Quel type de mot faut-il dans le trou ?":"Quelle est la nature de ce mot ?"}
function natSentence(it,answered){
  if(it.ty==="A") return esc(it.s).replace(/\{(.+?)\}/,(m,w)=>`<mark class="nb"><b>${w}</b></mark>`);
  if(it.ty==="B"){const p=it.s.split("___");return answered?`${esc(p[0])}<span class="fill">${esc(it.fill)}</span>${esc(p[1]||"")}`:`${esc(p[0])}<span class="gap"></span>${esc(p[1]||"")}`}
  return `<span class="natword">${esc(it.s)}</span>`;
}
