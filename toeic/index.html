<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141d38">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
<title>TOEIC J-19</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one answer-sheet column; (A)(B)(C)(D) bubbles are the motif; navy "exam booklet" hero; tabs at the thumb on phone, on top on desktop */
:root{
  --paper:#f3f5fa;
  --sheet:#ffffff;
  --ink:#141d38;
  --ink-soft:#5a6480;
  --line:#dbe0ec;
  --blue:#2346c8;
  --blue-wash:#e7ecfc;
  --hero:#141d38;
  --hero-fg:#f3f5fa;
  --hero-soft:#a9b4d6;
  --marker:#ffd84d;
  --marker-ink:#3b2f00;
  --good:#15804d;
  --good-wash:#e2f4ea;
  --bad:#c23a2b;
  --bad-wash:#fbe8e5;
  --shadow:0 1px 2px rgba(20,29,56,.05),0 8px 28px rgba(20,29,56,.07);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0c1122;--sheet:#151c33;--ink:#e9edf8;--ink-soft:#9ba6c3;--line:#29324f;
    --blue:#8fa7ff;--blue-wash:#1d2850;--hero:#1b2550;--hero-fg:#f3f5fa;--hero-soft:#aab6dd;
    --marker:#ffd84d;--marker-ink:#2a2100;
    --good:#4fca8c;--good-wash:#11331f;--bad:#ff8475;--bad-wash:#3b1916;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0c1122;--sheet:#151c33;--ink:#e9edf8;--ink-soft:#9ba6c3;--line:#29324f;
  --blue:#8fa7ff;--blue-wash:#1d2850;--hero:#1b2550;--hero-fg:#f3f5fa;--hero-soft:#aab6dd;
  --marker:#ffd84d;--marker-ink:#2a2100;
  --good:#4fca8c;--good-wash:#11331f;--bad:#ff8475;--bad-wash:#3b1916;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.28);color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 104px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.12}
h2{font-size:1.65rem;font-weight:800;letter-spacing:-.015em}
h3{font-size:1.1rem;font-weight:700}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
.muted{color:var(--ink-soft)}
.note{font-size:.86rem;color:var(--ink-soft)}
.hl{background:linear-gradient(transparent 58%,var(--marker) 58%);color:inherit;padding:0 .1em}

header.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:18px 10px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:-.02em;white-space:nowrap}
.brand span{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-soft);white-space:nowrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.chip{font-family:var(--f-mono);font-size:.74rem;background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:4px 10px;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ink-soft)}
.dot.ok{background:var(--good)}.dot.warn{background:var(--marker)}.dot.err{background:var(--bad)}

nav.tabs{display:flex;gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding-block:6px 10px;border-bottom:1px solid var(--line);margin-bottom:22px}
nav.tabs a{position:relative;flex:1;text-align:center;text-decoration:none;color:var(--ink-soft);font-weight:700;font-size:.9rem;padding:8px 4px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs a .ico{font-family:var(--f-mono);font-size:.8rem;width:28px;height:28px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center}
nav.tabs a[aria-current="page"]{color:var(--blue);background:var(--blue-wash)}
nav.tabs a[aria-current="page"] .ico{background:var(--blue);color:var(--sheet);border-color:var(--blue)}
nav.tabs .badge{position:absolute;top:2px;left:calc(50% + 8px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:var(--sheet);font-family:var(--f-mono);font-size:.66rem;display:grid;place-items:center}
@media (max-width:640px){
  nav.tabs{position:fixed;top:auto;bottom:0;left:0;right:0;margin:0;border-bottom:0;border-top:1px solid var(--line);background:var(--sheet);
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs a{font-size:.72rem}
}

.view{display:flex;flex-direction:column;gap:22px}
.card{background:var(--sheet);border:1px solid var(--line);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:700;cursor:pointer;background:var(--blue);color:var(--sheet);font-size:1rem;text-decoration:none;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.good{background:var(--good);color:var(--sheet)}
.btn.bad{background:var(--bad);color:var(--sheet)}
.btn.warn{background:var(--marker);color:var(--marker-ink)}
.btn:disabled{opacity:.45;cursor:default}
.btn.small{padding:8px 12px;font-size:.88rem}
.btn .n{font-family:var(--f-mono);font-size:.8rem;background:rgba(0,0,0,.14);border-radius:6px;padding:1px 6px}
select{font:inherit;padding:9px 10px;border-radius:10px;border:1.5px solid var(--line);background:var(--sheet);color:var(--ink);max-width:100%}

/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:22px;padding:22px;display:grid;grid-template-columns:auto 1fr;gap:22px;align-items:center;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;border:2px solid rgba(255,255,255,.08);box-shadow:0 0 0 26px rgba(255,255,255,.03),0 0 0 52px rgba(255,255,255,.02);pointer-events:none}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(4.2rem,19vw,6.8rem);line-height:.85;letter-spacing:-.045em}
.hero .big small{font-size:.32em;letter-spacing:0;vertical-align:top;margin-right:3px;color:var(--marker)}
.hero .eyebrow{color:var(--hero-soft)}
.hero p{max-width:36ch}
.hero .focus{font-family:var(--f-display);font-weight:700;font-size:1.2rem;line-height:1.25}
@media (max-width:420px){.hero{grid-template-columns:1fr;gap:12px}}

.goals{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.goal{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;text-decoration:none;color:inherit;padding:12px 6px;border-radius:14px;border:1px solid var(--line);background:var(--sheet)}
.goal:hover{border-color:var(--blue)}
.ring{width:64px;height:64px}
.ring circle{fill:none;stroke-width:7}
.ring .bg{stroke:var(--line)}
.ring .fg{stroke:var(--blue);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%}
.ring.done .fg{stroke:var(--good)}
.ring text{font-family:var(--f-mono);font-size:15px;font-weight:700;fill:var(--ink)}
.goal b{font-size:.9rem}
.goal span{font-size:.75rem;color:var(--ink-soft)}

.errbox{border:1.5px solid var(--bad);background:var(--bad-wash);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px}
.errbox.clear{border-color:var(--good);background:var(--good-wash)}

.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:150px;padding-top:18px}
.col{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;min-width:0}
.col .bar{width:100%;max-width:38px;border-radius:7px 7px 3px 3px;background:var(--blue);min-height:3px}
.col .bar.empty{background:var(--line)}
.col .bar.today{background:var(--marker)}
.col .v{font-family:var(--f-mono);font-size:.72rem;font-weight:700}
.col .d{font-family:var(--f-mono);font-size:.68rem;color:var(--ink-soft)}
.trend{display:flex;gap:16px;flex-wrap:wrap}
.trend div{display:flex;flex-direction:column}
.trend b{font-family:var(--f-mono);font-size:1.4rem}

.plan{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.day{border:1px solid var(--line);border-radius:12px;padding:9px 11px;font-size:.86rem;display:flex;flex-direction:column;gap:2px;background:var(--sheet)}
.day .d{font-family:var(--f-mono);font-size:.7rem;color:var(--ink-soft)}
.day.past{opacity:.55}
.day.now{border-color:var(--blue);box-shadow:inset 0 0 0 1px var(--blue);background:var(--blue-wash)}
.day.exam{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.day.exam .d{color:var(--marker-ink)}

/* flashcards */
.flash{min-height:270px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;cursor:pointer;user-select:none;position:relative}
.flash .word{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.9rem);letter-spacing:-.02em;overflow-wrap:anywhere;line-height:1.05}
.flash .tr{font-size:1.35rem;font-weight:700;color:var(--blue)}
.flash .ex{font-style:italic;color:var(--ink-soft);max-width:44ch}
.flash.shown{border-color:var(--blue)}
.tag{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--ink-soft)}
.tag.red{border-color:var(--bad);color:var(--bad)}
.boxes{display:flex;gap:6px;flex-wrap:wrap}
.boxes .bx{flex:1;min-width:52px;text-align:center;border:1px solid var(--line);border-radius:10px;padding:6px 4px;font-size:.74rem;background:var(--sheet)}
.boxes .bx b{display:block;font-family:var(--f-mono);font-size:1.1rem}
.seg{display:inline-flex;border:1.5px solid var(--line);border-radius:12px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 12px;border-radius:9px;font-weight:700;font-size:.85rem;cursor:pointer;color:var(--ink-soft)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--sheet)}

/* quiz */
.q{font-size:1.22rem;line-height:1.55}
.q .gap{display:inline-block;min-width:4.5em;border-bottom:2px solid var(--ink);margin:0 .15em}
.q .fill{font-weight:700;color:var(--good);border-bottom:2px solid var(--good);padding:0 .15em}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 12px;border:1.5px solid var(--line);border-radius:13px;background:var(--sheet);cursor:pointer;font-size:1.03rem}
.bub{flex:none;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--ink-soft);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:.85rem;color:var(--ink-soft)}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--good);background:var(--good-wash)}
.opt.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.opt.ko{border-color:var(--bad);background:var(--bad-wash)}
.opt.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.opt.dim{opacity:.6}
.progress{display:flex;gap:4px}
.progress i{flex:1;height:7px;border-radius:4px;background:var(--line)}
.progress i.ok{background:var(--good)}.progress i.ko{background:var(--bad)}.progress i.cur{background:var(--blue)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:1.1rem}
.timer.low{color:var(--bad)}
.retry{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;background:var(--marker);color:var(--marker-ink);border-radius:6px;padding:2px 7px}

.verdict{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:14px;font-weight:700;font-size:1.05rem}
.verdict.ok{background:var(--good-wash);color:var(--good)}
.verdict.ko{background:var(--bad-wash);color:var(--bad)}
.verdict .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--sheet);flex:none;font-family:var(--f-mono)}
.verdict.ok .ic{background:var(--good)}.verdict.ko .ic{background:var(--bad)}
.explain{display:flex;flex-direction:column;gap:12px}
.ex-row{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:baseline}
.ex-row > span:first-child{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft);padding-top:2px}
.ex-row > div{min-width:0}
.rule{border-left:4px solid var(--marker);padding:8px 12px;background:var(--paper);border-radius:0 10px 10px 0;font-weight:700}
.whys{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.whys li{display:flex;gap:10px;align-items:flex-start;font-size:.95rem}
.whys .bub{width:24px;height:24px;font-size:.72rem}
.whys li.ok .bub{background:var(--good);border-color:var(--good);color:var(--sheet)}
.whys li.ko .bub{background:var(--bad);border-color:var(--bad);color:var(--sheet)}
.whys li.ok b{color:var(--good)}
@media (max-width:480px){.ex-row{grid-template-columns:1fr;gap:4px}}
.recap{display:flex;flex-direction:column;gap:12px}
.recap > div{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:4px}
.result{font-family:var(--f-display);font-weight:800;font-size:3.4rem;color:var(--blue);line-height:1}

details.fiche{background:var(--sheet);border:1px solid var(--line);border-radius:16px;padding:4px 18px}
details.fiche summary{cursor:pointer;padding:14px 0;font-family:var(--f-display);font-weight:700;font-size:1.1rem;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.fiche summary::-webkit-details-marker{display:none}
details.fiche summary::after{content:"+";font-family:var(--f-mono);color:var(--ink-soft)}
details.fiche[open] summary::after{content:"–"}
.fiche-body{padding-bottom:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fiche-body ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.tbl{overflow-x:auto}
.tbl table{border-collapse:collapse;width:100%;font-size:.92rem}
.tbl th,.tbl td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft)}
@media (prefers-reduced-motion:no-preference){
  .opt,.goal,.btn{transition:background .15s,border-color .15s,transform .1s}
  .btn:active{transform:scale(.98)}
  .pop{animation:pop .25s ease-out}
  @keyframes pop{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
  .ring .fg{transition:stroke-dashoffset .5s}
}
</style>
</head>

<div class="wrap">
  <header class="top">
    <div class="brand"><b>TOEIC <span id="hdrDays" class="mono" style="font-size:inherit;color:inherit">J-19</span></b><span>L&amp;R · 10–990</span></div>

</div>

/* ================= ÉTAT & SAUVEGARDE ================= */
const KEY="toeic-j19-v2";
const blank=()=>({v:2,updated:0,cards:{},q:{},days:{},dir:"en",theme:"Tous"});
let S=blank();
try{
  const raw=localStorage.getItem(KEY);
  if(raw) S=Object.assign(blank(),JSON.parse(raw));
  else{ // reprise de la version 1
    const old=localStorage.getItem("toeic-j19-v1");
    if(old){const o=JSON.parse(old);
      Object.entries(o.cards||{}).forEach(([i,c])=>S.cards[i]={box:c.box,due:c.due,t:Date.now(),lap:0});
      Object.entries(o.gram||{}).forEach(([i,r])=>S.q["g"+i]={ok:r.ok,ko:r.ko,need:r.ko>r.ok?2:0,due:0,t:Date.now()});
      Object.entries(o.listen||{}).forEach(([i,r])=>S.q["l"+i]={ok:r.ok,ko:r.ko,need:r.ko>r.ok?2:0,due:0,t:Date.now()});
      Object.entries(o.days||{}).forEach(([d,x])=>S.days[d]={v:x.v||0,vOk:0,g:x.g||0,gOk:0,l:x.l||0,lOk:0});
      S.updated=Date.now();}
  }
}catch(e){}
function saveLocal(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

let db=null,uid=null,saving=false,again=false,pushT=null,syncState="local";
function setSync(st){syncState=st;const el=document.getElementById("sync");if(!el)return;
  const m={ok:["ok","Sauvegardé"],saving:["warn","Sauvegarde…"],local:["","Sur cet appareil"],err:["err","Hors ligne"],wait:["warn","Connexion…"]}[st];
  el.innerHTML=`<i class="dot ${m[0]}"></i>${m[1]}`;
  el.title=st==="ok"?"Ta progression est enregistrée sur ton compte : tu la retrouves sur ton téléphone et ton ordinateur.":st==="local"?"Ta progression est enregistrée dans ce navigateur.":"";
}
function ref(){return db.doc("data/users/"+uid+"/toeic")}
function save(){S.updated=Date.now();saveLocal();if(db){setSync("saving");clearTimeout(pushT);pushT=setTimeout(push,1200)}}
async function push(){
  if(!db)return; if(saving){again=true;return}
  saving=true;
  try{await ref().set(JSON.parse(JSON.stringify(S)));setSync("ok")}
  catch(e){setSync("err")}
  saving=false; if(again){again=false;push()}
}
function merge(a,b){
  const out=JSON.parse(JSON.stringify(a));
  const newer=(x,y)=>!x?y:!y?x:((y.t||0)>(x.t||0)?y:x);
  Object.keys(b.cards||{}).forEach(k=>out.cards[k]=newer(out.cards[k],b.cards[k]));
  Object.keys(b.q||{}).forEach(k=>out.q[k]=newer(out.q[k],b.q[k]));
  Object.entries(b.days||{}).forEach(([d,x])=>{const y=out.days[d]||{};const z={};
    ["v","vOk","g","gOk","l","lOk"].forEach(f=>z[f]=Math.max(x[f]||0,y[f]||0));out.days[d]=z});
  if((b.updated||0)>(a.updated||0)){out.dir=b.dir||out.dir;out.theme=b.theme||out.theme}
  out.updated=Math.max(a.updated||0,b.updated||0);
  return out;
}
async function pull(){
  if(!db)return;
  try{
    const snap=await ref().get();
    const remote=snap.exists?JSON.parse(JSON.stringify(snap.data())):null;
    const before=JSON.stringify(S);
    if(remote) S=merge(S,remote);
    saveLocal();
    const remoteStr=remote?JSON.stringify(remote):"";
    if(JSON.stringify(S)!==remoteStr) await push(); else setSync("ok");
    if(JSON.stringify(S)!==before) softRefresh();
  }catch(e){setSync("err")}
}
async function initSync(){
  if(!window.claude||!window.claude.use){setSync("local");return}
  setSync("wait");
  try{
    const [d,u]=await Promise.all([window.claude.use("db"),window.claude.use("user")]);
    const id=u?await u.id():null;
    if(!d||!id){setSync("local");return}
    db=d;uid=id;await pull();
    document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"){clearTimeout(pushT);push()}else pull()});
  }catch(e){setSync("local")}
}

/* ================= DATES ================= */
const DAY=86400000;
const sod=d=>{const x=new Date(d);x.setHours(0,0,0,0);return x};
const keyOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const todayKey=()=>keyOf(new Date());
const daysLeft=()=>Math.max(0,Math.round((sod(EXAM)-sod(new Date()))/DAY));
const dayIndex=()=>Math.round((sod(new Date())-sod(START))/DAY);
const tomorrow=()=>sod(new Date()).getTime()+DAY;
function logDay(kind,ok){const k=todayKey();const d=S.days[k]=S.days[k]||{v:0,vOk:0,g:0,gOk:0,l:0,lOk:0};d[kind]++;if(ok)d[kind+"Ok"]++}
function streak(){
  const has=d=>{const x=S.days[keyOf(d)];return x&&(x.v+x.g+x.l)>0};
  let d=sod(new Date()),n=0; if(!has(d)) d=new Date(d.getTime()-DAY);
  while(has(d)){n++;d=new Date(d.getTime()-DAY)} return n;
}

/* ================= OUTILS ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const L="ABCD";
const bank=k=>k==="g"?GRAMMAR:LISTEN;
function errorsOf(k,dueOnly){const now=Date.now();return bank(k).map((_,i)=>i).filter(i=>{const r=S.q[k+i];return r&&r.need>0&&(!dueOnly||r.due<=now)})}
function hardWords(){return VOCAB.map((_,i)=>i).filter(i=>{const c=S.cards[i];return c&&c.lap>0&&c.box<2})}
function dueWords(){const now=Date.now();return VOCAB.map((_,i)=>i).filter(i=>{const c=S.cards[i];return c&&c.box<5&&c.due<=now})}
function accuracy(k){let ok=0,t=0;Object.entries(S.q).forEach(([key,r])=>{if(key[0]===k){ok+=r.ok;t+=r.ok+r.ko}});return t?Math.round(ok/t*100):null}

function renderHeader(){
  const d=daysLeft();$("#hdrDays").textContent=d>0?"J-"+d:"Jour J";
  const s=streak();$("#streak").textContent=s+(s>1?" jours":" jour")+" d'affilée";
  const set=(id,n)=>{const el=$(id);el.hidden=!n;el.textContent=n};
  set("#bg",errorsOf("g",true).length);set("#bl",errorsOf("l",true).length);set("#bv",dueWords().length);
}

try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function speak(text,onend){if(!canSpeak()){onend&&onend();return}
  try{const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=.92;if(voice)u.voice=voice;if(onend)u.onend=onend;speechSynthesis.speak(u)}catch(e){onend&&onend()}}
function speakSeq(parts){try{speechSynthesis.cancel()}catch(e){} let i=0;const next=()=>{if(i<parts.length){speak(parts[i++],()=>setTimeout(next,450))}};next()}

/* ================= VOCAB ================= */
const INTERVALS=[0,1,2,4,7,14];
let vq=null;
function buildVocab(theme){
  const now=Date.now();let pool=VOCAB.map((_,i)=>i);
  if(theme==="Mots ratés") pool=hardWords();
  else if(theme!=="Tous") pool=pool.filter(i=>VOCAB[i][3]===theme);
  const due=shuffle(pool.filter(i=>{const c=S.cards[i];return c&&c.box<5&&c.due<=now}));
  const fresh=pool.filter(i=>!S.cards[i]);
  let list=due.slice(0,25);
  if(list.length<20) list=list.concat(fresh.slice(0,20-list.length));
  if(theme==="Mots ratés") list=shuffle(pool).slice(0,20);
  return {theme,list,i:0,shown:false,ok:0,ko:0,missed:[]};
}
function vocabView(){
  const themes=["Tous","Mots ratés",...Array.from(new Set(VOCAB.map(v=>v[3])))];
  const theme=themes.includes(S.theme)?S.theme:"Tous";
  if(!vq||vq.theme!==theme) vq=buildVocab(theme);
  const counts=[0,0,0,0,0,0];let seen=0;
  VOCAB.forEach((v,i)=>{const c=S.cards[i];if(c){counts[c.box]++;seen++}});
  const cur=vq.list[vq.i];
  let h=`<div class="row between"><div><p class="eyebrow">Vocabulaire · répétition espacée</p><h2>${VOCAB.length} mots du TOEIC</h2></div>
  <div class="seg" role="group" aria-label="Sens"><button id="dirEn" aria-pressed="${S.dir==="en"}">EN → FR</button><button id="dirFr" aria-pressed="${S.dir==="fr"}">FR → EN</button></div></div>
  <div class="row"><label for="theme" class="muted">Thème</label><select id="theme">${themes.map(t=>`<option ${t===theme?"selected":""}>${esc(t)}${t==="Mots ratés"?" ("+hardWords().length+")":""}</option>`).join("")}</select>
  <span class="note">${dueWords().length} à revoir aujourd'hui · ${VOCAB.length-seen} jamais vus</span></div>`;
  if(cur===undefined){
    h+=`<div class="card stack pop" style="align-items:flex-start"><p class="eyebrow">Série terminée</p>
      <div class="result mono">${vq.ok} <span style="font-size:.45em;color:var(--ink-soft)">sus</span> · ${vq.ko} <span style="font-size:.45em;color:var(--ink-soft)">à revoir</span></div>
      ${vq.missed.length?`<p>Les mots à retenir de cette série :</p><div class="recap">${[...new Set(vq.missed)].map(i=>`<div><b>${esc(VOCAB[i][0])}</b><span>${esc(VOCAB[i][1])}</span><span class="note"><i>${esc(VOCAB[i][2])}</i></span></div>`).join("")}</div>`:`<p>Aucune erreur. Ces mots reviendront dans quelques jours pour bien les ancrer.</p>`}
      <button class="btn" id="vRestart">Nouvelle série</button></div>`;
  } else {
    const v=VOCAB[cur];const front=S.dir==="en"?v[0]:v[1];const back=S.dir==="en"?v[1]:v[0];const c=S.cards[cur];
    h+=`<div class="progress" aria-hidden="true">${vq.list.map((_,k)=>`<i class="${k<vq.i?"ok":k===vq.i?"cur":""}"></i>`).join("")}</div>
    <div class="card flash ${vq.shown?"shown":""}" id="flash" tabindex="0" role="button" aria-label="Retourner la carte">
      <div class="row" style="justify-content:center"><span class="tag">${esc(v[3])}</span>${!c?`<span class="tag">nouveau</span>`:c.lap>0&&c.box<2?`<span class="tag red">déjà raté ${c.lap}×</span>`:`<span class="tag">boîte ${c.box}</span>`}</div>
      <div class="word">${esc(front)}</div>
      ${vq.shown?`<div class="tr pop">${esc(back)}</div><p class="ex">${esc(v[2])}</p>`:`<p class="muted">Dis la réponse dans ta tête, puis touche la carte.</p>`}
    </div>
    <div class="row" style="justify-content:center">
      ${vq.shown?`<button class="btn bad" id="vKo">Je ne savais pas</button><button class="btn good" id="vOk">Je savais</button>`:`<button class="btn" id="vShow">Voir la réponse</button>`}
      <button class="btn ghost small" id="vSay">▶ Prononciation</button>
    </div>`;
  }
  h+=`<div class="card stack"><p class="eyebrow">Tes boîtes · ${seen}/${VOCAB.length} mots vus</p><div class="boxes">${counts.map((n,b)=>`<div class="bx"><b>${n}</b>${b===5?"acquis":"boîte "+b}</div>`).join("")}</div>
  <p class="note">« Je savais » : le mot monte d'une boîte et revient de plus en plus tard (1, 2, 4, 7 puis 14 jours). « Je ne savais pas » : retour en boîte 0, il revient à la fin de la série et encore demain.</p></div>`;
  $("#main").innerHTML=`<section class="view">${h}</section>`;
  $("#theme").onchange=e=>{S.theme=e.target.value.replace(/ \(\d+\)$/,"");save();vq=null;vocabView()};
  $("#dirEn").onclick=()=>{S.dir="en";save();vocabView()};
  $("#dirFr").onclick=()=>{S.dir="fr";save();vocabView()};
  if(cur===undefined){$("#vRestart").onclick=()=>{vq=null;vocabView()};return}
  const flip=()=>{vq.shown=true;vocabView()};
  $("#flash").onclick=()=>{if(!vq.shown)flip()};
  $("#flash").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();if(!vq.shown)flip()}};
  if($("#vShow"))$("#vShow").onclick=flip;
  $("#vSay").onclick=()=>speak(VOCAB[cur][0].replace(/^to /,""));
  const grade=ok=>{const c=S.cards[cur]||{box:0,due:0,lap:0};
    if(ok){c.box=Math.min(5,c.box+1);vq.ok++}
    else{c.box=0;c.lap=(c.lap||0)+1;vq.ko++;vq.missed.push(cur);if(vq.list.indexOf(cur,vq.i+1)<0)vq.list.push(cur)}
    c.due=sod(new Date()).getTime()+(ok?INTERVALS[c.box]*DAY:DAY);c.t=Date.now();S.cards[cur]=c;
    logDay("v",ok);vq.i++;vq.shown=false;save();renderHeader();vocabView()};
  if($("#vOk")){$("#vOk").onclick=()=>grade(true);$("#vKo").onclick=()=>grade(false)}
}

/* ================= QUIZ (Part 5 & Part 2) ================= */
let quiz=null;
function buildSet(k,mode,cat){
  const B=bank(k);let idx=B.map((_,i)=>i);
  if(cat&&cat!=="Toutes") idx=idx.filter(i=>B[i].c===cat);
  if(mode==="errors"){
    const now=Date.now();
    return errorsOf(k,false).filter(i=>idx.includes(i)).sort((a,b)=>(S.q[k+a].due>now)-(S.q[k+b].due>now)).slice(0,10);
  }
  const errs=shuffle(errorsOf(k,true).filter(i=>idx.includes(i))).slice(0,5);
  const rest=idx.filter(i=>!errs.includes(i));
  const unseen=shuffle(rest.filter(i=>!S.q[k+i]));
  const seen=shuffle(rest.filter(i=>S.q[k+i])).sort((a,b)=>{const r=x=>{const q=S.q[k+x];return q.ok/(q.ok+q.ko||1)};return r(a)-r(b)});
  return shuffle(errs.concat(unseen,seen).slice(0,10));
}
function startQuiz(k,opts){
  opts=opts||{};
  const set=buildSet(k,opts.mode,opts.cat);
  quiz={kind:k,set,base:set.length,i:0,ans:[],retry:new Set(),retried:[],chrono:!!opts.chrono,mode:opts.mode,cat:opts.cat,timer:null,reveal:k==="l"&&!canSpeak(),played:false};
}
function stopTimer(){if(quiz&&quiz.timer){clearInterval(quiz.timer);quiz.timer=null}}

function landing(k){
  const isG=k==="g";const B=bank(k);
  const errs=errorsOf(k,false),errsDue=errorsOf(k,true);
  const acc=accuracy(k);
  let byCat="";
  if(isG){
    const m={};B.forEach((g,i)=>{const r=S.q["g"+i];if(!r)return;m[g.c]=m[g.c]||{ok:0,t:0};m[g.c].ok+=r.ok;m[g.c].t+=r.ok+r.ko});
    byCat=Object.keys(m).length?`<div class="stack">${Object.entries(m).sort((a,b)=>a[1].ok/a[1].t-b[1].ok/b[1].t).map(([c,v])=>{const p=Math.round(v.ok/v.t*100);
      return `<div><div class="row between"><span>${esc(c)}</span><span class="mono">${p} %</span></div><div style="height:7px;border-radius:4px;background:var(--line);overflow:hidden"><i style="display:block;height:100%;width:${p}%;background:${p<60?"var(--bad)":p<80?"var(--marker)":"var(--good)"}"></i></div></div>`}).join("")}</div>`
      :`<p class="muted">Fais une première série pour voir tes points forts et tes points faibles.</p>`;
  }
  const cats=["Toutes",...Array.from(new Set(GRAMMAR.map(g=>g.c)))];
  $("#main").innerHTML=`<section class="view">
    <div><p class="eyebrow">${isG?"Reading · Part 5 · Phrases à compléter":"Listening · Part 2 · Questions-réponses"}</p><h2>${isG?B.length+" questions de grammaire":"Entraîne ton oreille"}</h2></div>
    <div class="errbox ${errs.length?"":"clear"}">
      ${errs.length?`<div class="row between"><b>Ton carnet d'erreurs : ${errs.length} question${errs.length>1?"s":""} à corriger</b>${errsDue.length?`<span class="tag red">${errsDue.length} à refaire aujourd'hui</span>`:""}</div>
      <p class="note">Une erreur est corrigée quand tu la réussis deux fois : une fois pendant la série, puis un autre jour. Jusque-là, elle revient dans tes séries.</p>
      <div><button class="btn bad" id="goErr">Corriger mes erreurs</button></div>`
      :`<b>Aucune erreur en attente</b><p class="note">Chaque question ratée sera ajoutée ici et te sera reposée jusqu'à ce que tu la réussisses.</p>`}
    </div>
    <div class="card stack">
      ${isG?`<p>Séries de 10 questions. Tes erreurs à refaire passent en premier, puis les questions jamais vues. Le jour J, tu as <b>environ 20 secondes</b> par question.</p>
        <div class="row"><label for="cat" class="muted">Catégorie</label><select id="cat">${cats.map(c=>`<option>${esc(c)}</option>`).join("")}</select></div>`
      :`<p>Tu entends une question puis trois réponses (A), (B), (C). Choisis la réponse logique. Au vrai test, <b>rien n'est écrit</b> : essaie d'abord sans afficher le texte.</p>
        ${canSpeak()?`<p class="note">Voix de synthèse de ton appareil. Monte le son et coupe le mode silencieux sur iPhone.</p>`:`<p class="note">Ton navigateur ne lit pas l'audio : le texte sera affiché.</p>`}`}
      <div class="row"><button class="btn" id="go">Commencer une série</button>${isG?`<button class="btn ghost" id="goChrono">Série chrono · 20 s</button>`:""}</div>
    </div>
    <div class="card stack"><p class="eyebrow">${isG?"Réussite par catégorie":"Ta réussite"}${acc!==null?" · "+acc+" % au total":""}</p>
      ${isG?byCat:`<p>Retiens le <span class="hl">premier mot</span> de la question (Where, When, Who, Why, How…) : il élimine souvent deux réponses. Méfie-toi des réponses qui <span class="hl">répètent un mot</span> de la question ou un son proche.</p>`}
    </div></section>`;
  const cat=()=>$("#cat")?$("#cat").value:"Toutes";
  $("#go").onclick=()=>{startQuiz(k,{cat:cat()});renderQuestion()};
  if($("#goChrono"))$("#goChrono").onclick=()=>{startQuiz(k,{cat:cat(),chrono:true});renderQuestion()};
  if($("#goErr"))$("#goErr").onclick=()=>{startQuiz(k,{mode:"errors"});renderQuestion()};
}
function grammarView(){if(quiz&&quiz.kind==="g")renderQuestion();else landing("g")}
function listenView(){if(quiz&&quiz.kind==="l")renderQuestion();else landing("l")}

function explainBlock(item,k,chosen){
  const isG=quiz.kind==="g";const ok=chosen===item.a;
  const filled=isG?(()=>{const p=item.s.split("___");return `${esc(p[0])}<span class="fill">${esc(item.o[item.a])}</span>${esc(p[1]||"")}`})():esc(item.q);
  return `<div class="verdict ${ok?"ok":"ko"} pop"><span class="ic">${ok?"✓":"✗"}</span>${ok?"Bonne réponse !":chosen===-1?"Temps écoulé":"Pas tout à fait"}</div>
  <div class="explain pop">
    ${!ok&&chosen>=0?`<div class="ex-row"><span>Ta réponse</span><div><span class="mono" style="color:var(--bad);font-weight:700">(${L[chosen]})</span> ${esc(item.o[chosen])} : ${esc(item.w[chosen])}</div></div>`:""}
    <div class="ex-row"><span>La bonne</span><div><span class="mono" style="color:var(--good);font-weight:700">(${L[item.a]})</span> <b>${esc(item.o[item.a])}</b></div></div>
    ${isG?`<div class="ex-row"><span>Phrase</span><div class="q" style="font-size:1.02rem">${filled}</div></div>`:`<div class="ex-row"><span>Question</span><div>${filled}</div></div>`}
    <div class="ex-row"><span>Traduction</span><div><i>${esc(item.fr)}</i></div></div>
    <div class="ex-row"><span>L'indice</span><div>${esc(item.k)}</div></div>
    ${isG?`<div class="ex-row"><span>La règle</span><div class="rule">${esc(item.r)}</div></div>`:""}
    <div class="ex-row"><span>Chaque option</span><ul class="whys">${item.o.map((o,j)=>`<li class="${j===item.a?"ok":j===chosen?"ko":""}"><span class="bub">${L[j]}</span><span><b>${esc(o)}</b> : ${esc(item.w[j])}</span></li>`).join("")}</ul></div>
    ${!ok?`<p class="note">${quiz.retry.has(quiz.i)?"Elle reste dans ton carnet d'erreurs et reviendra demain.":"Cette question revient à la fin de la série, puis demain, jusqu'à ce que tu la réussisses."}</p>`:""}
  </div>`;
}
function renderQuestion(){
  const k=quiz.kind,isG=k==="g",B=bank(k);
  if(!quiz.set.length){$("#main").innerHTML=`<section class="view"><div class="card stack"><b>Aucune question pour ce choix.</b><button class="btn ghost" id="back">Retour</button></div></section>`;$("#back").onclick=()=>{quiz=null;route()};return}
  if(quiz.i>=quiz.set.length) return renderResult();
  const qi=quiz.set[quiz.i],item=B[qi],answered=quiz.ans[quiz.i]!==undefined,isRetry=quiz.i>=quiz.base;
  const rec=S.q[k+qi];
  const prog=`<div class="progress" aria-hidden="true">${quiz.set.map((x,j)=>{const a=quiz.ans[j];return `<i class="${a!==undefined?(a===B[x].a?"ok":"ko"):j===quiz.i?"cur":""}"></i>`}).join("")}</div>`;
  let head=`<div class="row between"><p class="eyebrow">Question ${quiz.i+1}/${quiz.set.length}${isG?" · "+esc(item.c):""}</p>
    <div class="row">${isRetry?`<span class="retry">2ᵉ chance</span>`:!answered&&rec&&rec.need>0?`<span class="tag red">déjà ratée</span>`:""}${quiz.chrono&&!answered?`<span class="timer" id="timer">20 s</span>`:""}</div></div>`;
  let body;
  if(isG){const p=item.s.split("___");body=`<p class="q">${esc(p[0])}<span class="gap"></span>${esc(p[1]||"")}</p>`}
  else{const show=quiz.reveal||answered;
    body=`<div class="row"><button class="btn" id="play">▶ Écouter</button>${show?"":`<button class="btn ghost small" id="reveal">Afficher le texte</button>`}</div>
    ${show?`<p class="q">${esc(item.q)}</p>`:`<p class="muted">Écoute la question et les trois réponses, puis choisis.</p>`}`}
  const opts=item.o.map((o,j)=>{let cls="";const ch=quiz.ans[quiz.i];
    if(answered){if(j===item.a)cls="ok";else if(j===ch)cls="ko";else cls="dim"}
    const label=isG||quiz.reveal||answered?esc(o):`<span class="muted">Réponse ${L[j]}</span>`;
    return `<button class="opt ${cls}" data-j="${j}" ${answered?"disabled":""}><span class="bub">${L[j]}</span><span>${label}</span></button>`}).join("");
  $("#main").innerHTML=`<section class="view">${prog}
    <div class="card stack">${head}${body}<div class="opts">${opts}</div>
    ${answered?explainBlock(item,k,quiz.ans[quiz.i])+`<div class="row between"><button class="btn ghost small" id="quit">Arrêter</button><button class="btn" id="next">${quiz.i===quiz.set.length-1?"Voir le bilan":"Question suivante"}</button></div>`
      :`<div><button class="btn ghost small" id="quit">Arrêter la série</button></div>`}
    </div></section>`;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.j));
  $("#quit").onclick=()=>{stopTimer();quiz=null;route()};
  if($("#next")){$("#next").onclick=()=>{quiz.i++;quiz.played=false;renderQuestion();window.scrollTo({top:0})};$("#next").focus({preventScroll:true})}
  if(!isG){
    const play=()=>speakSeq([item.q,...item.o.map((o,j)=>L[j]+". "+o)]);
    $("#play").onclick=play;
    if($("#reveal"))$("#reveal").onclick=()=>{quiz.reveal=true;renderQuestion()};
    if(!answered&&!quiz.played){quiz.played=true;if(canSpeak())setTimeout(play,300)}
  }
  if(isG&&quiz.chrono&&!answered){
    stopTimer();let t=20;
    quiz.timer=setInterval(()=>{t--;const el=$("#timer");if(el){el.textContent=t+" s";el.classList.toggle("low",t<=5)}if(t<=0){stopTimer();answer(-1)}},1000);
  }
}
function answer(j){
  stopTimer();try{speechSynthesis.cancel()}catch(e){}
  const k=quiz.kind,B=bank(k),qi=quiz.set[quiz.i],ok=j===B[qi].a;
  quiz.ans[quiz.i]=j;
  const r=S.q[k+qi]||{ok:0,ko:0,need:0,due:0};
  if(ok){r.ok++;if(r.need>0){r.need--;r.due=r.need>0?tomorrow():0}}
  else{r.ko++;r.need=2;r.due=0;
    if(quiz.i<quiz.base&&!quiz.retried.includes(qi)){quiz.retried.push(qi);quiz.set.push(qi);quiz.retry.add(quiz.set.length-1)}
    if(quiz.i>=quiz.base){r.due=tomorrow()}
  }
  r.t=Date.now();S.q[k+qi]=r;
  logDay(k,ok);save();renderHeader();renderQuestion();
}
function renderResult(){
  const k=quiz.kind,B=bank(k),isG=k==="g";
  const first=quiz.set.slice(0,quiz.base);
  const ok=first.filter((x,j)=>quiz.ans[j]===B[x].a).length;
  const wrong=first.filter((x,j)=>quiz.ans[j]!==B[x].a);
  const fixed=quiz.set.slice(quiz.base).filter((x,j)=>quiz.ans[quiz.base+j]===B[x].a).length;
  const pct=Math.round(ok/quiz.base*100);
  const msg=pct>=90?"Excellent. Tu maîtrises ces questions.":pct>=70?"Bon niveau. Relis bien les règles ci-dessous.":pct>=50?"C'est correct. Les règles ci-dessous sont celles à travailler.":"Pas grave : chaque erreur reviendra jusqu'à ce que tu la réussisses.";
  $("#main").innerHTML=`<section class="view"><div class="card stack pop">
    <p class="eyebrow">${isG?"Part 5":"Part 2"} · bilan de la série</p>
    <div class="row" style="align-items:baseline;gap:16px"><div class="result mono">${ok}/${quiz.base}</div><span class="mono muted">${pct} % du premier coup</span></div>
    <p>${msg}</p>
    ${wrong.length?`<p class="note">2ᵉ chance : ${fixed}/${wrong.length} réussie${fixed>1?"s":""}. Ces questions restent dans ton carnet d'erreurs et reviendront demain.</p>`:""}
    <div class="row"><button class="btn" id="again">Nouvelle série</button>${errorsOf(k,false).length?`<button class="btn bad" id="errs">Corriger mes erreurs <span class="n">${errorsOf(k,false).length}</span></button>`:""}<button class="btn ghost" id="back">Retour</button></div></div>
    ${wrong.length?`<div class="card stack"><p class="eyebrow">À retenir de cette série</p><div class="recap">${wrong.map(x=>{const it=B[x];
      return `<div>${isG?`<span class="q" style="font-size:1rem">${(()=>{const p=it.s.split("___");return esc(p[0])+`<span class="fill">${esc(it.o[it.a])}</span>`+esc(p[1]||"")})()}</span><div class="rule" style="font-weight:400">${esc(it.r)}</div>`
        :`<span><b>${esc(it.q)}</b></span><span>→ <span class="fill">${esc(it.o[it.a])}</span></span><span class="note">${esc(it.k)}</span>`}</div>`}).join("")}</div></div>`:""}
  </section>`;
  const opts={chrono:quiz.chrono,cat:quiz.cat};
  $("#again").onclick=()=>{startQuiz(k,opts);renderQuestion();window.scrollTo({top:0})};
  if($("#errs"))$("#errs").onclick=()=>{startQuiz(k,{mode:"errors"});renderQuestion();window.scrollTo({top:0})};
  $("#back").onclick=()=>{quiz=null;route()};
}

/* ================= ACCUEIL ================= */
function ring(val,max){const r=26,c=2*Math.PI*r,p=Math.min(1,val/max);
  return `<svg class="ring ${p>=1?"done":""}" viewBox="0 0 64 64" aria-hidden="true"><circle class="bg" cx="32" cy="32" r="${r}"/><circle class="fg" cx="32" cy="32" r="${r}" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p)}"/><text x="32" y="37" text-anchor="middle">${p>=1?"✓":val}</text></svg>`}
function homeView(){
  const left=daysLeft(),di=dayIndex();
  const t=S.days[todayKey()]||{v:0,vOk:0,g:0,gOk:0,l:0,lOk:0};
  const plan=PLAN[Math.min(Math.max(di,0),PLAN.length-1)];
  const examStr=EXAM.toLocaleDateString("fr-FR",{weekday:"long",day:"numeric",month:"long"});
  const eg=errorsOf("g",false).length,el=errorsOf("l",false).length,hw=hardWords().length,totalErr=eg+el+hw;
  // 7 derniers jours
  const days=[];for(let j=6;j>=0;j--){const d=new Date(sod(new Date()).getTime()-j*DAY);const x=S.days[keyOf(d)]||{};
    const n=(x.v||0)+(x.g||0)+(x.l||0),okn=(x.vOk||0)+(x.gOk||0)+(x.lOk||0);days.push({d,n,p:n?Math.round(okn/n*100):null,today:j===0})}
  const maxN=Math.max(30,...days.map(d=>d.n));
  const qa=(x)=>{const n=(x.g||0)+(x.l||0);return n?Math.round(((x.gOk||0)+(x.lOk||0))/n*100):null};
  const yest=S.days[keyOf(new Date(sod(new Date()).getTime()-DAY))]||{};
  const tq=qa(t),yq=qa(yest);
  const seen=Object.keys(S.cards).length,mastered=Object.values(S.cards).filter(c=>c.box>=3).length;
  const ga=accuracy("g"),la=accuracy("l");
  const planGrid=PLAN.map((p,k)=>{const d=new Date(START.getTime()+k*DAY);const cls=k<di?"past":k===di?"now":"";
    return `<div class="day ${cls}"><span class="d">${d.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})} · J-${19-k}</span><b>${esc(p[0])}</b></div>`}).join("")+
    `<div class="day exam"><span class="d">${EXAM.toLocaleDateString("fr-FR",{weekday:"short",day:"numeric"})} · J</span><b>Jour du TOEIC</b></div>`;
  $("#main").innerHTML=`<section class="view">
    <div class="hero">
      <div class="big mono"><small>J-</small>${left}</div>
      <div class="stack" style="gap:8px;min-width:0"><p class="eyebrow">Examen le ${esc(examStr)} · aujourd'hui : ${esc(plan[0])}</p>
        <p class="focus">${esc(plan[1])}</p></div>
    </div>
    <div class="stack" style="gap:10px"><p class="eyebrow">Objectif du jour</p>
      <div class="goals">
        <a class="goal" href="#vocab">${ring(t.v,20)}<b>Vocab</b><span>${Math.min(t.v,20)}/20 cartes</span></a>
        <a class="goal" href="#grammaire">${ring(t.g,20)}<b>Part 5</b><span>${Math.min(t.g,20)}/20 questions</span></a>
        <a class="goal" href="#ecoute">${ring(t.l,10)}<b>Part 2</b><span>${Math.min(t.l,10)}/10 questions</span></a>
      </div></div>
    <div class="errbox ${totalErr?"":"clear"}">
      ${totalErr?`<b>Carnet d'erreurs : ${totalErr} point${totalErr>1?"s":""} à corriger</b>
      <p class="note">Commence ta séance par là : c'est ce qui fait monter le score le plus vite.</p>
      <div class="row">${eg?`<a class="btn bad small" href="#grammaire">Part 5 <span class="n">${eg}</span></a>`:""}${el?`<a class="btn bad small" href="#ecoute">Part 2 <span class="n">${el}</span></a>`:""}${hw?`<button class="btn bad small" id="hardBtn">Mots ratés <span class="n">${hw}</span></button>`:""}</div>`
      :`<b>Carnet d'erreurs vide</b><p class="note">Chaque erreur que tu feras sera notée ici et te sera reposée jusqu'à ce que tu la réussisses.</p>`}
    </div>
    <div class="card stack">
      <div class="row between"><p class="eyebrow">Tes 7 derniers jours</p><span class="note">nombre de réponses · % de réussite</span></div>
      <div class="chart" role="img" aria-label="Activité des 7 derniers jours">${days.map(d=>`<div class="col"><span class="v">${d.n?d.n:""}</span><div class="bar ${d.n?"":"empty"} ${d.today&&d.n?"today":""}" style="height:${d.n?Math.max(6,d.n/maxN*100):3}%"></div><span class="d">${d.d.toLocaleDateString("fr-FR",{weekday:"narrow"})}${d.d.getDate()}</span><span class="d" style="color:var(--ink)">${d.p!==null?d.p+"%":"–"}</span></div>`).join("")}</div>
      <div class="trend">
        <div><span class="eyebrow">Quiz aujourd'hui</span><b>${tq!==null?tq+" %":"–"}</b></div>
        <div><span class="eyebrow">Quiz hier</span><b>${yq!==null?yq+" %":"–"}</b></div>
        <div><span class="eyebrow">Part 5 global</span><b>${ga!==null?ga+" %":"–"}</b></div>
        <div><span class="eyebrow">Part 2 global</span><b>${la!==null?la+" %":"–"}</b></div>
        <div><span class="eyebrow">Mots ancrés</span><b>${mastered}<span class="muted" style="font-size:.6em">/${seen}</span></b></div>
      </div>
      ${tq!==null&&yq!==null?`<p class="note">${tq>yq?"Tu progresses par rapport à hier. Continue comme ça.":tq===yq?"Même niveau qu'hier. Insiste sur ton carnet d'erreurs.":"Un peu moins bien qu'hier : normal si tu as travaillé tes erreurs."}</p>`:""}
    </div>
    <div class="stack" style="gap:10px"><p class="eyebrow">Ton plan sur 19 jours</p><div class="plan">${planGrid}</div></div>
    <div class="card stack"><p class="eyebrow">Échelle du score</p>
      <div style="height:10px;border-radius:5px;background:linear-gradient(90deg,var(--line),var(--blue))"></div>
      <div class="row between mono note"><span>10</span><span>405</span><span>605</span><span>785</span><span>945</span><span>990</span></div>
      <p class="note">Listening /495 + Reading /495. Repères usuels : 605 ≈ B1, 785 ≈ B2, 945 ≈ C1. Vérifie le score que demande ton école ou ton employeur.</p></div>
  </section>`;
  if($("#hardBtn"))$("#hardBtn").onclick=()=>{S.theme="Mots ratés";save();vq=null;location.hash="#vocab"};
}

/* ================= FICHES ================= */
function fichesView(){
  const F=[
  ["Structure de l'examen",`<div class="tbl"><table><tr><th>Part</th><th>Contenu</th><th>Questions</th></tr>
   <tr><td>1</td><td>Photographies</td><td class="mono">6</td></tr><tr><td>2</td><td>Questions-réponses</td><td class="mono">25</td></tr>
   <tr><td>3</td><td>Conversations courtes</td><td class="mono">39</td></tr><tr><td>4</td><td>Exposés courts (annonces, messages)</td><td class="mono">30</td></tr>
   <tr><td>5</td><td>Phrases à compléter</td><td class="mono">30</td></tr><tr><td>6</td><td>Textes à compléter</td><td class="mono">16</td></tr>
   <tr><td>7</td><td>Compréhension écrite (1, 2 ou 3 textes)</td><td class="mono">54</td></tr></table></div>
   <p>Listening : <b>45 min</b>, 100 questions. Reading : <b>75 min</b>, 100 questions. Une mauvaise réponse ne retire pas de points : <span class="hl">ne laisse jamais de case vide</span>.</p>`],
  ["Suffixes : reconnaître la nature d'un mot",`<div class="tbl"><table><tr><th>Nature</th><th>Suffixes</th><th>Exemples</th></tr>
   <tr><td>Nom</td><td>-tion, -ment, -ness, -ity, -ance/-ence, -er/-or, -ee, -ant</td><td>decision, payment, reliability, attendee</td></tr>
   <tr><td>Adjectif</td><td>-ive, -able/-ible, -ful, -ous, -al, -ic, -ent/-ant</td><td>effective, reliable, careful, financial</td></tr>
   <tr><td>Adverbe</td><td>-ly</td><td>quickly, recently, significantly</td></tr>
   <tr><td>Verbe</td><td>-ize, -ify, -en, -ate</td><td>organize, clarify, widen, evaluate</td></tr></table></div>
   <ul><li><b>article / possessif + ___ + nom</b> → adjectif (a <i>reliable</i> supplier)</li>
   <li><b>the + ___ + of</b> → nom (the <i>approval</i> of)</li>
   <li><b>___ + adjectif / verbe / participe</b> → adverbe (<i>highly</i> recommended)</li>
   <li><b>modal / to + ___</b> → verbe à la base (will <i>expand</i>)</li>
   <li><b>-ing</b> = qui provoque (boring) · <b>-ed</b> = qui ressent (bored)</li></ul>`],
  ["Prépositions de temps et de lieu",`<ul><li><b>at</b> + heure (at 3 P.M.) · <b>on</b> + jour ou date (on Monday, on May 5) · <b>in</b> + mois, année, saison (in June)</li>
   <li><b>by</b> = au plus tard (submit by Friday) · <b>until</b> = jusqu'à, l'action dure (open until 9)</li>
   <li><b>for</b> + durée (for 3 years) · <b>since</b> + point de départ (since 2020)</li>
   <li><b>during</b> + nom · <b>while</b> + sujet + verbe</li>
   <li><b>within</b> = dans un délai de (within 30 days) · <b>from … to / through</b> = de … à</li>
   <li><b>between</b> deux éléments · <b>among</b> trois ou plus</li>
   <li><b>responsible for</b>, <b>interested in</b>, <b>familiar with</b>, <b>in charge of</b></li></ul>`],
  ["Connecteurs : + nom ou + phrase ?",`<div class="tbl"><table><tr><th>Sens</th><th>+ nom / V-ing</th><th>+ phrase</th><th>Entre deux phrases</th></tr>
   <tr><td>Cause</td><td>because of, due to, owing to</td><td>because, since, as</td><td>therefore, consequently</td></tr>
   <tr><td>Opposition</td><td>despite, in spite of</td><td>although, even though, whereas</td><td>however, nevertheless</td></tr>
   <tr><td>Ajout</td><td>in addition to, as well as</td><td>—</td><td>moreover, furthermore</td></tr>
   <tr><td>Condition</td><td>in case of</td><td>if, unless, provided that</td><td>otherwise</td></tr></table></div>
   <p>Paires fixes : <b>both … and</b>, <b>either … or</b>, <b>neither … nor</b>, <b>not only … but also</b>.</p>`],
  ["Les temps qui tombent le plus",`<ul><li><b>Present perfect</b> (have + participe) : since, for, already, yet, recently, so far</li>
   <li><b>Prétérit</b> : yesterday, last week, ago, in 2019</li>
   <li><b>Futur</b> : next, tomorrow, soon, upcoming</li>
   <li><b>Futur antérieur</b> (will have + participe) : by the end of, by next year</li>
   <li>Après <b>if / when / as soon as / before</b>, pour parler du futur : présent simple</li>
   <li><b>Passif</b> : le sujet subit l'action → be + participe passé</li>
   <li><b>+ V-ing</b> : suggest, recommend, avoid, consider, enjoy, finish, look forward to</li>
   <li><b>+ to + verbe</b> : plan, decide, hope, agree, need, be required to, be asked to</li></ul>`],
  ["Pièges de la Part 2",`<ul><li>Une question en <b>Wh-</b> n'accepte jamais « Yes / No ».</li>
   <li>Une réponse qui <b>répète un mot</b> de la question est souvent fausse.</li>
   <li>Attention aux <b>sons proches</b> : copy / coffee, meet / meeting, break / brake.</li>
   <li>Les réponses indirectes sont souvent justes : « I'm not sure », « Let me check », « We haven't decided yet ».</li>
   <li><b>Why don't we…?</b>, <b>Let's…</b> et <b>Would you like…?</b> sont des propositions.</li>
   <li>Question à choix (A <b>or</b> B) : on choisit, ou on dit « either is fine ».</li></ul>`],
  ["Stratégie Part 3 et 4",`<ul><li>Pendant les consignes, <b>lis les 3 questions</b> suivantes.</li>
   <li>Repère les mots-clés : <i>Who</i> is the man? <i>Where</i>? <i>What will</i> the woman do <i>next</i>?</li>
   <li>Les réponses arrivent dans l'ordre des questions.</li>
   <li>« What will … do next? » se joue souvent dans la dernière phrase.</li>
   <li>Les bonnes réponses <b>reformulent</b> avec des synonymes au lieu de répéter les mots entendus.</li>
   <li>Si tu rates une question, lâche-la et prépare la suivante.</li></ul>`],
  ["Stratégie Reading : gérer les 75 minutes",`<ul><li>Part 5 : <b>environ 10 min</b> (20 s par question). Regarde d'abord les 4 options : si ce sont des formes du même mot, c'est de la grammaire et tu n'as pas besoin de lire toute la phrase.</li>
   <li>Part 6 : <b>environ 8 min</b>. Pour « insérer une phrase », lis la phrase d'avant et celle d'après.</li>
   <li>Part 7 : <b>environ 55 min</b>. Lis la question d'abord, puis cherche l'information dans le texte.</li>
   <li>Garde 1 minute à la fin pour <b>remplir toutes les cases vides</b>.</li></ul>`],
  ["Phrasal verbs fréquents",`<div class="tbl"><table><tr><th>Verbe</th><th>Sens</th></tr>
   <tr><td>call off</td><td>annuler</td></tr><tr><td>put off</td><td>reporter</td></tr><tr><td>set up</td><td>installer, organiser</td></tr>
   <tr><td>take over</td><td>reprendre (la direction)</td></tr><tr><td>fill out / fill in</td><td>remplir (un formulaire)</td></tr>
   <tr><td>look into</td><td>examiner, étudier</td></tr><tr><td>turn down</td><td>refuser</td></tr><tr><td>carry out</td><td>effectuer, mener</td></tr>
   <tr><td>run out of</td><td>être à court de</td></tr><tr><td>pick up</td><td>aller chercher</td></tr><tr><td>drop off</td><td>déposer</td></tr>
   <tr><td>hand in</td><td>remettre (un document)</td></tr><tr><td>go over</td><td>passer en revue</td></tr><tr><td>figure out</td><td>comprendre, trouver</td></tr></table></div>`],
  ["Le jour J",`<ul><li>Pièce d'identité valide et convocation. Arrive <b>30 minutes</b> en avance.</li>
   <li>Part 1 : élimine les réponses qui décrivent une action que personne ne fait sur la photo.</li>
   <li>Ne bloque jamais plus de 30 secondes sur une question.</li>
   <li>Dors bien la veille : le cerveau consolide le vocabulaire pendant le sommeil.</li></ul>`]
  ];
  $("#main").innerHTML=`<section class="view"><div><p class="eyebrow">Fiches de révision</p><h2>L'essentiel à relire</h2></div>
  ${F.map((f,k)=>`<details class="fiche" ${k===0?"open":""}><summary>${esc(f[0])}</summary><div class="fiche-body">${f[1]}</div></details>`).join("")}
  <div class="card stack"><p class="eyebrow">Ta sauvegarde</p>
    <p class="note">${syncState==="ok"||syncState==="saving"?"Ta progression est enregistrée sur ton compte. Tu la retrouves demain, sur ton téléphone comme sur ton ordinateur.":"Ta progression est enregistrée dans ce navigateur. Utilise toujours le même appareil et le même lien."}</p>
    <div class="row"><button class="btn ghost small" id="reset">Effacer ma progression</button><span id="resetMsg" class="note"></span></div></div></section>`;
  let armed=false;
  $("#reset").onclick=()=>{if(!armed){armed=true;$("#reset").textContent="Confirmer l'effacement";$("#resetMsg").textContent="Cartes, scores et carnet d'erreurs seront supprimés partout.";return}
    S=blank();save();vq=null;quiz=null;renderHeader();$("#resetMsg").textContent="Progression effacée.";$("#reset").textContent="Effacer ma progression";armed=false};
}

/* ================= NAVIGATION ================= */
const VIEWS={accueil:homeView,vocab:vocabView,grammaire:grammarView,ecoute:listenView,fiches:fichesView};
let current="accueil";
function route(){
  const v=(location.hash||"#accueil").slice(1);const name=VIEWS[v]?v:"accueil";current=name;
  if(quiz&&!((name==="grammaire"&&quiz.kind==="g")||(name==="ecoute"&&quiz.kind==="l"))){stopTimer();quiz=null}
  try{speechSynthesis.cancel()}catch(e){}
  document.querySelectorAll("nav.tabs a").forEach(a=>a.setAttribute("aria-current",a.dataset.v===name?"page":"false"));
  renderHeader();VIEWS[name]();
}
function softRefresh(){renderHeader();if(!quiz&&(current!=="vocab"||!vq||vq.i===0)){vq=null;VIEWS[current]()}}
window.addEventListener("hashchange",()=>{route();window.scrollTo({top:0})});
route();setSync("local");initSync();
})();
</script>
